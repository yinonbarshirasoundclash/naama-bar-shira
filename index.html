<style>
/* ============ TOKENS - dark-first: the twilight hour is the native state ============ */
:root{
  --ink:#04050A; --ink-2:#0A0C16; --ink-3:#131624;
  --gold:#C9A356; --gold-soft:#E4C889; --ember:#D9663E;
  --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3);
  /* the two greys sat at the AA floor and read as washed out at small sizes;
     these clear it comfortably and still keep the hierarchy */
  --text:#EFE9DE; --text-dim:#C7C0AF; --muted:#A8A190;
  --line:rgba(201,163,86,.20); --line-strong:rgba(201,163,86,.42);
  --glow:rgba(201,163,86,.10);
  --sky-top:#020307; --sky-mid:#0E0B26; --sky-low:#2E1B34; --sky-horizon:#7E4029; --city:#010204;
  --shadow:0 24px 60px -28px rgba(0,0,0,.85);
  --cover-a:#1B1440; --cover-b:#05070F; --cover-c:#3B2340;
  --cover-text:#F1E8D7; --cover-label:#E4C889; --cover-line:rgba(201,163,86,.38);

  --f-display:"Frank Ruhl Libre",'Times New Roman',serif;
  --f-display-lat:"Cormorant Garamond",'Times New Roman',serif;
  --f-body:"Assistant",'Segoe UI',system-ui,sans-serif;

  --measure:66ch; --pad:clamp(1.1rem,4vw,2.6rem);
  --rhythm:clamp(3.2rem,8vw,6.5rem);
}
*,*::before,*::after{box-sizing:border-box}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body{
  margin:0; background:var(--bg); color:var(--text);
  /* 300 was too thin for light-on-dark: strokes thinned out and readers called
     it low contrast. 400 fixes more of the complaint than any colour change. */
  font-family:var(--f-body); font-weight:400; font-size:clamp(1.06rem,.6vw + .95rem,1.18rem);
  line-height:1.72; -webkit-font-smoothing:antialiased;
}
[dir="ltr"] body{font-family:var(--f-body)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ TYPE ============ */
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.16;text-wrap:balance;margin:0}
[dir="ltr"] h1,[dir="ltr"] h2,[dir="ltr"] h3,[dir="ltr"] .serif-lat{font-family:var(--f-display-lat);font-weight:400}
h1{font-size:clamp(2.4rem,6.2vw,4.6rem);font-weight:900;letter-spacing:-.015em}
h2{font-size:clamp(1.75rem,3.6vw,2.8rem)}
h3{font-size:clamp(1.15rem,1.8vw,1.42rem);font-weight:700}
p{margin:0}
.eyebrow{
  font-family:var(--f-body);font-size:.78rem;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--gold);display:block;
}
[dir="rtl"] .eyebrow{letter-spacing:.14em}
/* The opening line is the tagline, so it carries display type and gold - the
   paragraph under it stays quiet and explains. */
.hero-kick{
  font-family:var(--f-display);font-weight:700;color:var(--gold-soft);
  font-size:clamp(1.16rem,1.9vw,1.55rem);line-height:1.35;
  max-width:var(--measure);margin-block-end:.2rem;
}
[dir="ltr"] .hero-kick{font-family:var(--f-display-lat);font-weight:600}
.lede{font-size:clamp(1.06rem,1.4vw,1.28rem);color:var(--text-dim);line-height:1.66;max-width:var(--measure)}
.dim{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.fnav .num,.qhead .num{direction:ltr;unicode-bidi:isolate}

/* ============ SHELL ============ */
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--pad)}
.narrow{max-width:760px}
.stack{display:flex;flex-direction:column}
.g-xs{gap:.5rem}.g-s{gap:.9rem}.g-m{gap:1.6rem}.g-l{gap:2.6rem}.g-xl{gap:clamp(3rem,6vw,5rem)}
section.band{padding-block:var(--rhythm)}
.rule{height:1px;background:linear-gradient(to var(--to,right),transparent,var(--line-strong),transparent);border:0;margin:0}

/* ============ NAV ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(14px) saturate(1.2);
  background:color-mix(in oklab,var(--bg) 84%,transparent);
  border-block-end:1px solid var(--line);
}
.topbar-in{display:flex;align-items:center;gap:.5rem;min-height:66px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-inline-end:auto;text-align:start}
.brand b{font-family:var(--f-display);font-size:1.16rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
[dir="ltr"] .brand b{font-family:var(--f-display-lat);font-weight:600}
.brand span{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.nav{display:flex;gap:.05rem;flex-wrap:nowrap}
.nav button{
  padding:.42rem .56rem;font-size:.83rem;color:var(--text-dim);border-radius:2px;
  position:relative;transition:color .2s;white-space:nowrap;
}
/* the English labels are longer than the Hebrew ones - they need the row tighter */
[dir="ltr"] .nav button{padding-inline:.3rem;font-size:.78rem}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{color:var(--gold-soft)}
.nav button[aria-current="page"]::after{
  content:"";position:absolute;inset-inline:.56rem;bottom:.12rem;height:1px;background:var(--gold);
}
.tools{display:flex;align-items:center;gap:.4rem}
.chip{
  border:1px solid var(--line-strong);border-radius:999px;padding:.3rem .72rem;
  font-size:.8rem;letter-spacing:.06em;color:var(--text-dim);transition:.2s;
}
.chip:hover{color:var(--gold-soft);border-color:var(--gold)}
.chip b{font-weight:700;color:var(--gold-soft)}
.navtoggle.chip{display:none}  /* .chip sets inline-flex later in the sheet - keep this rule stronger */
/* The nav collapses when the labels stop fitting on one line, not at a fixed
   width - the Hebrew and English label sets are different lengths. fitNav()
   measures the bar and sets body[data-nav="compact"]. */
body[data-nav="compact"] .navtoggle.chip{display:inline-flex;font-size:1.15rem;line-height:1;padding:.28rem .55rem}
body[data-nav="compact"] .nav{
  position:fixed;inset-block-start:66px;inset-inline:0;background:var(--surface);
  border-block-end:1px solid var(--line);flex-direction:column;gap:0;padding:.5rem var(--pad) 1.1rem;
  display:none;
  /* Fourteen items are taller than a phone screen, and a fixed element cannot
     be scrolled by the page - the items below the fold were unreachable. */
  max-block-size:calc(100dvh - 66px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
body[data-nav="compact"] .nav[data-open="true"]{display:flex}
body[data-nav="compact"] .nav button{padding:.8rem .2rem;font-size:1.05rem;text-align:start;border-block-end:1px solid var(--line)}
body[data-nav="compact"] .nav button[aria-current="page"]::after{display:none}

.crosslink{
  display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center;justify-content:space-between;
  border:1px solid var(--line);padding:1.3rem 1.4rem;
  background:color-mix(in oklab,var(--surface) 55%,transparent);
}
.crosslink b{font-family:var(--f-display);color:var(--gold-soft);font-size:1.12rem}
[dir="ltr"] .crosslink b{font-family:var(--f-display-lat)}
.crosslink p{max-width:56ch;font-size:.9rem}

/* ============ QUIZZES ============ */
.gtoggle{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.qcards{display:grid;grid-template-columns:1fr;gap:1.2rem}
@media (min-width:820px){.qcards{grid-template-columns:1fr 1fr}}
.qcard{
  border:1px solid var(--line);padding:1.4rem;display:flex;flex-direction:column;gap:1.1rem;align-items:flex-start;
  background:color-mix(in oklab,var(--surface) 55%,transparent);
}
.qfaces{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;width:100%}
.qfaces img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 22%;border:1px solid var(--line-strong);background:var(--cover-b)}
.qfaces.is-plate img{object-fit:contain;background:#E9DFC9}
.qfaces.is-leg img{object-fit:cover;object-position:center;background:var(--surface-2)}
/* the placement is the long one, so it gets the full width under the other two */
@media (min-width:820px){.qcard.is-lq{grid-column:1 / -1}}
.lqline,.lqgate{
  border:1px solid var(--line-strong);background:color-mix(in oklab,var(--surface) 55%,transparent);
  padding:1.4rem;display:flex;flex-direction:column;gap:.8rem;align-items:flex-start;
}
.lqline p,.lqgate p{margin:0}
.lqbtns{display:flex;flex-wrap:wrap;gap:.6rem}
.lqgate{border-color:var(--gold);background:var(--glow);gap:1rem}
.lqgate h2{margin:0;font-size:clamp(1.5rem,3.2vw,2rem)}

.qbar{block-size:2px;background:var(--line);position:relative}
.qbar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold);transition:inline-size .3s}
.qhead{display:flex;align-items:center;justify-content:space-between}
.qback{font-size:.85rem;color:var(--text-dim)}
.qback:hover{color:var(--gold-soft)}
/* The only complaint about the quiz was not knowing how to get out of it, so
   the exit sits at the top of every quiz screen, in the same spot each time. */
.qexit{
  align-self:start;display:inline-flex;align-items:center;gap:.4rem;
  border:1px solid var(--line-strong);padding:.45rem .9rem;border-radius:2px;
  font-size:.85rem;color:var(--text-dim);transition:.2s;
}
.qexit:hover{border-color:var(--gold);color:var(--gold-soft)}
.qback:hover{color:var(--gold-soft)}
.qq{font-size:clamp(1.35rem,3.4vw,1.9rem)}
.qopts{display:grid;gap:.55rem}
.qopt{
  border:1px solid var(--line-strong);padding:.95rem 1.1rem;text-align:start;
  color:var(--text-dim);line-height:1.5;transition:.18s;
  background:color-mix(in oklab,var(--surface) 40%,transparent);
}
.qopt:hover{color:var(--text);border-color:var(--gold);transform:translateX(0)}
[dir="rtl"] .qopt:hover{transform:translateX(-3px)}
[dir="ltr"] .qopt:hover{transform:translateX(3px)}
.qopt.is-on{border-color:var(--gold);color:var(--text)}

.qresult{display:grid;grid-template-columns:1fr;gap:1.6rem;align-items:start}
@media (min-width:800px){.qresult{grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:2.2rem}}
.qrimg img{width:100%;height:auto;display:block;border:1px solid var(--line-strong);background:var(--cover-b)}
.qrimg.is-plate img{background:#E9DFC9}
.qrimg.is-leg img{background:var(--surface-2)}
.qrkick{color:var(--gold-soft);font-size:.82rem;letter-spacing:.1em}
.qchips{display:flex;flex-wrap:wrap;gap:.4rem;margin-block-start:.3rem}
.qchip{border:1px solid var(--line-strong);border-radius:999px;padding:.28rem .75rem;font-size:.82rem;color:var(--text-dim)}
.qacts{display:flex;flex-wrap:wrap;gap:.5rem;margin-block-start:1rem}

.qbars,.qtal{display:grid;gap:.35rem;margin-block-start:1.1rem;max-width:34rem}
.qbrow,.qtrow{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 2.4rem;gap:.7rem;align-items:center;font-size:.82rem;color:var(--text-dim)}
.qtn{text-align:end;color:var(--gold-soft)}
.qtotal{font-family:var(--f-display);color:var(--text);font-size:1.02rem}
[dir="ltr"] .qtotal{font-family:var(--f-display-lat)}
.qbrow i,.qtrow i{display:block;block-size:5px;background:var(--line);position:relative}
.qbrow b,.qtrow b{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold);display:block}
.qtrow b{background:var(--gold-soft)}
/* it sits above the cards now, so the rule belongs under it, not over it */
.qgrand{
  margin:0;border-block-end:1px solid var(--line);padding-block-end:1.1rem;
  font-family:var(--f-display);font-size:clamp(1.1rem,2.2vw,1.35rem);color:var(--gold-soft);
  font-variant-numeric:tabular-nums;
}
[dir="ltr"] .qgrand{font-family:var(--f-display-lat)}
.qcounter{display:grid;gap:1.6rem;border-block-start:1px solid var(--line);padding-block-start:1.6rem}
@media (min-width:820px){.qcounter{grid-template-columns:1fr 1fr;gap:2.4rem}}
.qcounter.is-one{grid-template-columns:1fr}

/* ============ APPENDICES ============ */
.h3{font-family:var(--f-display);font-size:1.32rem;color:var(--text)}
[dir="ltr"] .h3{font-family:var(--f-display-lat)}

.circles{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;max-width:44rem}
.circles li{
  display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.15rem .9rem;align-items:baseline;
  border-block-end:1px solid var(--line);padding-block:.62rem;
}
.circles .cnum{grid-area:1/1/3/2;color:var(--gold);font-size:1.05rem;align-self:center}
.circles .cname{grid-area:1/2/2/3;font-family:var(--f-display);color:var(--text);font-size:1.02rem}
[dir="ltr"] .circles .cname{font-family:var(--f-display-lat)}
.circles .csin{grid-area:2/2/3/3;color:var(--text-dim);font-size:.84rem}
.circles .cruler{grid-area:1/3/3/4;align-self:center;color:var(--gold-soft);font-size:.84rem;letter-spacing:.04em}

/* the plates are ink on paper - they stay warm objects on the dark page */
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem .8rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:1.15rem .9rem}
/* a button lays its children out as blocks - flex inside one drops the caption
   outside the box in Chrome, so the plate stacks plain blocks instead */
/* a real <button> wraps its children in an anonymous flex box that clips the
   caption, so the plate is a div with a button role instead */
.dplate{display:block;width:100%;text-align:start;cursor:pointer}
.pshot{
  display:block;border:1px solid var(--line-strong);background:#E9DFC9;
  transition:border-color .25s, transform .25s;position:relative;
}
.pshot img{width:100%;height:auto;display:block}
.dplate:hover .pshot,.dplate:focus-visible .pshot{border-color:var(--gold);transform:translateY(-3px)}
/* The Sheol plates carry no frame of their own and are not meant to sit in one -
   a border here would put back exactly the tidiness the paintings avoid. */
.pgrid.is-sheol{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.4rem 1.1rem}
.pgrid.is-sheol .pshot{border:0;background:#0B0906;box-shadow:0 10px 30px -14px rgba(0,0,0,.9)}
.pgrid.is-sheol .dplate:hover .pshot,.pgrid.is-sheol .dplate:focus-visible .pshot{
  box-shadow:0 14px 34px -12px rgba(0,0,0,1);transform:translateY(-3px);
}
.pgrid.is-sheol .pname{color:var(--gold-soft);font-size:1rem}
/* Always on, not only on hover - on a phone there is no hover to discover it with */
.plate .cap{position:relative}
.plate .pmore{position:absolute;inset-block-start:-.2rem;inset-inline-end:.5rem;inset-block-end:auto}
.pmore{
  position:absolute;inset-block-end:.4rem;inset-inline-end:.4rem;
  inline-size:1.6rem;block-size:1.6rem;border-radius:50%;
  display:grid;place-items:center;font-size:1rem;line-height:1;font-weight:700;
  background:rgba(11,15,28,.82);color:var(--gold-soft);border:1px solid var(--gold);
  transition:.22s;
}
.dplate:hover .pmore,.dplate:focus-visible .pmore{background:var(--gold);color:#0B0F1C}
/* A one-line instruction that is not styled like small print */
.hint{
  display:inline-flex;align-items:center;gap:.55rem;width:max-content;max-width:100%;
  border:1px solid var(--line-strong);padding:.5rem .85rem;border-radius:2px;
  font-size:.86rem;color:var(--gold-soft);
  background:color-mix(in oklab,var(--surface) 45%,transparent);
}
.hintdot{
  inline-size:1.35rem;block-size:1.35rem;border-radius:50%;flex:none;
  display:grid;place-items:center;font-size:.9rem;font-weight:700;line-height:1;
  background:var(--gold);color:#0B0F1C;
}
.dplate .pname{display:block;margin-block-start:.5rem;font-family:var(--f-display);color:var(--text);font-size:.92rem;line-height:1.25}
[dir="ltr"] .dplate .pname{font-family:var(--f-display-lat)}
.dplate .prole{display:block;margin-block-start:.15rem;color:var(--text-dim);font-size:.8rem;line-height:1.35}

.loreview{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:1.6rem;align-items:start}
.loreplate{width:100%;height:auto;border:1px solid var(--line-strong);background:#E9DFC9}
.loreview p{color:var(--text-dim);line-height:1.75}
@media (max-width:640px){ .loreview{grid-template-columns:1fr} .loreplate{max-width:220px} }

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.dcard{
  border:1px solid var(--line);padding:1rem 1.1rem;text-align:start;
  background:color-mix(in oklab,var(--surface) 55%,transparent);
}
.dcard b{display:block;font-family:var(--f-display);color:var(--gold-soft);font-size:1rem;margin-block-end:.4rem}
[dir="ltr"] .dcard b{font-family:var(--f-display-lat)}
.dcard p{color:var(--text-dim);font-size:.93rem;line-height:1.65}
.agechip{
  font-size:.7rem;color:var(--text-dim);border:1px solid var(--line-strong);
  border-radius:999px;padding:.1rem .5rem;margin-inline-start:.35rem;vertical-align:.1em;
}

.eradiv{display:flex;align-items:baseline;gap:.8rem;border-block-end:1px solid var(--line-strong);padding-block-end:.5rem;margin-block-start:1.4rem}
.eradiv span{font-family:var(--f-display);color:var(--gold-soft);font-size:1.05rem}
[dir="ltr"] .eradiv span{font-family:var(--f-display-lat)}
.eradiv i{color:var(--text-dim);font-size:.78rem;letter-spacing:.1em;font-style:normal;text-transform:uppercase}

.gens{list-style:none;margin:0;padding:0;max-width:62rem}
.gens li{display:grid;grid-template-columns:2.2rem clamp(3.4rem,13vw,4.8rem) 1fr;gap:.9rem;
  padding-block:.85rem;border-block-end:1px solid var(--line);align-items:start}
.gens li[role="button"]{cursor:pointer}
.gshot{display:block;position:relative;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden;
  background:#0B0906;transition:border-color .25s,transform .25s}
.gshot img{width:100%;height:auto;display:block;aspect-ratio:3/4;object-fit:cover}
.gens li[role="button"]:hover .gshot,.gens li[role="button"]:focus-visible .gshot{
  border-color:var(--gold);transform:translateY(-2px)}
.gshot.is-empty{aspect-ratio:3/4;display:grid;place-items:center;color:var(--text-dim);font-size:.7rem;
  text-align:center;padding:.3rem;line-height:1.3}
.gens .gnum{color:var(--gold);font-size:.9rem;padding-block-start:.15rem}
.gens b{display:block;font-family:var(--f-display);color:var(--text);font-size:1rem;margin-block-end:.25rem}
[dir="ltr"] .gens b{font-family:var(--f-display-lat)}
.gens .gyear{color:var(--gold-soft);font-size:.78rem;margin-inline-start:.4rem}
.gens p{color:var(--text-dim);font-size:.88rem;line-height:1.7}

/* ============ THE GATE - arch motif drawn from her titles ============ */
.gate{position:relative;display:grid;place-items:center;isolation:isolate}
.gate-svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.arch{
  --w:min(88vw,620px);
  width:var(--w);aspect-ratio:3/4.1;
  border-start-start-radius:var(--w);border-start-end-radius:var(--w);
  border:1px solid var(--line-strong);
  background:linear-gradient(to bottom,var(--sky-top),var(--sky-mid) 42%,var(--sky-low) 76%,var(--sky-horizon));
  position:relative;overflow:hidden;
}
.arch::after{
  content:"";position:absolute;inset:8px;
  border-start-start-radius:var(--w);border-start-end-radius:var(--w);
  border:1px solid var(--glow);
}

/* ============ HERO ============ */
.hero{position:relative;min-height:min(78vh,700px);display:grid;align-items:center;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,transparent 62%,color-mix(in oklab,var(--bg) 88%,transparent) 92%,var(--bg));
}
.hero-in{position:relative;z-index:2;padding-block:clamp(4rem,11vw,8rem)}
.hero h1{margin-block:.6rem .1rem}
.hero .lede{margin-block-start:1.3rem}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-block-start:2rem}
@media (max-width:620px){
  /* four awards read as two tidy rows on a phone, not three ragged ones */
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
  .badge{font-size:.7rem;padding:.38rem .6rem;gap:.3rem;justify-content:center;text-align:center;
         flex-direction:column;line-height:1.25}
}
.badge{
  display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.04em;
  border:1px solid var(--line-strong);padding:.4rem .8rem;border-radius:999px;
  background:color-mix(in oklab,var(--surface) 70%,transparent);color:var(--text-dim);
}
.badge b{color:var(--gold-soft);font-weight:600}
button.badge{cursor:pointer;font-family:inherit;text-align:start;transition:border-color .2s,background .2s,color .2s}
button.badge:hover,button.badge:focus-visible{border-color:var(--gold);color:var(--text);
  background:color-mix(in oklab,var(--surface) 100%,transparent)}
button.badge:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cta-row{display:flex;flex-wrap:wrap;gap:.7rem;margin-block-start:2.2rem}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.55rem;padding:.72rem 1.5rem;
  border:1px solid var(--gold);color:var(--gold-soft);font-size:.9rem;font-weight:600;
  letter-spacing:.05em;border-radius:2px;transition:.22s;background:transparent;
  text-decoration:none;                 /* an <a> styled as a button is still a button */
  /* Readers noticed buttons of different heights sitting side by side, and
     labels drifting left or right inside them. One shape, one alignment. */
  justify-content:center;text-align:center;
  min-block-size:2.9rem;line-height:1.25;
}
.btn-sm{min-block-size:2.4rem}
.btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn-solid{background:var(--gold);color:#0B0F1C;border-color:var(--gold)}
.btn-solid:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:#0B0F1C}
.btn-quiet{border-color:var(--line-strong);color:var(--text-dim)}
.btn-quiet:hover{background:transparent;color:var(--gold-soft);border-color:var(--gold)}
.btn-sm{padding:.46rem 1rem;font-size:.85rem}

/* ============ CARDS / GRIDS ============ */
.grid{display:grid;gap:1.4rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gworlds{grid-template-columns:1fr;gap:1.6rem}
@media (min-width:880px){.gworlds{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{
  border:1px solid var(--line);background:color-mix(in oklab,var(--surface) 86%,transparent);padding:1.5rem;
  display:flex;flex-direction:column;gap:.75rem;transition:.25s;position:relative;
}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px)}

/* Book cover placeholder - becomes a real <img> by swapping the inner element */
.cover{
  aspect-ratio:2/3;position:relative;overflow:hidden;
  border:1px solid var(--cover-line);
  background:linear-gradient(155deg,var(--cover-a),var(--cover-b) 55%,var(--cover-c));
  display:grid;place-items:center;padding:1.1rem;text-align:center;
}
.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cover .ct{
  display:block;font-family:var(--f-display);font-weight:700;
  font-size:clamp(.78rem,1.5vw,1rem);line-height:1.32;
  color:var(--cover-text);text-shadow:0 2px 14px rgba(0,0,0,.65);
}
.cover .cs{
  display:block;font-size:.6rem;letter-spacing:.16em;line-height:1.5;
  text-transform:uppercase;color:var(--cover-label);margin-block-end:.55rem;
  padding-block-end:.5rem;border-block-end:1px solid var(--cover-line);
}
.cover::after{content:"";position:absolute;inset:6px;border:1px solid var(--cover-line);pointer-events:none}
.cover.mini{padding:0}
.cover.mini .cs,.cover.mini .ct,.cover.mini .cover-flag{display:none}
.cover.has-img{padding:0;background:var(--cover-b)}
.cover.has-img::after{display:none}
.cover.has-img.mini::before{display:none}
.cover.mini::before{
  content:"";position:absolute;inset:22% 26%;border:1px solid var(--cover-line);
  border-start-start-radius:99px;border-start-end-radius:99px;
}
.cover-flag{
  position:absolute;inset-block-start:0;inset-inline-start:0;z-index:2;
  background:var(--gold);color:var(--cover-b);font-size:.64rem;font-weight:700;
  letter-spacing:.1em;padding:.28rem .6rem;
}

.book{display:flex;flex-direction:column;gap:.7rem;height:100%}
.book > .btn{margin-block-start:auto}
.book .meta{display:flex;flex-direction:column;gap:.2rem}
.book h3{font-size:1.02rem;line-height:1.3}
.price{display:flex;align-items:baseline;gap:.5rem;font-variant-numeric:tabular-nums}
.price .now{color:var(--gold-soft);font-weight:700;font-size:1.05rem}
.price .was{color:var(--muted);text-decoration:line-through;font-size:.84rem}

/* ============ WORLD PANELS ============ */
.world{
  border:1px solid var(--line);background:
    linear-gradient(to bottom,color-mix(in oklab,var(--surface) 92%,transparent),var(--surface));
  padding:clamp(1.4rem,3vw,2.4rem);display:flex;flex-direction:column;gap:1rem;
  position:relative;overflow:hidden;
}
.world::before{
  content:"";position:absolute;inset-block-start:-40%;inset-inline-end:-18%;
  width:60%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 68%);pointer-events:none;
}
.world .wnum{
  font-family:var(--f-display-lat);font-size:.8rem;letter-spacing:.24em;color:var(--gold);
}
.taglist{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{font-size:.72rem;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);padding:.22rem .55rem;border-radius:999px}

/* a link whose URL has not been supplied yet reads as unavailable, not broken */
.is-pending{opacity:.42;cursor:default;pointer-events:none}

/* ============ GALLERY ============ */
.gal{display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.gal{grid-template-columns:repeat(4,1fr)}}
.plate{
  position:relative;overflow:hidden;border:1px solid var(--cover-line);
  background:var(--cover-b);aspect-ratio:47/66;cursor:zoom-in;display:block;width:100%;
  border-start-start-radius:60% 22%;border-start-end-radius:60% 22%;
}
.plate img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.plate:hover img{transform:scale(1.045)}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(201,163,86,.30);
  border-start-start-radius:60% 22%;border-start-end-radius:60% 22%;
}
.plate .cap{
  position:absolute;inset-inline:0;inset-block-end:0;padding:1.5rem .7rem .75rem;
  background:linear-gradient(to top,rgba(4,6,12,.93),rgba(4,6,12,.6) 55%,transparent);
  display:flex;flex-direction:column;gap:.1rem;text-align:center;
}
.plate .cap b{
  font-family:var(--f-display);font-size:1.08rem;font-weight:700;color:#F3EAD9;letter-spacing:.01em;
}
[dir="ltr"] .plate .cap b{font-family:var(--f-display-lat);font-weight:600}
.plate .cap span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}

/* ============ INTERNATIONAL ============ */
.intl{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-block-start:.4rem}
.intlcard{margin:0;display:flex;flex-direction:column;gap:.75rem}
.intlimg{
  display:block;width:100%;aspect-ratio:4/3;overflow:hidden;padding:0;
  border:1px solid var(--line-strong);background:var(--cover-b);cursor:zoom-in;
}
.intlimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.intlimg:hover img{transform:scale(1.05)}
.intlcard figcaption{display:flex;flex-direction:column;gap:.2rem}
.intlcard b{font-family:var(--f-display-lat);font-weight:600;font-size:1rem;color:var(--gold-soft)}
.intlcard span{font-size:.86rem;color:var(--text-dim);line-height:1.55}

/* ============ PAGE HERO ============ */
.phero{
  position:relative;isolation:isolate;overflow:hidden;
  display:grid;align-items:end;
  min-height:clamp(15rem,30vw,23rem);
  padding-block:clamp(3rem,7vw,5rem) clamp(1.6rem,4vw,2.6rem);
  border-block-end:1px solid var(--line);
}
.phero-img{
  position:absolute;inset:0;z-index:-2;
  background-size:cover;background-position:var(--pos,center 40%);
  filter:saturate(.7) contrast(1.05);
  opacity:var(--op,.42);
}
.phero::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(to bottom,color-mix(in oklab,var(--bg) 72%,transparent),color-mix(in oklab,var(--bg) 30%,transparent) 38%,color-mix(in oklab,var(--bg) 88%,transparent) 78%,var(--bg)),
    linear-gradient(to var(--edge,left),transparent 45%,color-mix(in oklab,var(--bg) 70%,transparent));
}
[dir="rtl"] .phero::after{--edge:right}
.phero-in{position:relative;z-index:1}
.phero .lede{color:var(--text)}
.phero + .band{padding-block-start:clamp(2.4rem,5vw,3.4rem)}

/* ============ FIELD GALLERY ============ */
.tabn{font-size:.72rem;opacity:.65;font-variant-numeric:tabular-nums}
.fgrid{
  columns:2 190px;column-gap:.7rem;
}
@media (min-width:760px){.fgrid{columns:3 230px}}
@media (min-width:1080px){.fgrid{columns:4 230px}}
.fcell{
  position:relative;overflow:hidden;padding:0;display:block;width:100%;
  border:1px solid var(--line);background:var(--cover-b);cursor:zoom-in;
  break-inside:avoid;margin-block-end:.7rem;
}
.fcell img{width:100%;height:auto;display:block;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.fcell:hover img{transform:scale(1.04)}
.fcell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(201,163,86,.16);pointer-events:none}
.fcap{
  position:absolute;inset-inline:0;inset-block-end:0;padding:1.6rem .7rem .6rem;
  background:linear-gradient(to top,rgba(4,6,12,.9),transparent);
  color:#EFE6D5;font-size:.78rem;line-height:1.35;text-align:start;
  opacity:0;transform:translateY(6px);transition:.28s;
}
.fcell:hover .fcap,.fcell:focus-visible .fcap{opacity:1;transform:none}
@media (hover:none){.fcap{opacity:1;transform:none}}

.fview{margin:0;display:flex;flex-direction:column;gap:1rem;align-items:center}
.fview img{max-width:100%;max-height:72vh;object-fit:contain;border:1px solid var(--line-strong)}
.fview figcaption{display:flex;flex-direction:column;gap:.3rem;align-items:center;text-align:center}
.fview figcaption b{font-family:var(--f-display);font-size:1.15rem}
[dir="ltr"] .fview figcaption b{font-family:var(--f-display-lat);font-weight:600}
.fnav{display:flex;align-items:center;gap:1.2rem;margin-block-start:.5rem}
.fnav button{
  width:2.2rem;height:2.2rem;border:1px solid var(--line-strong);border-radius:999px;
  color:var(--gold-soft);font-size:1.3rem;line-height:1;display:grid;place-items:center;transition:.2s;
}
.fnav button:hover{border-color:var(--gold);background:var(--glow)}

/* ============ BRAND MARKS ============ */
.chip svg,.btn svg,.socialmark svg{
  width:1em;height:1em;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.chip{display:inline-flex;align-items:center;gap:.42rem}
.socialmark{display:grid;place-items:center;width:2rem;height:2rem;color:var(--gold-soft)}
.socialmark svg{width:1.35rem;height:1.35rem;stroke-width:1.5}

/* ============ SOCIAL CARDS ============ */
.socialgrid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.socialcard{
  display:flex;flex-direction:column;gap:.2rem;text-decoration:none;
  border:1px solid var(--line-strong);padding:1.1rem 1.3rem;transition:.22s;
  background:color-mix(in oklab,var(--surface) 70%,transparent);
}
.socialcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.socialcard b{font-family:var(--f-display);font-size:1.08rem;color:var(--gold-soft)}
[dir="ltr"] .socialcard b{font-family:var(--f-display-lat);font-weight:600}
.socialcard span{font-size:.84rem;color:var(--muted)}

/* ============ BOOK PANEL ============ */
.lb-book{align-items:start;overflow-y:auto}
.lb-panel{
  position:relative;width:min(96vw,880px);margin-block:auto;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  padding:clamp(1.4rem,4vw,2.8rem);
}
.lb-close{
  position:absolute;inset-block-start:.7rem;inset-inline-end:.7rem;z-index:2;
  border:1px solid var(--line-strong);border-radius:999px;width:2rem;height:2rem;
  display:grid;place-items:center;color:var(--text-dim);
}
.lb-close:hover{color:var(--gold-soft);border-color:var(--gold)}
.bookwrap{display:grid;gap:clamp(1.4rem,4vw,2.6rem);grid-template-columns:1fr;align-items:start}
@media (min-width:720px){.bookwrap{grid-template-columns:230px 1fr}}
.bookaside{max-width:230px}
.bookbuy{
  display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;
  margin-block-start:1.2rem;padding-block-start:1.2rem;border-block-start:1px solid var(--line);
}
.lb-panel{padding-block-start:clamp(2.6rem,5vw,3.2rem) !important}
.jacket{display:flex;flex-direction:column;gap:.9rem;margin-block-start:.5rem}
.jacket p{font-size:1rem;line-height:1.75;color:var(--text-dim);max-width:60ch}
.bq{
  margin:0;border-inline-start:2px solid var(--gold);padding-inline-start:1.1rem;
  font-family:var(--f-display);font-size:1.08rem;line-height:1.6;font-weight:300;color:var(--text);
}
[dir="ltr"] .bq{font-family:var(--f-display-lat);font-style:italic}
.warn{
  border:1px solid var(--ember);padding:.8rem 1rem;font-size:.88rem;line-height:1.6;
  color:var(--text-dim);background:color-mix(in oklab,var(--ember) 8%,transparent);
}
.warn b{color:var(--ember)}
.bookbtns{display:flex;gap:.5rem;flex-wrap:wrap}
.bookbtns .btn{flex:1 1 auto}

/* ============ LIGHTBOX ============ */
.lb{
  position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:clamp(1rem,4vw,3rem);
  background:rgba(4,6,12,.93);backdrop-filter:blur(6px);
}
.lb[data-open="true"]{display:grid}
.lb img{max-width:min(92vw,760px);max-height:88vh;object-fit:contain;border:1px solid var(--line-strong)}
/* direct child only - a descendant selector here pins every button inside the book panel */
.lb > button{
  position:absolute;inset-block-start:1rem;inset-inline-end:1rem;
  border:1px solid var(--line-strong);border-radius:999px;padding:.4rem .8rem;color:#EFE6D5;font-size:.9rem;
}

/* ============ REVIEWS ============ */
.revgrid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.revgrid-big{grid-template-columns:1fr}
@media (min-width:900px){.revgrid-big{grid-template-columns:repeat(3,1fr)}}
.rev{
  margin:0;border:1px solid var(--line);padding:1.5rem 1.6rem 1.3rem;
  background:color-mix(in oklab,var(--surface) 82%,transparent);
  display:flex;flex-direction:column;gap:1rem;position:relative;transition:.25s;
}
.rev:hover{border-color:var(--line-strong)}
.rev::before{
  content:"”";position:absolute;inset-block-start:.15rem;inset-inline-start:1.1rem;
  font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--gold);opacity:.3;
}
[dir="ltr"] .rev::before{content:"“";font-family:var(--f-display-lat)}
.rev blockquote{
  margin:0;font-family:var(--f-display);font-weight:300;line-height:1.62;
  font-size:1rem;color:var(--text);
}
[dir="ltr"] .rev blockquote{font-family:var(--f-display-lat);font-size:1.06rem}
.rev-big blockquote{font-size:clamp(1.08rem,1.5vw,1.28rem);line-height:1.55}
.rev figcaption{
  display:flex;flex-direction:column;gap:.12rem;margin-block-start:auto;
  padding-block-start:.85rem;border-block-start:1px solid var(--line);
}
.rev figcaption b{font-size:.9rem;font-weight:600;color:var(--gold-soft);letter-spacing:.02em}
.rev figcaption span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ============ CREDENTIALS ============ */
.creds{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cred{
  border-inline-start:2px solid var(--gold);padding-inline-start:.9rem;
  display:flex;flex-direction:column;gap:.15rem;
}
.cred b{font-family:var(--f-display);font-size:1rem;color:var(--gold-soft)}
[dir="ltr"] .cred b{font-family:var(--f-display-lat);font-weight:600}
.cred span{font-size:.84rem;color:var(--muted);line-height:1.5}

/* ============ ACCOLADES ============ */
.acc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.acc li{
  font-size:.8rem;line-height:1.45;color:var(--gold-soft);
  padding-inline-start:.95rem;position:relative;
}
.acc li::before{
  content:"";position:absolute;inset-inline-start:0;inset-block-start:.55em;
  width:5px;height:5px;background:var(--gold);transform:rotate(45deg);
}

/* ============ AGE / CONTENT LABEL ============ */
.mature{
  display:inline-flex;align-items:center;gap:.4rem;align-self:flex-start;
  font-size:.7rem;font-weight:600;letter-spacing:.1em;
  color:var(--ember);border:1px solid var(--ember);border-radius:999px;padding:.16rem .6rem;
}
.mature-note{font-size:.78rem;color:var(--muted);line-height:1.5}
.startline{
  display:flex;gap:.5rem;align-items:baseline;font-size:.82rem;color:var(--gold-soft);
  border-block-start:1px solid var(--line);padding-block-start:.8rem;margin-block-start:.2rem;
}
.startline::before{content:"→";opacity:.6}
[dir="rtl"] .startline::before{content:"←"}

/* ============ READING ORDER ============ */
.otabs{display:flex;flex-wrap:wrap;gap:.4rem}
.otab{
  border:1px solid var(--line-strong);padding:.42rem .95rem;font-size:.86rem;
  color:var(--text-dim);border-radius:999px;transition:.2s;
}
.otab:hover{color:var(--gold-soft);border-color:var(--gold)}
.otab[data-on="true"]{background:var(--gold);border-color:var(--gold);color:#07090F;font-weight:600}

.otree{list-style:none;margin:0;padding:0;position:relative}
.otree::before{
  content:"";position:absolute;inset-block:1.1rem;inset-inline-start:.95rem;
  width:1px;background:linear-gradient(to bottom,transparent,var(--line-strong) 8%,var(--line-strong) 92%,transparent);
}
.ostep{position:relative}
.orow{
  display:grid;grid-template-columns:2rem 1fr;gap:1rem;align-items:start;
  inline-size:100%;padding-block:.85rem;padding-inline:.5rem;margin-inline:-.5rem;
  background:transparent;border:0;border-radius:3px;text-align:start;cursor:pointer;
  color:inherit;font:inherit;transition:background .2s;
}
.orow:hover,.orow:focus-visible{background:color-mix(in oklab,var(--surface) 60%,transparent)}
.orow:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.orow:hover .odot,.orow:focus-visible .odot{border-color:var(--gold);color:var(--gold)}
/* Always visible, quietly. The whole point of the fix is that the row says out
   loud that it can be pressed - a cue that only appears on hover helps nobody
   on a phone, and nobody who did not already suspect. */
.ocue{
  display:inline-block;margin-inline-start:.55rem;font-family:var(--f-body);
  font-size:.72rem;font-weight:600;letter-spacing:.06em;color:var(--gold-soft);
  opacity:.6;transition:opacity .2s;white-space:nowrap;
}
.orow:hover .ocue,.orow:focus-visible .ocue{opacity:1}
.odot{
  width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--gold);background:var(--bg);color:var(--gold-soft);
  font-family:var(--f-display);font-weight:700;font-size:.85rem;
  font-variant-numeric:tabular-nums;z-index:1;
}
[dir="ltr"] .odot{font-family:var(--f-display-lat)}
.ostep.is-side{margin-inline-start:2.4rem}

/* Three settings, each one a complaint we actually heard: text too small,

.a11y-open{
