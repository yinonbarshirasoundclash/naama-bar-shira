const LINEAGE     = [{"i": 1, "e": "jer", "y": "1172", "he": {"n": "איזבלה הראשונה", "t": "מלכת ירושלים. מלכה על הממלכה החשובה ביותר בעולם הצלבני, בתקופה הקשה ביותר שלה."}, "en": {"n": "Isabella I", "t": "Queen of Jerusalem, ruling the most important kingdom of the Crusader world in its hardest years."}}, {"i": 2, "e": "jer", "y": "1196", "he": {"n": "אליס משמפאן", "t": "בתה של איזבלה, מלכת ירושלים. בשידוך שסידרה סבתה מריה קומננה נישאה להוגו הראשון והפכה למלכת קפריסין."}, "en": {"n": "Alice of Champagne", "t": "Isabella's daughter, queen of Jerusalem. A match arranged by her grandmother Maria Komnene married her to Hugh I and made her queen of Cyprus."}}, {"i": 3, "e": "jer", "y": "1216", "he": {"n": "איזבלה דה ליזיניאן", "t": "בתם של הוגו ואליס, קרויה על שם סבתה. הייתה עוצרת ממלכת ירושלים ונסיכה בממלכת קפריסין."}, "en": {"n": "Isabella de Lusignan", "t": "Daughter of Hugh and Alice, named for her grandmother. Regent of Jerusalem and princess of Cyprus."}}, {"i": 4, "e": "jer", "y": "1250", "he": {"n": "הוגו השלישי", "t": "מלך קפריסין, מכונה גם הוגו הגדול. הפליג לעכו כדי לשלוט באופן רשמי גם בממלכת ירושלים, וקיבל לכך את אישור האפיפיור."}, "en": {"n": "Hugh III", "t": "King of Cyprus, called Hugh the Great. He sailed to Acre to rule Jerusalem formally as well, with the Pope's approval."}}, {"i": 5, "e": "jer", "y": "1280", "he": {"n": "גאי דה ליזיניאן", "t": "בנו הצעיר של הוגו השלישי. מרד באחיו הגדולים כדי לזכות בשלטון, נתפס והוצא להורג בגיל 23."}, "en": {"n": "Guy de Lusignan", "t": "Hugh III's youngest son. He rebelled against his older brothers for the throne, was caught and executed at 23."}}, {"i": 6, "e": "jer", "y": "1296", "he": {"n": "הוגו הרביעי", "t": "מלך קפריסין. אביו היה בן 16 ואימו, אשיבה גבירת ביירות, הייתה בת 40. ירש את דודו הנרי השני בשנת 1324 והפך את קפריסין למעצמה כלכלית."}, "en": {"n": "Hugh IV", "t": "King of Cyprus. His father was 16 and his mother, Eschiva lady of Beirut, was 40. He inherited from his uncle Henry II in 1324 and turned Cyprus into an economic power."}}, {"i": 7, "e": "jer", "y": "1334", "he": {"n": "ז'אק הראשון", "t": "מפקד אמיץ ונערץ של צבא קפריסין. נלקח כבן ערובה לאיטליה לתשע שנים; כשמת המלך פייר השני מינה אותו הפרלמנט למלך בעודו בכלא. שוחרר בכופר עצום והפך מייד למלך קפריסין, ירושלים וארמניה."}, "en": {"n": "James I", "t": "A brave and admired commander of the Cypriot army. Held hostage in Italy for nine years; when King Peter II died the parliament named him king while he was still imprisoned. Ransomed at enormous cost, he became king of Cyprus, Jerusalem and Armenia."}}, {"i": 8, "e": "jer", "y": "1375", "he": {"n": "ז'אנוס", "t": "נולד בשבי והגיע לקפריסין רק בגיל 10. עלה לשלטון ב-1398, אך היה מלך פזיז שהרגיז את ממלכת מצרים, שפלשה לקפריסין ולקחה אותו בשבי. ידוע כמלך שנולד בשבי ומת בשבי."}, "en": {"n": "Janus", "t": "Born in captivity, he reached Cyprus only at ten. He took the throne in 1398, a rash king who provoked Egypt; it invaded Cyprus and took him prisoner. Known as the king born a captive and dead a captive."}}, {"i": 9, "e": "jer", "y": "1418", "he": {"n": "אן מקפריסין", "t": "בתו של ז'אנוס. התחתנה עם לואי דוכס סבויה. ידועה כאישה יפהפייה שאהבה לערוך נשפים מפוארים ברחבי אירופה."}, "en": {"n": "Anne of Cyprus", "t": "Janus's daughter, married to Louis Duke of Savoy. Known as a great beauty who loved to hold magnificent balls across Europe."}}, {"i": 10, "e": "jer", "y": "1438", "he": {"n": "פיליפ השני", "t": "ידוע כפיליפ חסר הקרקע. מרד בהוריו ונכלא בידי לואי ה-11 מלך צרפת. בגיל 58 הפך לדוכס סבויה אחרי שאחיו מת ללא יורשים."}, "en": {"n": "Philip II", "t": "Known as Philip Landless. He rebelled against his parents and was imprisoned by Louis XI of France. At 58 he became Duke of Savoy when his brother died without heirs."}}, {"i": 11, "e": "fra", "y": "1476", "he": {"n": "לואיזה נסיכת סבויה", "t": "עברה לחצר צרפת כשהבינה שלמלך אין בנים חיים, ואימנה את בנה פרנסואה ליום שבו יוכל להפוך למלך. ב-1515 שכנעה את אצילי צרפת למנות אותו."}, "en": {"n": "Louise of Savoy", "t": "She moved to the French court once she saw the king had no living sons, and trained her son Francis for the day he could take the throne. In 1515 she persuaded the nobles to name him king."}}, {"i": 12, "e": "fra", "y": "1494", "he": {"n": "פרנסואה הראשון", "t": "מלך צרפת. הושפע מתרבות הרנסנס, בנה מחדש את הלובר, קנה את המונה ליזה ושכנע את לאונרדו דה וינצ'י לעבור לצרפת. דה וינצ'י מת כשהוא אוחז בידו."}, "en": {"n": "Francis I", "t": "King of France. A man of the Renaissance, he rebuilt the Louvre, bought the Mona Lisa and brought Leonardo da Vinci to France. Da Vinci died holding his hand."}}, {"i": 13, "e": "fra", "y": "1519", "he": {"n": "אנרי השני", "t": "מלך צרפת, קתולי אדוק, שהוביל למלחמות דת בין קתולים לפרוטסטנטים. התחתן עם קתרינה דה מדיצ'י, ואחרי שנהרג בתאונה היא ששלטה בפועל: הובילה מלחמות דת, אך גם הביאה לצרפת את הבלט ופיתחה את המטבח הצרפתי המודרני."}, "en": {"n": "Henry II", "t": "King of France, a devout Catholic whose reign led into the wars of religion. He married Catherine de' Medici, and after he was killed in an accident she ruled in fact: she waged the religious wars, but she also brought ballet to France and shaped its modern cuisine."}}, {"i": 14, "e": "fra", "y": "1548", "he": {"n": "אליזבת דה ולואה", "t": "בתם של קתרינה ואנרי. נישאה לפליפה השני מלך ספרד כחלק מהסכם שלום היסטורי, ולמרות שהיה זה שידוך נראה שהזוג אהבו זה את זה מאוד. מתה בלידה."}, "en": {"n": "Elisabeth de Valois", "t": "Daughter of Catherine and Henry. She married Philip II of Spain as part of a historic peace, and though it was arranged the two seem to have loved each other deeply. She died in childbirth."}}, {"i": 15, "e": "fra", "y": "1567", "he": {"n": "קתרינה מיקאלה", "t": "נסיכת ספרד, בתם של אליזבת ופליפה השני. התחתנה עם קרלו אמנואלה הראשון, דוכס סבויה, והמשיכה כל חייה בקשר מכתבים רציף ואוהב עם אביה."}, "en": {"n": "Catherine Michelle", "t": "Princess of Spain, daughter of Elisabeth and Philip II. She married Charles Emmanuel I of Savoy and wrote to her father lovingly all her life."}}, {"i": 16, "e": "fra", "y": "1587", "he": {"n": "ויטוריו אמדאו", "t": "דוכס סבויה. חלם להיות מלך, ובזכות הקשר המשפחתי הכריז על עצמו כמלך ירושלים, קפריסין וארמניה. התחתן עם האצילה הצרפתייה כריסטין מארי, 'מאדאם רויאל', שנחשבה למי שהביאה את השיק הצרפתי לסבויה."}, "en": {"n": "Victor Amadeus", "t": "Duke of Savoy. He dreamed of a crown and, on the strength of the family line, declared himself king of Jerusalem, Cyprus and Armenia. He married the French noblewoman Christine Marie, Madame Royale, who is credited with bringing French chic to Savoy."}}, {"i": 17, "e": "fra", "y": "1637", "he": {"n": "הנרייטה אדלייד מסבויה", "t": "התחתנה בשידוך עם פרדיננד מריה, נסיך בוואריה. הביאה למינכן את מהפכת הבארוק האיטלקי ואת התרבות הצרפתית, כשהביאה איתה משוררים, זמרים ואדריכלים איטלקים."}, "en": {"n": "Henriette Adelaide of Savoy", "t": "Married to Ferdinand Maria, prince of Bavaria. She brought the Italian baroque and French culture to Munich, arriving with Italian poets, singers and architects in her train."}}, {"i": 18, "e": "fra", "y": "", "he": {"n": "מריה אנה ויקטוריה", "t": "התחתנה עם לואי הדופין, בנו של לואי ה-14. מתה קצת לפני שלואי ה-14 מת, ולכן לא הפכה בעצמה למלכת צרפת."}, "en": {"n": "Maria Anna Victoria", "t": "Married the Grand Dauphin, son of Louis XIV. She died shortly before Louis XIV, and so never became queen of France herself."}}, {"i": 19, "e": "fra", "y": "1683", "he": {"n": "פליפה החמישי", "t": "אחרי שמלך ספרד מת ללא יורשים התמנה למלך ספרד בזכות קשריו המשפחתיים. ממלכות אירופה חששו שיירש גם את צרפת ויאחד את ספרד ואיטליה למעצמה אחת, ופרצה מלחמה בת 14 שנים. בסופה ויתר רשמית על צרפת ונשאר מלך ספרד בלבד."}, "en": {"n": "Philip V", "t": "When the king of Spain died without heirs, his family ties made him king. Europe feared he would inherit France too and fuse Spain and Italy into one unbeatable power; a fourteen-year war followed. At its end he formally gave up France and remained king of Spain."}}, {"i": 20, "e": "fra", "y": "1720", "he": {"n": "פליפה דוכס פארמה", "t": "בנם של פליפה החמישי ואליזבטה פארנזה, 'אשת הברזל'. אימו השיגה לו שליטה בדוכסות פארמה שבצפון איטליה, והוא התחתן עם לואיז אליזבת הצרפתייה, שהביאה לפארמה את התרבות הצרפתית."}, "en": {"n": "Philip Duke of Parma", "t": "Son of Philip V and Elisabeth Farnese, the iron woman. His mother won him the duchy of Parma in northern Italy, and he married Louise Élisabeth of France, who brought French culture to Parma."}}, {"i": 21, "e": "aut", "y": "1751", "he": {"n": "פרננדו דוכס פארמה", "t": "מכונה הדוכס המוזר, נחשב תמהוני וחסר שאיפות פוליטיות. התחתן עם מריה אמליה, בתה של הקיסרית מריה תרזה ואחותה של מארי אנטואנט. מריה אמליה הייתה מאוהבת בנסיך אחר והתחננה לאימה לא להשיא אותה לו, אך נאלצה משיקולים פוליטיים."}, "en": {"n": "Ferdinand Duke of Parma", "t": "Called the odd duke, thought eccentric and without political ambition. He married Maria Amalia, daughter of Empress Maria Theresa and sister of Marie Antoinette. Maria Amalia loved another prince and begged her mother not to make the match, but politics decided it."}}, {"i": 22, "e": "aut", "y": "1773", "he": {"n": "לודביקו, מלך אטרוריה", "t": "אחרי המהפכה הצרפתית כבש נפוליאון את פארמה, וכדי לפצות את לודביקו 'המציא לו ממלכה' בשטחים שבין טוסקנה ופירנצה וקרא לה אטרוריה. לודביקו היה מרוצה: אף שאיבד את שטחיו, קיבל באופן רשמי את התואר מלך."}, "en": {"n": "Ludovico, king of Etruria", "t": "After the revolution Napoleon took Parma, and to compensate Ludovico he invented a kingdom for him between Tuscany and Florence and called it Etruria. Ludovico was pleased: he had lost his lands but gained the title of king."}}, {"i": 23, "e": "aut", "y": "1795", "he": {"n": "אנה דה ליו", "t": "נולדה מעט לפני נישואי אביה למריה לואיסה הספרדייה. אימה אלאנורה, בת לווייתה של סבתה מריה אמליה, גידלה אותה בווינה כאשת אצולה מכובדת אך הסתירה את ייחוסו של אביה. אנה התחתנה בגיל 16 עם היינריך פון קרנשטיין בן ה-35, שהסכים לשידוך בתמורה לנדוניה משמעותית שסיפק אביה בחשאי."}, "en": {"n": "Anna de Lieu", "t": "Born shortly before her father's marriage to Maria Luisa of Spain. Her mother Eleonora, a lady-in-waiting to her grandmother Maria Amalia, raised her in Vienna as a respectable noblewoman while hiding her father's line. At 16 Anna married Heinrich von Kernstein, 35, who accepted the match in return for a substantial dowry paid quietly by her father."}}, {"i": 24, "e": "aut", "y": "1812", "he": {"n": "ברברה פון-קרנשטיין", "t": "גדלה בפראג וחוותה מקרוב את התפוררות מעמד האצולה. בגיל 21 הכירה שם את גוסטב ויינברג, תעשיין טקסטיל מתעשר, והם עברו לליברץ, סמוך למפעלו בבוהמיה."}, "en": {"n": "Barbara von Kernstein", "t": "She grew up in Prague and watched the nobility come apart at close range. At 21 she met Gustav Weinberg, a rising textile industrialist, and they moved to Liberec, near his mill in Bohemia."}}, {"i": 25, "e": "aut", "y": "1835", "he": {"n": "קארל פון-ויינברג", "t": "בעזרת כספי אביו קנה אחוזה באזורי הכפר של בוהמיה ושינה את שמו. התחתן עם מתילדה פון-פלקנאו הגרמנייה וחי איתה חיי אצולה."}, "en": {"n": "Karl von Weinberg", "t": "With his father's money he bought an estate in the Bohemian countryside and changed his name. He married Mathilde von Falkenau and lived the life of the nobility with her."}}, {"i": 26, "e": "aut", "y": "1858", "he": {"n": "הנס ויינברג", "t": "בעקבות המשבר הגדול של 1873 בווינה הבין שהאחוזה לא תספיק ושעליו להתקיים כסוחר. חמש שנים אחר כך התחתן עם הרמינה מהאוור, בתו של סוחר שעונים ויאני, ירש את החנות והתקיים כסוחר שעונים מכובד."}, "en": {"n": "Hans Weinberg", "t": "After the crash of 1873 in Vienna he understood the estate would not be enough and that he would have to trade. Five years later he married Hermine Mahauer, daughter of a Viennese watch dealer, inherited the shop and made a respectable living in watches."}}, {"i": 27, "e": "aut", "y": "1879", "he": {"n": "אנה אדלר", "t": "גדלה בווינה של סוף המאה ה-19 והושפעה מרעיונות הקדמה והמודרנה. בבית קפה צנטרל המפואר הכירה את ד\"ר לודוויג אדלר, רופא יהודי ויאני מתבולל ומשכיל. היא המירה את דתה והתחתנה איתו."}, "en": {"n": "Anna Adler", "t": "She grew up in fin-de-siècle Vienna, taken with progress and the modern. At the grand Café Central she met Dr Ludwig Adler, an assimilated, educated Viennese Jewish physician. She converted and married him."}}, {"i": 28, "e": "aut", "y": "1900", "he": {"n": "דוד אדלר", "t": "גדל כיהודי מתבולל ולמד פסיכולוגיה בווינה ב-1920 אצל זיגמונד פרויד ואצל אלפרד אדלר, שהיה דודו מדרגה שנייה מצד אביו. הכיר בווינה את אדית רוזנברג, בת למשפחת תעשיינים יהודים."}, "en": {"n": "David Adler", "t": "Raised an assimilated Jew, he studied psychology in Vienna in 1920 under Sigmund Freud and under Alfred Adler, his father's second cousin. In Vienna he met Edith Rosenberg, of a family of Jewish industrialists."}}, {"i": 29, "e": "aut", "y": "1925", "he": {"n": "לאה אדלר", "t": "אחרי האנשלוס ב-1938 הבינו הוריה שעליהם להבריח אותה, והצליחו להעביר אותה מאוסטריה לפראג. שם נרשמה למפעל עליית הנוער של הנרייטה סאלד, עלתה לארץ ב-1939 ועברה לקיבוץ כפר סאלד. שם הכירה ב-1948 את יוזף שווייג, יהודי דובר גרמנית. סיפור האהבה נגדע כשיוזף נהרג במלחמת העצמאות, ולאה הייתה אז בהיריון."}, "en": {"n": "Lea Adler", "t": "After the Anschluss in 1938 her parents understood they had to get her out, and managed to move her from Austria to Prague. There she was enrolled in Henrietta Szold's Youth Aliyah, reached the country in 1939 and moved to kibbutz Kfar Szold. In 1948 she met Josef Schweig, a German-speaking Jew. The story ended when Josef was killed in the War of Independence; Lea was pregnant."}}, {"i": 30, "e": "aut", "y": "1949", "he": {"n": "שמעון אדלר", "t": "גדל בכפר סאלד לאם חד הורית שלא דיברה על עברה. אחרי הצבא למד הנדסת חשמל ועבר לגור בטבריה, שם הכיר את עליזה לוי, פקידת קבלה במלון."}, "en": {"n": "Shimon Adler", "t": "He grew up in Kfar Szold with a single mother who did not speak about her past. After the army he studied electrical engineering and moved to Tiberias, where he met Aliza Levy, a hotel receptionist."}}, {"i": 31, "e": "aut", "y": "1971", "he": {"n": "עידו אדלר", "t": "גדל בטבריה, עבר בגיל 22 לנהריה והיה מדריך טיולים בקרן הקיימת לישראל. שם הכיר את טליה רוזנברג."}, "en": {"n": "Ido Adler", "t": "He grew up in Tiberias, moved to Nahariya at 22 and guided hikes for the Jewish National Fund. There he met Talia Rosenberg."}}, {"i": 32, "e": "aut", "y": "1993", "he": {"n": "רון אדלר", "t": "אחרי הצבא עבר למושב בן עמי סמוך לבית הוריו, ובמקביל היה פקיד בסניף בנק הפועלים בנהריה. הכיר את נועה דסקל החיפאית במהלך לימודיו באוניברסיטת חיפה."}, "en": {"n": "Ron Adler", "t": "After the army he moved to moshav Ben Ami near his parents and worked as a clerk at the Bank Hapoalim branch in Nahariya. He met Noa Deskal of Haifa while studying at the University of Haifa."}}, {"i": 33, "e": "aut", "y": "2015", "he": {"n": "רעות אדלר", "t": "בתם של נועה דסקל-אדלר ורון אדלר. לומדת במכללת הגליל המערבי."}, "en": {"n": "Reut Adler", "t": "Daughter of Noa Deskal-Adler and Ron Adler. She studies at the Western Galilee College."}}];

const BLURBS = {
maayan:{he:[
"כשתקיפה בלתי צפויה חושפת בפני האחיות מיקה, גבי ואור את סודות שורשיהן הסבוכים, הן הופכות מנערות למלאכיות ומבינות שהן ניצבות מול ייעודן בעולם מסוכן ומופלא שאינן מכירות.",
"קהילת המלאכים הסודית בחאן בירושלים מקבלת אותן אל חיקה ומוכנה לספק להן הגנה. אור, שתמיד הרגישה שונה, מקווה ששם סוף־סוף תרגיש שייכת. מיקה לא מעוניינת לעזוב את עולמה - טוב לה בחייה כפי שהם והיא אוהבת את חבריה. ואילו גבי מאוהבת בחבר שלה ולא רוצה לוותר עליו, גם כאשר כנפיים ענקיות מתפרצות מגבה כל פעם שהיא מנסה לנשק אותו.",
"האם האחיות יצליחו להציל מלאכים שנחטפו, לגבור על הסדקים המעמיקים ביחסיהן וללמוד את תפקידן לפני שיותקפו בידי השדים?",
"היכנסו לעולם הנסתר של המלאכים בירושלים, בספר פנטזיה גדוש הרפתקאות, רומנטיקה ושבעה מדורים של שאול."]},

shaar:{q:"הירח בהק דרך החלון, אור לא הצליחה להפסיק לבהות בו. משהו זר חי בגופה, היא הרגישה אותו גדל, ראתה את דמותו בין העננים, בצללים בפינות הרחוב, בפנים של כל מי שהסתכל עליה.",
he:[
"סערה מתחוללת בנפשה של אור. קול מתגבר בתוכה, משתלט עליה, ולמרות שהייתה רוצה להסתיר את זה מהסובבים אותה - הם מתחילים להיפגע. המלאכים חייבים להפריד בינה ובין השדה שכבשה את ליבה, גם אם בכוח.",
"אור נאלצת לרדת אל מעמקי השאול כדי להציל לא רק את עצמה, אלא גם את כל מי שהיא אוהבת. בעוד היא מנווטת בעולם הבוגדני של מטה, אחיותיה צוללות לעולמות המטושטשים של חצאי השדים שחיים על הקו בין תל אביב לירושלים, כשגורל השמיים והאדמה מונח על הכף.",
"גבי, מיקה וריף חייבות למצוא דרך לשתף פעולה ולהציל את נפשה של אור לפני שיהיה מאוחר מדי. אך השבר ביניהן הולך וגובר, מאיים לקרוע אותן. הגבולות בין טוב ורע אינם ברורים כפי שחשבו פעם."]},

shimemet:{q:"״את בהחלט מהווה איום,״ אמר לה לוקי, בוחן אותה בעיני האזמרגד שלו. ״אבל אני לא אגלה. לוסי, מתי תביני שאנחנו באותו צד? את שלי.״",
he:[
"אור הפכה ללוסיאל. השאול הוא כבר חלק ממנה והיא לא זוכרת דבר ממי שהייתה. בעולם האכזרי של מטה היא חייבת לחזק את כוחה ואחיזתה בין השדים, אך לכוח יש מחיר.",
"גבי וריף יורדות לשאול כדי להציל את אחותן, מלוות בבנות לילית, חצאי שדים וסוקובוסית אחת שמוכנה לעשות הכול כדי להציל את אהובת ליבה. מיקה מוצאת את עצמה כלואה ביער הפיות בביריה, וכדי להנהיג את המלאכים היא צריכה להילחם בכל מה שהיא עצמה האמינה בו.",
"הספר השלישי והאחרון בטרילוגיה, ובו העולמות של מעלה ומטה מתכנסים להתנגשות חזיתית. מלאכים, שדים ובני לילית בקרבות מכריעים במעמקי השאול, שדי נזימבי צועדים ברחובות ירושלים, ומעל - בשממת העדן - נחשפים סודות שלא ידענו על קיומם."]},

ben:{he:[
"שחר מתעורר למציאות שלא הכיר. הוא לא רק בן של מלאכית־עליון. הוא לא רק נער שגדל בין עצי יער הפיות בצפון. הוא משהו אחר לגמרי. משהו מסוכן.",
"כשהוא מגלה את סודו האפל ובורח אל עולם זר, שחר נאלץ לגלות את זהותו מחדש ולחשוף את הסודות שאימו ואחיותיה הסתירו ממנו כל חייו. בעודו נרדף, כוחות הרסניים מתקרבים אליו - רוקה, שפחתו הקטלנית של אבדון, נשלחת למשימה שאין ממנה דרך חזרה.",
"באותה עת ארבע האחיות - אור, גבי, מיקה וריף - מתמודדות עם סדקים הולכים ומתרחבים: בגידות, אהבות אסורות, אימהוּת מורכבת ולבטים קיומיים שמאיימים לפרק את הברית ביניהן.",
"שבע־עשרה שנה לאחר סיום ״מלאכיות עליון״ מתחיל פרק חדש. מהו מקומו של שחר בתוכנית הגדולה? האם האחיות יתאחדו או יקרסו תחת נטל העבר? והאם באמת אפשר לברוח מגורל שנכתב בשמיים ובשאול גם יחד?"]},

tzava:{he:[
"שחר, בנה של אור מלאכית העליון ולוקיאנתרו מלך השאול, מגיע אל החאן במטרה לממש את ייעודו. תחת עינה הפקוחה של מיקה הוא ניצב מול האתגרים הקשים ביותר: עליו ללמוד על הצד המלאכי שבו, בעוד שד צמא לדם חי בתוכו. האם יהיה המגן של האנושות, או הנשק שיחריב אותה?",
"בעוד שחר צועד על החבל הדק שבין אור לחושך, החאן כולו ניצב בפני מבחן. מיקה נאבקת לשמור על סדר בעולם קורס, בזמן שאור מתמסרת לכס המלכות של השאול. הכתר כבד, והטראומות מהעבר מאיימות להצית מלחמה בין האחיות שתשרוף את השמיים ואת התהומות גם יחד.",
"מנקמה שבוערת בתאי המאסר ועד לצבאות הנפילים הצועדים לירושלים - מסע עוצר נשימה של הקרבה וגילוי עצמי. במקום שבו הגבול בין מלאך לשד מיטשטש, רק דבר אחד בטוח: בדרך אל יום הדין, הקשר החזק ביותר אינו נכתב בדם, אלא בבחירה."]},

zohar:{he:[
"זהר, נצר למשפחה מלאכית עתיקה ורבת עוצמה, תמיד ידעה שנועדה להיות רוקחת. היא התאמנה לכך כל חייה והוכיחה שהיא הטובה ביותר. עם סיום חאן המלאכים ציפתה להמשיך ללגיון הרוקחים, אך ראש לגיון הכלא העמוק, צדקיאל, זיהה את היכולות הטמונות בה ודרש להחזיק בה תחת שליטתו.",
"כך מוצאת זהר את דרכה אל הכלא הקבור עמוק מתחת לאדמה, מוקפת במאות שדים כלואים, ושוקעת בשגרה שכוללת עבודות מטבח, סיורים ושמירות. בהחלט לא העתיד שעליו חלמה. עד שברגע אחד גורלי נסחפים צדקיאל וזהר למשימה שתשנה את חייה מעבר לכל דמיון.",
"החלטה של מלאך אחד שינתה את הייעוד שלה, והיכרות עם שד אחד שינתה את כל תפיסת עולמה."],
warn:"מכיל תכנים מיניים. מסיבות מלאות תשוקה עם ילדי הלילית, אימונים סקסיים מתחת לאדמה, ומלאכית אחת שמגלה שהיא לא כמו שציפו שתהיה."},

barak:{q:"״אתה כל כך שקוף,״ אברה הניח את ידו על הלסת של ברק. ברק לא הצליח להחליט אם לכעוס, להדוף אותו או להתמכר למגע.",
he:[
"מבין כל המלאכים שלא רואים את ברק באמת, מלאך אחד רואה אותו - אברה. ברק נאלץ להוכיח את עצמו ואת המחויבות שלו לאברה, שנפצע קשה במתקפה גדולה על מלאכי החאן. הוא חייב להציל אותו, את האדם היחיד שראה מי הוא מעבר לתווית המלאך והלוחם. ברק יוצא למשימה כמעט בלתי אפשרית - השגת דם שדים. למשימה מצטרף לא פחות מאשר אופיר.",
"אופיר הוא החבר הכי טוב של ברק. או שאולי הוא יותר מזה? ברק היה רוצה להישאר רק השותף לחדר של אופיר, אלא שזה לא כל כך פשוט. למרות הפחד שלו להרוס את החברות ביניהם, ברק מאוהב במלאך עם עיני הדבש בצורת שקד. אבל אופיר בכלל לא רואה אותו ככה - בשבילו ברק הוא רק אח וחבר.",
"האם ברק ישיג את הדם האסור? האם יצליח להציל את אברה? האם יתוודה בפני אופיר על אהבתו - ובמי מהשניים יבחר, או שמישהו מהם יבחר בו?"],
warn:"מכיל תכנים מיניים, מלאכים חתיכים, התמזמזות בחדר הכבשן, מסיבות מישלינגים והתגנבויות אסורות בלילה ברחבי החאן."},

suki:{q:"לא כל שד הוא רע, ולא כל מלאך הוא טוב. סוקי הולכת לגלות את זה בדרך הקשה.",
he:[
"סוקי חיה עם אביה ואחיה בעיירת נופש קטנה ומבודדת באוסטריה, שם הם מנהלים מועדון שייט. למרות שהתרגלה לחיים שקטים, סוקי יודעת שהיא שונה - היא חצי שדת סוקובוס, יצור מיני עם כוחות מסתוריים ומסוכנים.",
"השגרה שהכירה מופרת כשהשדים מגלים את מיקומם, וסוקי ואחיה אינק מבינים כי הם חלק מסיפור הרבה יותר גדול שהוסתר מהם - סיפור על סכסוכים בין משפחות, אהבה אסורה וסודות אפלים. האחים יוצאים למסע מסוכן בישראל, שם הם מגלים את זהותם האמיתית ופוגשים מלאכית מסתורית שמערערת את עולמה של סוקי.",
"הם מוצאים את עצמם בעין הסערה, כשסביבם מתנגשים רגשות, תשוקות וכוחות אכזריים. כעת סוקי צריכה להחליט אם תהפוך לאישה שהיא רוצה להיות, או לשדה חסרת מעצורים."],
warn:"מכיל עלילה עוצמתית, מלאת תשוקה, ותכנים מיניים."},

izabela:{he:[
"ממלכת ירושלים על סף קריסה. כס המלכות מתערער, בריתות נרקמות ונפרמות בלילות חשוכים, והארץ נחרבת מבפנים - בידי בני אדם, ובידי כוחות אפלים הרבה יותר.",
"איזבלה, נסיכה שנולדה אל תוך משחקי שלטון אכזריים, נשואה להאמפרי - אציל ואיש רוח, בן בריתה הקרוב ביותר. נישואיהם מבוססים על נאמנות, חברות ואהבה עמוקה, אך זוהי אהבה שנותרה ללא תשוקה ומגע. אל חייה שב דניאל, חבר ילדות שמעולם לא עזב את ליבה - ומעולם לא השתייך באמת לעולמה.",
"בעוד מזימות נרקמות בחצר המלוכה ושדים אורבים מסביב לחומות, איזבלה מגלה כי חוב אפל שנחתם בדם עוד בטרם לידתה עומד להיגבות. כעת עליה לבחור: לשמר ממלכה בכל מחיר, או להיאבק על הזכות לאהוב בדרכה שלה - גם אם הבחירה תחריב עולמות.",
"רומן היסטורי־פנטסטי סוחף, בהשראת דמותה האמיתית של מלכת ירושלים בתקופת מסעות הצלב."]}
};

  const bar=document.querySelector(".topbar-in"), nav=document.getElementById("nav");
  document.body.removeAttribute("data-nav");     /* measure the row at full size */
  nav.dataset.open="false";
  if(bar.scrollWidth > bar.clientWidth+1) document.body.setAttribute("data-nav","compact");
}
let fitRAF=0;
addEventListener("resize",()=>{ cancelAnimationFrame(fitRAF); fitRAF=requestAnimationFrame(fitNav); });

/* ---------- CART ---------- */
function add(id){ cart[id]=(cart[id]||0)+1; openCart(true); renderCart(); syncCount(); }
function setQty(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; renderCart(); syncCount(); }
function cartItems(){ return Object.keys(cart).map(id=>({b:BOOKS.find(x=>x.id===id),q:cart[id]})).filter(x=>x.b); }
function cartQty(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function bundleFor(n){ let best=null; BUNDLES.forEach(b=>{ if(b.qty===n) best=b; }); return best; }
function cartTotal(){
  const n=cartQty(); const bd=bundleFor(n);
  if(bd) return bd.price;
  return cartItems().reduce((s,x)=>s+(x.b.sale||x.b.price)*x.q,0);
}
function syncCount(){ document.getElementById("cartCount").textContent=cartQty(); }
function openCart(o){
  document.getElementById("drawer").dataset.open=o?"true":"false";
  document.getElementById("scrim").dataset.open=o?"true":"false";
}
function orderText(){
  const c=t().cart, lines=cartItems().map(x=>`• ${L(x.b).t} ×${x.q}`).join("\n");
  const nm=(document.getElementById("f-name")||{}).value||"";
  const ad=(document.getElementById("f-addr")||{}).value||"";
  const dd=(document.getElementById("f-ded")||{}).value||"";
  let s = (lang==="he"?"הזמנה מהאתר של נעמה בר שירה\n\n":"Order from N.B. Shira\n\n")+lines;
  s += `\n\n${c.total}: ₪${cartTotal()}`;
  if(signed) s += `\n${lang==="he"?"עותק חתום":"Signed copy"}${dd?` - ${c.dedication} ${dd}`:""}`;
  if(nm) s += `\n${c.name}: ${nm}`;
  if(ad) s += `\n${c.addr}: ${ad}`;
  return s;
}
function sendOrder(){ window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(orderText())}`,"_blank","noopener"); }

function mapEl(){
  const he=lang==="he";
  const OFF_X=px(35.30), OFF_Y=10;   // off-map marker, above the frame
  const pins = PLACES.map((p,i)=>{
    const x = p.off?OFF_X:px(p.lon), y = p.off?OFF_Y:py(p.lat);
    return `
    <g class="pin${p.off?" off":""}" data-i="${i}" onclick="showPlace(${i})" tabindex="0"
       role="button" aria-label="${esc(L(p).n)}" onkeypress="if(event.key==='Enter')showPlace(${i})">
      ${p.off?`<line x1="${x}" y1="${y+9}" x2="${x}" y2="${py(33.50).toFixed(1)}" stroke="var(--line-strong)" stroke-dasharray="3 5"></line>`:""}
      <circle class="halo" cx="${x}" cy="${y}" r="11"></circle>
      <circle class="dot"  cx="${x}" cy="${y}" r="9.5"></circle>
      <text class="pnum" x="${x}" y="${y+3.4}" text-anchor="middle">${i+1}</text>
    </g>`;
  }).join("");

  const rows = PLACES.map((p,i)=>`<button class="ploc" data-i="${i}" onclick="showPlace(${i})">
      <span class="pn">${i+1}</span>
      <span class="pt"><b>${esc(L(p).n)}</b><span class="dim">${esc(L(p.book))}</span></span>
    </button>`).join("");

  return `<div class="mapgrid">

function openLore(k){
  const d=LORE_DEMONS.find(x=>x.k===k); if(!d) return;
  const i=LORE_DEMONS.indexOf(d);
  const prev=LORE_DEMONS[(i-1+LORE_DEMONS.length)%LORE_DEMONS.length].k;
  const next=LORE_DEMONS[(i+1)%LORE_DEMONS.length].k;
  document.getElementById("bookPanel").innerHTML = `
    <button class="lb-close" onclick="closeBook()" aria-label="${lang==="he"?"סגירה":"Close"}">✕</button>
    <div class="loreview">
      <img class="loreplate" src="${loreSrc(d.k)}" alt="${esc(L(d).n)}">
      <div class="stack g-s">
        <span class="eyebrow">${esc(L(d).r)}</span>
        <h3 class="h3">${esc(L(d).n)}</h3>
        <p>${esc(L(d).t)}</p>
        <span class="fnav">
          <button onclick="openLore('${prev}')">‹</button>
          <span class="dim num">${i+1} / ${LORE_DEMONS.length}</span>
          <button onclick="openLore('${next}')">›</button>
        </span>
      </div>
    </div>`;
  document.getElementById("bookLb").dataset.open="true";
  document.body.style.overflow="hidden";
}

/* ---------- SKY CANVAS ---------- */
let skyRAF=null;
/* A quiet starfield behind the whole page. Positions are seeded, so the sky is
   the same on every visit; only the twinkle moves. */
let starRAF=null;
function startStars(){
  const cv=document.getElementById("stars"); if(!cv) return;
  const ctx=cv.getContext("2d"); let w,h,stars=[];
  let seed=20240;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  function size(){
    const dpr=Math.min(devicePixelRatio||1,2);
    w=innerWidth; h=innerHeight;
    cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    seed=20240;
    const n=Math.round(w*h/5200);
    stars=Array.from({length:n},()=>({
      x:rnd()*w, y:rnd()*h, r:rnd()*1.05+.22,
      a:rnd()*.5+.14, p:rnd()*Math.PI*2, s:rnd()*.5+.25
    }));
  }
  function paint(ts){
    ctx.clearRect(0,0,w,h);
    for(const st of stars){
      const tw = ts==null ? 1 : (.62+.38*Math.sin(ts/2200*st.s+st.p));
      ctx.globalAlpha=st.a*tw;
      ctx.fillStyle = st.r>1 ? "#E4C889" : "#DCE4F2";
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(ts){ paint(ts); starRAF=requestAnimationFrame(loop); }
  size();
  if(still) paint(null); else { cancelAnimationFrame(starRAF); starRAF=requestAnimationFrame(loop); }
  addEventListener("resize",()=>{ size(); if(still) paint(null); },{passive:true});
}

function startSky(){
  const cv=document.getElementById("sky"); if(!cv) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx=cv.getContext("2d"); let w,h,parts=[];
  function size(){
    const r=cv.getBoundingClientRect(); const dpr=Math.min(devicePixelRatio||1,2);
    w=cv.width=r.width*dpr; h=cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    w=r.width; h=r.height;
    parts=Array.from({length:Math.round(w*h/9000)},()=>({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5+.25,
      s:Math.random()*.14+.03, a:Math.random()*.5+.12, p:Math.random()*Math.PI*2
    }));
  }
  size(); addEventListener("resize",size,{passive:true});
  const css=getComputedStyle(document.documentElement);
  function frame(ts){
    const gold=css.getPropertyValue("--gold-soft").trim()||"#E4C889";
    ctx.clearRect(0,0,w,h);
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,css.getPropertyValue("--sky-top").trim());
    g.addColorStop(.44,css.getPropertyValue("--sky-mid").trim());
    g.addColorStop(.74,css.getPropertyValue("--sky-low").trim());
    g.addColorStop(.93,css.getPropertyValue("--sky-horizon").trim());
    g.addColorStop(1,css.getPropertyValue("--sky-low").trim());
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    parts.forEach(p=>{
      p.y-=p.s; p.x+=Math.sin((ts/2600)+p.p)*.12;
      if(p.y<-4){p.y=h+4;p.x=Math.random()*w;}
      ctx.globalAlpha=p.a*(.55+.45*Math.sin(ts/1400+p.p));
      ctx.fillStyle=gold; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    });
    ctx.globalAlpha=1;
    drawSkyline(ctx,w,h,css);
    skyRAF=requestAnimationFrame(frame);
  }
  cancelAnimationFrame(skyRAF); skyRAF=requestAnimationFrame(frame);
}

/* A Levantine roofline: flat roofs, a dome, a minaret, arched openings.
   Deterministic - the same skyline every load, so it reads as a place, not noise. */
const SKYLINE = [
  [0,74,"flat"],[52,58,"flat"],[92,86,"arch"],[150,46,"flat"],[196,64,"dome"],
  [268,52,"flat"],[310,96,"flat"],[352,38,"minaret"],[382,70,"arch"],[446,54,"flat"],
  [498,88,"flat"],[540,60,"dome"],[604,44,"flat"],[652,78,"arch"],[712,56,"flat"],
  [764,92,"flat"],[806,50,"minaret"],[838,72,"flat"],[898,60,"dome"],[962,46,"flat"],[1010,80,"flat"]
];
function drawSkyline(ctx,w,h,css){
  const unit = w/1040, base = h + 2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, base);
  for(let i=0;i<SKYLINE.length;i++){
    const [x0,ht,kind] = SKYLINE[i];
    const x = x0*unit;
    const nx = (i+1<SKYLINE.length ? SKYLINE[i+1][0] : 1040)*unit;
    const y = base - ht*unit*1.35;
    if(kind==="dome"){
      const cx=(x+nx)/2, r=(nx-x)/2;
      ctx.lineTo(x,y+r*.35);
      ctx.arc(cx,y+r*.35,r,Math.PI,0);
      ctx.lineTo(nx,base);
      ctx.lineTo(nx,y+r*.35);
    } else if(kind==="minaret"){
      const cx=(x+nx)/2, tw=(nx-x)*.34;
      ctx.lineTo(x,base - ht*unit*.5);
      ctx.lineTo(cx-tw,base - ht*unit*.5);
      ctx.lineTo(cx-tw,y);
      ctx.lineTo(cx,y-14*unit);
      ctx.lineTo(cx+tw,y);
      ctx.lineTo(cx+tw,base - ht*unit*.5);
      ctx.lineTo(nx,base - ht*unit*.5);
    } else if(kind==="arch"){
      const cx=(x+nx)/2, r=(nx-x)/2;
      ctx.lineTo(x,y);
      ctx.quadraticCurveTo(cx,y-r*.5,nx,y);
    } else {
      ctx.lineTo(x,y); ctx.lineTo(nx,y);
    }
  }
  ctx.lineTo(w,base); ctx.lineTo(0,base);
  ctx.closePath();
  ctx.globalAlpha=1;
  ctx.fillStyle = css.getPropertyValue("--city").trim() || "#05070F";
  ctx.fill();
  /* dawn caught on the roofline */
  ctx.globalAlpha=.5;
  ctx.lineWidth=1;
  ctx.strokeStyle = css.getPropertyValue("--gold").trim() || "#C9A356";
  ctx.stroke();
  ctx.restore();
}
