const LORE_DEMONS = [{"k": "satan", "he": {"n": "השטן - הילל בן שחר", "r": "אבי השדים", "t": "מלאך ממלאכי העליון. הוא ואחותו יופיאל היו היפים במלאכים, וצבע שערם בהק כשמש. הילל חטא בחטא היוהרה, ברצונו להיות אל, מרד וגורש מגן העדן. כעונש נלקח ממנו היופי: על גופו השרירי הולבש ראש עז, שערו הבוהק הפך לרעמה פרועה, וכנפיו הלבנות הפכו קירחות וקשות ככנפי עטלף. המלאך המגורש התאחד עם אשתו הראשונה של האדם, לילית, ובתמורה לחיי נצח ולכוחות ילדה לו מאה צאצאים, שמהם נוצרו כל השדים."}, "en": {"n": "Hillel ben Shachar - Satan, father of demons", "r": "Father of demons", "t": "One of the high angels. He and his sister Yofiel were the most beautiful of the angels, their hair as bright as the sun. Hillel sinned in pride, wanting to be a god, rebelled and was cast out of Eden. His beauty was taken from him as punishment: a goat's head set on his muscled body, his bright hair turned to a wild mane, his white wings made bald and hard as a bat's. The exiled angel joined with Lilith, Adam's first wife, and in exchange for eternal life and power she bore him a hundred offspring, from whom all demons came."}}, {"k": "shamdon", "he": {"n": "שמדון", "r": "אבי שושלת שדי שמדון", "t": "השד הראשון שנולד לשושלת השדים, צאצאו הראשון של הילל בן שחר. הוא ואשתר, שהייתה אשתו השנייה של אדם, יצרו את שושלת נסיכי השאול. הושמד במלחמה הראשונה בין המלאכים, בני האדם והשדים, מלחמה שבסופה, במבול הגדול, גורשו השדים לשאול."}, "en": {"n": "Shamdon", "r": "Father of the Shamdon line", "t": "The first demon born into the line, Hillel ben Shachar's firstborn. Together with Ashtar, Adam's second wife, he founded the dynasty of the princes of Sheol. He was destroyed in the first war between angels, humans and demons, the war that ended in the great flood, when the demons were banished to Sheol."}}, {"k": "ashmadai", "he": {"n": "אשמדאי", "r": "אבי מלך השדים", "t": "צאצאו הראשון של שמדון. צאצאי שושלתו נקראים אגרים ובעלי יכולת לשינוי צורה. שלושת צאצאיו הבולטים: לוקיאנתרו הבכור, אמדאוס השני והלבינדי השלישי."}, "en": {"n": "Ashmadai", "r": "Father of the demon king", "t": "Shamdon's firstborn. His descendants are called Agarim and can change shape. His three notable children: Lukiantro the eldest, Amadeus the second and Halevindi the third."}}, {"k": "lukiantro", "he": {"n": "לוקיאנתרו", "r": "מלך השאול · המדור השביעי, עיר החטאים", "t": "ארמונו נמצא במדור השביעי, המכונה גם עיר החטאים, ושם נמצאים רוב עדרי השאול. הוא שולט בעזרת דודיו נסיכי השאול, ובמדור השני בעזרת אחיו האגרתים, שדים משני צורה. הם כולאים את הנשמות המגיעות לשאול בבורות תחתית ומענים אותן בחזרה על הרגעים הגרועים בחייהן, אלה שהובילו אותן לשם, עד שנשמה מתוקנת זכאית לניסיון נוסף בעולם בני האדם. צאצאיו: הלני, בתו והמלאכית בנש, שהושמדה לפי התיעודים."}, "en": {"n": "Lukiantro", "r": "King of Sheol · the seventh circle, the City of Sinners", "t": "His palace stands in the seventh circle, the City of Sinners, where most of the herds of Sheol are kept. He rules with his uncles, the princes of Sheol, and holds the second circle through his shape-shifting Agarti brothers. Souls that reach Sheol are held in pits and made to relive the worst hours of their lives, the ones that sent them there, until a mended soul earns another attempt in the world of the living. His children: Helni, his daughter by the angel Benesh, destroyed according to the records."}}, {"k": "sagu", "he": {"n": "סאגו", "r": "שליט מדור צלמוות · המדור הראשון", "t": "צאצאו השני של שמדון, שליט המדור לחוטאים בכעס. צלמוות הוא המדור שמפריד בין עולם בני האדם למדורי השאול. סאגו הוא אבי שדי ענקי האש, שבסיפורי המלחמה האחרונה תוארו כשדים בגודל עצום ובעלי כוח אדיר יותר מרעידת אדמה, שיכולים להגיע לגובה של הר. גם לפני הגירוש נצפו רק מעט שדים כאלה, בעיקר בקרבת הרי געש. לרוב הם נמצאים תחת קליפת האדמה."}, "en": {"n": "Sagu", "r": "Ruler of Tzalmavet · the first circle", "t": "Shamdon's second son, ruler of the circle of wrath. Tzalmavet is the circle that separates the human world from the circles of Sheol. Sagu is the father of the fire giants, described in the tales of the last war as demons of enormous size, stronger than an earthquake, able to grow as tall as a mountain. Even before the banishment only a few were ever seen, mostly near volcanoes. Most of the time they lie beneath the earth's crust."}}, {"k": "samuel", "he": {"n": "סמואל", "r": "שליט מדור גולא · המדור השני", "t": "צאצאו החמישי של שמדון. מדור גולא הוא המדור לחוטאים בגרגרנות, ובו הם מעונים ברעב בלתי נגמר ובלתי נשלט. סמואל חולק את המדור עם שליט זוטר בשם בעל זבוב, והמדור מלא חרקים ומזיקים הניזונים מנשמות בני האדם. סמואל אינו בנה של אשתר כשאר אחיו, אלא צאצא של שמדון ומלאכית ששמה לא ידוע, ולכן מכונה גם 'מלאך המוות', בהיותו חצי שד וחצי מלאך. החיבה שלו לבני האדם הולידה לו שני צאצאים שהם חצי אדם וחצי שד."}, "en": {"n": "Samuel", "r": "Ruler of Gula · the second circle", "t": "Shamdon's fifth son. Gula is the circle of gluttony, where souls are tormented by a hunger that never ends and cannot be controlled. Samuel shares the circle with a lesser ruler named Ba'al Zvuv, and it swarms with insects and vermin that feed on human souls. Unlike his brothers Samuel is not Ashtar's son but the child of Shamdon and an angel whose name is unknown, which is why he is also called the Angel of Death, being half demon and half angel. His fondness for humans gave him two children who are half human, half demon."}}, {"k": "ghul", "he": {"n": "ע'ול", "r": "הצאצא הראשון של סמואל", "t": "אבי שדי הנזימבי, המוכרים בשמם הרווח זומבים. שדי הנזימבי אינם נולדים, אלא הם גופות של בני אדם שע'ול משתלט עליהן ומפעיל כמו בובות. כשהגופות אינן בשליטתו, הצורך היחיד שמניע אותן דומה לזה של הנשמות המעונות במדור השני: רעב בלתי נגמר ובלתי נשלט, והן יאכלו כל דבר שנקלע בדרכן."}, "en": {"n": "Ghul", "r": "Samuel's firstborn", "t": "Father of the Nzimbi demons, better known as zombies. Nzimbi are not born: they are human corpses that Ghul takes over and works like puppets. Out of his control, the only thing that drives them is the hunger of the second circle, endless and uncontrollable, and they will eat whatever crosses their path."}}, {"k": "gaotika", "he": {"n": "גאוטיקה", "r": "הצאצאית השנייה של סמואל", "t": "אם שדי הטוביקנה, המכונים גם אנשי זאב, שדים ממושמעים ויחסית ניתנים לשליטה, המשמשים מגינים ולוחמים של שושלת הנסיכים. בגלל דם האדם הזורם בגאוטיקה, אפשר להעביר את כוחות השד של שושלתה לבני אדם באמצעות נשיכה, דם או קיום יחסי מין."}, "en": {"n": "Gaotika", "r": "Samuel's second child", "t": "Mother of the Tovikana demons, also called wolf men: disciplined and relatively controllable, they serve as guards and fighters for the princes' line. Because human blood runs in Gaotika, the powers of her line can pass to humans through a bite, through blood, or through sex."}}, {"k": "abadon", "he": {"n": "אבדון", "r": "שליט מדור אבדון · המדור השלישי", "t": "צאצאו השלישי של שמדון, אבי שדי המאגוס המכונים מכשפים. המדור השלישי הוא מדור החמדנות: הנשמות מוחזקות בו בכלובים מזהב, נרדפות בתחושת חוסר הגשמה ונטרפות שוב ושוב על ידי שדיה של ממון, השליטה הזוטרה של המדור. גם שדי ההאנהגוארה חיים במדור הזה, ונשלטים בידי ממון ברמת תודעה של חיות טורפות."}, "en": {"n": "Abadon", "r": "Ruler of Abadon · the third circle", "t": "Shamdon's third son, father of the Magus demons, the sorcerers. The third circle is greed: souls are kept in cages of gold, hounded by a sense of never having enough, devoured again and again by the demons of Mammon, the circle's lesser ruler. The Hanhaguara demons also live here, ruled by Mammon at the awareness of predatory animals."}}, {"k": "belial", "he": {"n": "בלייעל", "r": "שליט מדור אסידיה · המדור הרביעי", "t": "צאצאו השני של הילל בן שחר. במדור אסידיה נענשים החוטאים בשקרים, בעצלנות ובניצול. זהו מדור שכולו מים, וכלואה בו גם השדה לוויתן. החוטאים שוקעים בו בים אין סופי של שקרים ואשמה. בלייעל ובנו הבכור אוסה, שהיה בן ארבע מאות שנה, הושמדו במלחמה הגדולה של השדים, אך בעזרת דמה של לילית הוחזר בלייעל לחיים, ומאז הוא וצאצאיו אינם יכולים למות. בלייעל ולילית יצרו את שושלת לוציפר, שדי הפמליירים המוכרים כערפדים."}, "en": {"n": "Belial", "r": "Ruler of Acedia · the fourth circle", "t": "The second son of Hillel ben Shachar. Acedia punishes lies, sloth and exploitation. It is a circle of water, and the demon Leviathan is imprisoned there too. Its sinners sink into an endless sea of lies and guilt. Belial and his firstborn Osa, who was four hundred years old, were destroyed in the great war of the demons, but Lilith's blood brought Belial back, and since then neither he nor his descendants can die. Belial and Lilith created the line of Lucifer, the Famelier demons known as vampires."}}, {"k": "elias", "he": {"n": "אליאס", "r": "שליט מדור שחט · המדור החמישי", "t": "צאצאו הרביעי של שמדון, אבי שדי הדראקון המכונים דרקונים. המדור שומם ויש בו בעיקר סלעים, והוא מיועד לחוטאים מתוך קנאה. נשמות האדם בו נרדפות בידי צאצאיו של אליאס שוב ושוב ואינן מוצאות מנוח."}, "en": {"n": "Elias", "r": "Ruler of Shachat · the fifth circle", "t": "Shamdon's fourth son, father of the Draconi demons, the dragons. The circle is barren and mostly rock, and it is meant for envy. The souls there are hunted by Elias's offspring again and again and find no rest."}}, {"k": "lucifer", "he": {"n": "לוציפר", "r": "שליט מדור אופליה · המדור השישי", "t": "צאצאו של בלייעל, אבי שדי הפמליירים המוכרים בשם ערפדים. אינם יכולים למות והם ניזונים מדם ומפחד. המדור של לוציפר שרוי בחשכה מוחלטת, ואליו נשלחים החוטאים בחטא הגאווה."}, "en": {"n": "Lucifer", "r": "Ruler of Ophelia · the sixth circle", "t": "Belial's son, father of the Famelier demons known as vampires. They cannot die and they feed on blood and on fear. Lucifer's circle lies in total darkness, and pride is what sends a soul there."}}, {"k": "lilith", "he": {"n": "לילית", "r": "אם השדים, השדה הראשונה", "t": "נועדה לשרת ולהיות זוגתו של אדם, אך במהרה התגלתה כלא ציתנית, מרדנית ופרועה, ואדם ביקש אישה אחרת במקומה. לאחר הגירוש פגשה לילית את הילל בן שחר, מלאך שגורש מגן העדן. הם התאחדו, ובתמורה לחיי נצח ולכוחות ילדה לו מאה צאצאים, השדים."}, "en": {"n": "Lilith", "r": "Mother of demons, the first she-demon", "t": "She was meant to serve Adam as his mate, but she was quickly found disobedient, rebellious and wild, and Adam asked for another woman in her place. After she was cast out Lilith met Hillel ben Shachar, an angel exiled from Eden. They joined, and in exchange for eternal life and power she bore him a hundred offspring: the demons."}}, {"k": "lilo", "he": {"n": "לילו", "r": "אבי שושלת שדי הלילית", "t": "צאצאם של לילית ובלייעל ואבי שדי הלילית, המכונים פיות ופיונים. לילית ולילו הולידו שתים עשרה בנות, שייסדו את שנים עשר שבטי הפיות. בני שבטי הפיות אינם יכולים ללדת צאצאים נוספים, ודרכם היחידה להמשיך את השושלת היא לחטוף ילדים אנושיים, לשתות את דמם ולהחליפו בדם פיות בשילוב עם כוח הטבע."}, "en": {"n": "Lilo", "r": "Father of the Lilith demon line", "t": "Child of Lilith and Belial and father of the Lilith demons, the fae. Lilith and Lilo had twelve daughters, who founded the twelve fae tribes. The fae cannot bear children of their own, and the only way they have to continue the line is to take human children, drink their blood and replace it with fae blood bound to the power of nature."}}, {"k": "balt", "he": {"n": "בלת-אילו", "r": "המלכה האם של שבט הפרחים", "t": "בתם הצעירה של לילית ולילו. צאצאיה נוצרים בשילוב של ילדי הלילית עם פרחים, פירות ועצים. בלת-אילו יצרה שתים עשרה גבירות, והן מפוזרות ברחבי העולם ומפיצות את שושלתה."}, "en": {"n": "Balt-Ilu", "r": "Queen mother of the flower tribe", "t": "The youngest daughter of Lilith and Lilo. Her offspring are made by binding Lilith's children to flowers, fruit and trees. Balt-Ilu created twelve ladies, scattered across the world, who carry her line onward."}}, {"k": "lilach", "he": {"n": "לילך", "r": "גבירת הפרחים", "t": "בתה הצעירה של בלת-אילו. לילך יצרה שנים עשר צאצאים. הצאצאים הזכרים של גבירת הפרחים מכונים ביור והנקבות מכונות דיור."}, "en": {"n": "Lilach", "r": "Lady of the flowers", "t": "The youngest daughter of Balt-Ilu. Lilach made twelve offspring. The males of a flower lady's line are called Bior and the females Dior."}}, {"k": "succubus", "he": {"n": "סוקובוס ואינקובוס", "r": "צאצאים של לילית", "t": "חיים במסווה בין בני האדם. אינקובוס הוא השד הזכרי שמשפיע, מפתה ותוקף נשים, וסוקובוס היא השדה הנשית שמשפיעה, מפתה ותוקפת גברים. הם יונקים את האנרגייה מהקורבן במגע, מגע שמוביל לעייפות קיצונית, למחלות ואף למוות. הם יפים ומפתים, ומסתירים את טבעם המפלצתי בשינוי צורה. בצורתם האמיתית עורם בגוון סגול ורוד עד כחול והם בעלי קרניים."}, "en": {"n": "Succubus and incubus", "r": "Children of Lilith", "t": "They live disguised among humans. The incubus is the male demon who sways, seduces and preys on women; the succubus is the female who does the same to men. They draw energy from their victim through touch, which leaves extreme exhaustion, illness and sometimes death. They are beautiful and alluring, hiding a monstrous nature by changing shape. In their true form their skin runs from violet-pink to blue and they are horned."}}, {"k": "incubus", "he": {"n": "האינקובוס", "r": "הצורה הזכרית", "t": "בצורתו האמיתית הוא בעל קרניים ועור בגוון סגול ורוד עד כחול. הסוקובוסים והאינקובוסים חיים במסווה בין בני האדם, ובספרים הם קשורים לאחוזה שעל הר הכרמל."}, "en": {"n": "The incubus", "r": "The male form", "t": "In his true form he is horned, his skin between violet-pink and blue. Succubi and incubi live disguised among humans; in the books they are tied to the estate on Mount Carmel."}}, {"k": "ophrit", "he": {"n": "שדי עופרית", "r": "צאצאים של לילית", "t": "שדים שחיים במקומות שוממים כמו מדבריות, מעמקי יערות או מערות מתחת לאדמה. הם נמנעים ממגע גלוי עם בני האדם ויוצאים רק בסתר ובלילות. לעופרית יש יכולת להיכנס לחלומות של בני האדם ולהיזון מרגשות ומפחדים. הם מזוהים עם חופש פרוע ועם סכנה, והם חיים במונרכיות."}, "en": {"n": "Ophrit demons", "r": "Children of Lilith", "t": "Demons who live in desolate places: deserts, deep forest, caves beneath the ground. They avoid open contact with humans and come out only in secret, at night. An Ophrit can enter human dreams and feed on feeling and on fear. They stand for wild freedom and for danger, and they live in monarchies."}}];
const SHEOL       = [{"n": 1, "k": "tzalmavet", "he": {"n": "צלמוות", "s": "כעס", "r": "סאגו", "t": "המדור הראשון הוא אש. נהרות לבה נעים בו בתנועות איטיות ופסיכודליות ומציירים צורות יפות ומסוכנות בכתום, אדום וחום, ובתוך הנוזל הלוהט מפציעות זרועות ורגליים ענקיות של ענקי האש - כתמים כהים וחסרי צורה שרק הם מסגירים אותם. אין כאן מעלה ומטה, אין כיוון להיאחז בו, והחום כמעט בלתי נסבל: כנפיים נמסות באוויר הפתוח, והצווחות המעומעמות של הנשמות ממלאות את המרחב. לקראת הסוף הצבעים מאבדים מבוהקם, והמרחב נפתח אל מנהרה תלולה עם תקרת אבן, מפל לבה ומדף אבן רחב מעליו."}, "en": {"n": "Tzalmavet", "s": "Wrath", "r": "Sagu", "t": "The first circle is fire. Rivers of lava move through it in slow, psychedelic patterns, drawing beautiful and dangerous shapes in orange, red and brown, and out of the molten liquid rise the vast arms and legs of the fire giants - dark, shapeless stains that are the only thing that gives them away. There is no up and no down here, no direction to hold on to, and the heat is barely bearable: wings melt in the open air, and the muffled shrieking of the tormented fills the space. Toward its end the colours lose their brightness, and the space opens into a steep tunnel with a stone ceiling, a lava fall, and a wide ledge of rock above it."}}, {"n": 2, "k": "gula", "he": {"n": "גולא", "s": "גרגרנות", "r": "סמואל ובעל זבוב", "t": "שדות העינויים של בעל זבוב הם בית קברות אחד, שטוח ואינסופי, בלי עץ אחד. האדמה בוצית ומחוררת בשורות שאינן נגמרות של קברים פתוחים, וקירות אבן גבוהים סוגרים על הכול. מאות אלפי שרצים מכסים את הרצפה, את הקירות ואת האוויר - זבובי ענק, מרבי רגליים ארוכים, מקקים, יצורים בעלי עשרות עיניים קטנות ומפוצלות שמחזירות בבואות. הזמזום לא נפסק לרגע, ומעליו מרחף צל שמכסה את השמיים. בתוך כל זה עומד דבר אחד חריג: שיח היביסקוס בודד בגובה שלושה מטרים, גבעול ירוק עז ופרחים סגולים כהים. המעבר למדור הבא מוסתר תחת פסל ענק של צפרדע מוזהבת ומכוסה יבלות."}, "en": {"n": "Gula", "s": "Gluttony", "r": "Samuel and Beelzebub", "t": "Beelzebub's fields of torment are one flat, endless graveyard without a single tree. The ground is boggy and pitted with unending rows of open graves, and high stone walls close in on all of it. Hundreds of thousands of crawling things cover the floor, the walls and the air - giant flies, long centipedes, roaches, creatures with dozens of small split eyes that throw back reflections. The droning never stops for a moment, and above it hangs a shadow that covers the sky. In the middle of all this stands one thing that does not belong: a single hibiscus bush three metres tall, its stem a violent green, its flowers dark purple. The way down to the next circle is hidden beneath a huge statue of a golden, warty frog."}}, {"n": 3, "k": "abadon", "he": {"n": "אבדון", "s": "חמדנות", "r": "אבדון וממון", "t": "אחרי גרם מדרגות שחור וחלקלק שיורד באפלה מוחלטת נפתחת דלת טורקיז בוהקת, מעוטרת בכיתובים מסולסלים בשחור ובזהב, ומאחוריה טירה. הכול כאן ארגמן, זהב וכחול עמוק, רצפות שיש שחור מבריק ומנהרות חלקות - והכול בנוי מאשליות וכשפים. בחצר הפנימית עומד עץ אחד ענקי, ועליו תלויים פירות מוזהבים ומאורכים ששימשו פעם כלובים. באולם הכס, על רצפה בגוון בורדו מנצנץ, ניצב כס שיש שחור מוגבה על שלוש מדרגות. הפאר משכנע עד הרגע שבו הכישוף מתפוגג, ואז עולה מתחתיו ריח גופרית וריקבון. היציאה היא פתח כחול עמוק ברצפת ההיכל, שנראה כמו מים חמימים ומושך מטה."}, "en": {"n": "Abadon", "s": "Greed", "r": "Abadon and Mammon", "t": "After a black, slippery stairway descending in total darkness, a bright turquoise door opens, ornamented top to bottom in curling black and gold script, and behind it stands a castle. Everything here is crimson, gold and deep blue, floors of polished black marble and smooth tunnels - and all of it is built out of illusion and spellwork. In the inner courtyard stands one enormous tree, hung with long golden fruit that once served as cages. In the throne hall, on a floor of glittering burgundy, a black marble throne is raised on three steps. The splendour is convincing right up to the moment the enchantment thins, and underneath it rises a smell of sulphur and rot. The way out is a deep blue opening in the floor of the hall that looks like warm water, and pulls downward."}}, {"n": 4, "k": "acedia", "he": {"n": "אסידיה", "s": "שקרים, עצלנות וניצול", "r": "בלייעל ולוויתן", "t": "המדור הרביעי הוא תהום מימית כחולה ואינסופית, חמימה וסמיכה, שמערסלת את מי שנכנס אליה כמו רחם ענקית - ונעשית כהה ואפלה יותר ככל שיורדים. מערבולות תת ימיות ומנהרות סלע תלולות מטיחות בכל מה שנקרה בדרכן, ובמעמקים נראים לרגע צללים מעוותים של אנשים קרובים ואז נעלמים. מאות רצועות בד צהובות - תכריכי המוות של בלייעל - מתפתלות במים כמו צלופחים חיים ונכרכות סביב רגליים כדי לגרור למטה. האשמה כאן היא לא רגש אלא מקום: כל מילה מתעוותת לשקר או להלקאה עצמית, והרצון להילחם, לנשום או פשוט להמשיך פשוט אוזל. היציאה היא מפל שנשפך בעוצמה ונבלע מיד באדמה יבשה."}, "en": {"n": "Acedia", "s": "Lies, sloth and exploitation", "r": "Belial and Leviathan", "t": "The fourth circle is a blue, endless water abyss, warm and thick, cradling whoever enters it like an enormous womb - and growing darker the deeper you go. Underwater whirlpools and steep rock tunnels throw anything in their path, and in the depths the distorted shadows of people you love appear for a moment and vanish. Hundreds of yellow strips of cloth - Belial's burial shrouds - twist through the water like living eels and wind around legs to drag them down. Guilt here is not a feeling but a place: every word warps into a lie or a self-laceration, and the will to fight, to breathe, or simply to go on, quietly runs out. The way out is a waterfall that pours down hard and is swallowed at once into dry ground."}}, {"n": 5, "k": "shachat", "he": {"n": "שחט", "s": "קנאה", "r": "אליאס", "t": "אחרי המים בא מדבר. מרחב קשה, צחיח ומאובק, זרוע תצורות סלע ענקיות ומשוננות שנראות כמו פסלים משונים שמישהו פיזר לכל עבר. השמיים מתמלאים במהירות בעשרות דרקונים יורקי אש - שדי הדראקו, בגוונים של ירוק צהבהב שמזכיר ריקבון, ברגליים עבות ומקושקשות ובעיניים שמתמקדות בטרף כמו נץ. אין כאן איפה להסתתר, ואין זמן לחשוב. המעבר למדור השישי הוא סלע ענקי בצורת ביצה שמרחף מעל שלושה גייזרים פעורים באדמה: שניים מהם צולים כל מה שנכנס אליהם, ורק אחד הוא מעבר."}, "en": {"n": "Shachat", "s": "Envy", "r": "Elias", "t": "After the water comes desert. A hard, arid, dust-blown expanse strewn with enormous jagged rock formations that look like strange statues someone scattered in every direction. The sky fills quickly with dozens of fire-breathing dragons - the Draco demons, in shades of a yellowish green that recalls rot, with thick scaled legs and eyes that fix on prey like a hawk. There is nowhere to hide here, and no time to think. The way down to the sixth circle is an enormous egg-shaped rock hovering above three geysers gaping in the ground: two of them roast whatever enters, and only one is a passage."}}, {"n": 6, "k": "ophelia", "he": {"n": "אופליה", "s": "גאווה", "r": "לוציפר", "t": "המדור השישי הוא חושך. לא אפלולית - עלטה מוחלטת ואינסופית שאין בה שמץ אור, בלי מעלה ומטה, תחומה ברצפת אבן וסלעים. בתוכה נעים עשרות שדי הפמליאר בצעדים מהירים, ציפורניים ארוכות שחורטות בסלע, ניבים חדים וידיים קרות, וארס שמכניס לדם ערפל מתוק ומסוכן של רוגע - הפיתוי לעצום עיניים ולהרפות. הצליל הוא כל מה שנשאר: חריטה, לחשושים, צחוק מתענג, מאבק עמום. במרכז החושך עומדת מראת קסם ענקית שמאירה את המערה באור אדמדם, וכשעוברים דרכה השברים מתעופפים, נאספים ומתאחים מעצמם חזרה לאטימה מוחלטת."}, "en": {"n": "Ophelia", "s": "Pride", "r": "Lucifer", "t": "The sixth circle is darkness. Not dimness - a total, endless blackness without a trace of light, with no up and no down, bounded by a floor of stone and rock. Dozens of Famelier demons move through it at speed, long claws scoring the rock, sharp fangs, cold hands, and a venom that puts a sweet, dangerous fog of calm into the blood - the temptation to close your eyes and let go. Sound is all that is left: the scraping, the whispering, a delighted laugh, a muffled struggle. At the centre of the darkness stands an enormous mirror of magic that lights the cave in a reddish glow, and when you pass through it the shards fly apart, gather, and knit themselves closed again behind you."}}, {"n": 7, "k": "ir", "he": {"n": "עיר החטאים", "s": "מושב המלוכה", "r": "לוקיאנתרו / אשמדאי", "t": "המדור השביעי הוא מושב המלוכה. מערכת מנהרות אבן חשוכות שקירותיהן רוטטים מקולות השאגה, ורצפתן מוכתמת בשובלי דם, מובילה לאולם כס ענקי - ובו כס המלכות ולצידו כס אבן חדש. שבעים ושניים שבטי השאול ממלאים את האולם בנחיל צפוף ורב גוני, וכל מנהיג נראה אחרת מקודמו: שד בעל שש ידיים שנעות כנחשים, שדים שהולכים על ארבע בפרווה שחורה ולבנה, שד לבן חולני בעל שמונה זרועות שלאורכן פתחי נשימה מעגליים שנפתחים ונסגרים. הכתרים עצמם הם הדבר שנשאר בזיכרון: מתכת מבריקה, גולגולות שדים, קרניים חדות, ועין ירוקה גדולה במרכז. השאגות מרעידות את הקירות ומהדהדות בגוף עצמו."}, "en": {"n": "The City of Sinners", "s": "Seat of the crown", "r": "Lukiantro / Ashmadai", "t": "The seventh circle is the seat of the crown. A system of dark stone tunnels, their walls shaking with the sound of roaring and their floors streaked with blood, leads to an enormous throne hall - the royal throne, and beside it a new one of stone. The seventy-two tribes of Sheol fill the hall in a dense, many-coloured swarm, and no two leaders look alike: a demon with six arms that move like snakes, demons walking on all fours in black and white fur, a sickly white demon with eight long arms lined with circular breathing holes that open and close. It is the crowns themselves that stay in the memory: bright metal, demon skulls, sharp horns, and one large green eye at the centre. The roaring shakes the walls and echoes in the body itself."}}];
const LEGIONS     = [{"k": "elyon", "he": {"n": "מלאכי-עליון", "t": "הלגיון שבראשו עומדות ארבע מלאכיות העליון: מיקה, גבי, ריף ואור."}, "en": {"n": "The High Angels", "t": "The legion headed by the four archangel sisters: Mika, Gabi, Riff and Or."}}, {"k": "moatza", "he": {"n": "המועצה", "t": "בראשה עומדות מלאכיות העליון. מורכבת משמונה עשר נציגים, אחד מכל לגיון, ועוד ארבעים נציגים מקהילות המלאכים בעולם. רבים מהמקומות עוברים בתורשה בין משפחות מלאכים."}, "en": {"n": "The Council", "t": "Headed by the archangel sisters. Eighteen delegates, one from each legion, and forty more from angel communities around the world. Many of the seats pass down through angel families."}}, {"k": "tevel", "he": {"n": "לגיון התבל", "t": "מורכב מראשי שלושת לגיונות האזור: מלאכי ישראל, מלאכי המערב ומלאכי המזרח. המערב יושב בבריסטול שבאנגליה, המזרח בצ'יאנג מאי שבתאילנד."}, "en": {"n": "The World Legion", "t": "The heads of the three regional legions: the angels of Israel, of the West and of the East. The West sits in Bristol, England; the East in Chiang Mai, Thailand."}}, {"k": "arbaa", "he": {"n": "לגיון הארבעה", "t": "מפקדו הוא ראש לגיון מלאכי ישראל, ולצידו שלושה מלאכים, כל אחד נצר לשושלת מלאכי העליון. ראש הלגיון נשאר בתפקידו עד מותו או עד שישוחרר, והאחריות למינוי מוטלת על מלאכיות העליון."}, "en": {"n": "The Legion of Four", "t": "Commanded by the head of the angels of Israel, with three angels beside him, each descended from an archangel line. Its head serves until death or release, and the archangel sisters appoint him."}}, {"k": "mevasrim", "he": {"n": "לגיון המבשרים", "t": "ממלאכי גבריאל, היושבים בראש ההר הגבוה בכל יבשת ומקיימים טקסים ותפילות כדי להיות קרובים לשמיים. הם מתחברים לקווי זמן ולזרמי אירועים הרי גורל, ובין שאר תפקידיהם אחראים לצפות התנהגות שדים."}, "en": {"n": "The Heralds", "t": "Gabriel's angels, who sit on the highest mountain of each continent and hold rites and prayers to stay close to the sky. They read timelines and currents of fateful events, and among other duties they forecast the movements of demons."}}, {"k": "hayalim", "he": {"n": "לגיון החיילים", "t": "חיילי מיכאל, שמובלים בידי מלאכית העליון מיקה ולצידה ראש מלאכי ישראל. לוחמים מיומנים, חזקים וממושמעים, שנבחרים בקפידה."}, "en": {"n": "The Soldiers", "t": "Michael's soldiers, led by the archangel Mika with the head of the angels of Israel beside her. Skilled, strong, disciplined fighters, chosen with care."}}, {"k": "marpeim", "he": {"n": "לגיון המרפאים", "t": "ממלאכי רפאל. מפעיל את מרפאות המלאכים, וחלקם פועלים גם בין בני האדם. הלגיון שולח נציג לכל קהילה ולכל מוסד. חאן המרפאים ממוקם בבריסטול שבאנגליה."}, "en": {"n": "The Healers", "t": "Raphael's angels. They run the angel clinics, and some work among humans as well. The legion sends a delegate to every community and institution. The healers' Khan is in Bristol, England."}}, {"k": "rokchim", "he": {"n": "לגיון הרוקחים", "t": "ממלאכי גבריאל. רוקח שיקויים לטיפול בחולים, לחיזוק מלאכים ולגירוש שדים ממקומות קדושים, ושולח נציגים לקהילות המלאכים ולבני האדם."}, "en": {"n": "The Apothecaries", "t": "Gabriel's angels. They brew potions to treat the sick, to strengthen angels and to drive demons from holy places, and send delegates to angel communities and to humans."}}, {"k": "matzmichim", "he": {"n": "לגיון המצמיחים", "t": "מגדל את האוכל הטהור שהמלאכים אוכלים. בכל מדינה יש התיישבות של מצמיחים שאחראית למזון המלאכים באזור."}, "en": {"n": "The Growers", "t": "They raise the pure food the angels eat. Every country has a growers' settlement responsible for the angels' food in that region."}}, {"k": "mishlachot", "he": {"n": "לגיון המשלחות", "t": "עף ברחבי העולם ומאתר חפצי מלאכים וחפצים קדושים: ביצי מלאכים, ספרים, חפצים טהורים ועוד."}, "en": {"n": "The Expeditions", "t": "They fly the world locating angel relics and sacred objects: angel eggs, books, pure artefacts and more."}}, {"k": "north", "he": {"n": "לגיון השומרים הצפוני", "t": "מפעיל את כלא המלאכים בצפת, ואחראי לשמור ולהגן על קבוצת מלאכי צפת."}, "en": {"n": "The Northern Guard", "t": "They run the angel prison in Safed and protect the Safed angel group."}}, {"k": "south", "he": {"n": "לגיון השומרים הדרומי", "t": "מפעיל את כלא המלאכים במצפה רמון, ואחראי לשמור ולהגן על קבוצת מלאכי מצפה רמון."}, "en": {"n": "The Southern Guard", "t": "They run the angel prison in Mitzpe Ramon and protect the Mitzpe Ramon angel group."}}, {"k": "east", "he": {"n": "לגיון המלאכים המזרחי", "t": "מרכז את פעילות המלאכים במזרח ומפעיל את כלא המלאכים בצ'יאנג מאי, תאילנד."}, "en": {"n": "The Eastern Legion", "t": "They coordinate angel activity in the East and run the angel prison in Chiang Mai, Thailand."}}, {"k": "west", "he": {"n": "לגיון השומרים המערבי", "t": "מרכז את פעילות המלאכים במערב ומפעיל את כלא המלאכים בבריסטול, אנגליה."}, "en": {"n": "The Western Guard", "t": "They coordinate angel activity in the West and run the angel prison in Bristol, England."}}, {"k": "safranim", "he": {"n": "לגיון הספרנים", "t": "אחראי על מחקר ופיתוח: תיעוד היסטוריית המלאכים והשדים, ותיעוד עבודת הרוקחים, הרופאים, הקמעות, כלי הנשק ומשפטי המלאכים. מלאכיו אינם חיים בקהילה אלא עפים למרכזי מלאכים, ושם הם כותבים ספרי מחקר ומשמשים כתבים קיימים המבוססים על מורשת מלאכי העבר."}, "en": {"n": "The Librarians", "t": "Research and development: the history of angels and demons, and the record of the apothecaries, the physicians, the amulets, the weapons and angel law. Its angels do not live in a community but fly between angel centres, writing research and keeping the older texts, which rest on what past angels left behind."}}, {"k": "metashteshim", "he": {"n": "לגיון המטשטשים", "t": "אחראי על מחיקת הסימנים והעקבות שמשאירים מלאכים ושדים בעולם בני האדם. קהילה קטנה ומבודדת, שמלאכיה נעים בין מוקדי עימות."}, "en": {"n": "The Blurrers", "t": "They erase the marks and traces angels and demons leave in the human world. A small, isolated community whose angels move between flashpoints."}}, {"k": "gashmiim", "he": {"n": "לגיון הגשמיים", "t": "אחראי על המגע עם עולם בני האדם: שילוב מלאכים במשרות מפתח, רישום מלאכים צעירים לבתי ספר, וטיפול מול גורמים אנושיים כמו עיריות וגורמי רווחה. במידת הצורך הוא גם אחראי על הקשר עם הנפילים."}, "en": {"n": "The Worldly", "t": "They handle contact with the human world: placing angels in key jobs, enrolling young angels in schools, dealing with municipalities and welfare services. When needed, they also hold the line to the Nephilim."}}, {"k": "otzar", "he": {"n": "לגיון האוצר", "t": "אחראי על ניהול הכסף וההשקעות שמאפשרים לקהילות המלאכים להתקיים, ועובד ברציפות מול לגיון הגשמיים."}, "en": {"n": "The Treasury", "t": "They manage the money and investments that keep the angel communities running, working closely with the Worldly."}}, {"k": "muarim", "he": {"n": "לגיון המוארים", "t": "אחראי על כיוון העולם האנושי לטוב. מלאכיו לוחשים באוזני מנהיגים, לוחמים, מצביאים, אומנים והוגי דעות. הלגיון אינו עוסק בלחימה, ומלאכיו לא יפגעו באף בריה, אדם, מלאך או שד, גם במחיר הקרבת עצמם."}, "en": {"n": "The Illumined", "t": "They steer the human world toward good, whispering to leaders, fighters, commanders, artists and thinkers. The legion does not fight, and its angels will harm no creature, human, angel or demon, even at the cost of themselves."}}, {"k": "kele", "he": {"n": "לגיון הכלא העמוק", "t": "מפעיל את כלא השדים הוותיק והגדול ביותר, הממוקם בירושלים. הכלא העמוק היה הראשון שיועד לשדים ולחצאי שדים, והלגיון מכונה גם לגיון העשרים."}, "en": {"n": "The Deep Prison", "t": "They run the oldest and largest demon prison, in Jerusalem. The Deep Prison was the first built for demons and half-demons, and the legion is also called the Twentieth."}}];
const KHAN_ROOMS  = [{"k": "netzach", "he": {"n": "חדר הנצח", "t": "החדר החשוב ביותר, שסביבו נבנה החאן. במרכזו נמצא מעיין הנשמות. כחלק מטקס ההתבגרות, כל מלאך שמגיע לגיל עשר מטפטף טיפה מדמו למים ובכך מצרף חלק מנשמתו למעיין, מעשה שמחבר ומעצים את נשמות המלאכים."}, "en": {"n": "The Hall of Netzach", "t": "The most important room, the one the Khan was built around. At its centre lies the Spring of Souls. As part of the coming-of-age rite, every angel who turns ten lets a drop of blood fall into the water and joins part of their soul to the spring, an act that binds and strengthens the souls of the angels."}}, {"k": "keter", "he": {"n": "היכל הכתר", "t": "החדר הגדול בחאן. על תקרתו ויטראז'ים מעוטרים של ארבעת מלאכי העליון. כאן מתקיימות הדרשות של ראש החאן והרצאות המלאכים האורחים."}, "en": {"n": "The Hall of Keter", "t": "The largest room in the Khan, its ceiling set with stained glass of the four archangels. Here the head of the Khan preaches and visiting angels give their talks."}}, {"k": "chochmah", "he": {"n": "חדר החוכמה", "t": "חדרו של ראש החאן. הכניסה אליו היא מתוך היכל הכתר."}, "en": {"n": "The Room of Chochmah", "t": "The chamber of the head of the Khan, entered from the Hall of Keter."}}, {"k": "kivshan", "he": {"n": "חדר הכבשן", "t": "החדר שבו חרוט על הקיר עץ השדים העתיק, המשקף את שושלת שדי השאול לדורותיהם. בחדר עומד שולחן עגול עתיק שסביבו המלאכים מתכננים מתקפות נגד שדים."}, "en": {"n": "The Furnace Room", "t": "Its wall is carved with the ancient demon tree, the line of the demons of Sheol through the generations. An old round table stands there, and around it the angels plan their strikes."}}, {"k": "gevurah", "he": {"n": "חדר הגבורה", "t": "חדר גדול שבו המלאכים מתאמנים בלחימה. הריק שבו מאפשר להם להתאמן על הקרקע או בתעופה, עם כלי נשק או בידיים חשופות."}, "en": {"n": "The Hall of Gevurah", "t": "A large room where the angels train to fight. Its emptiness lets them work on the ground or in flight, armed or bare-handed."}}, {"k": "malchut", "he": {"n": "חדר המלכות", "t": "חדר האימונים של מלאכי רפאל, מאובזר בכלים ובחומרים להכנת קמעות ובכלי עזר לריפוי."}, "en": {"n": "The Room of Malchut", "t": "The training room of Raphael's angels, stocked for making amulets and for healing."}}, {"k": "hod", "he": {"n": "חדר ההוד", "t": "חדר האימונים של מלאכי מיכאל, ובו קיר נשקים וכלים שונים לאימון בקרבות."}, "en": {"n": "The Room of Hod", "t": "The training room of Michael's angels, with a weapons wall and gear for combat drill."}}, {"k": "tiferet", "he": {"n": "חדר התפארת", "t": "חדר האימון של מלאכי גבריאל, מאובזר לרקיחת שיקויים, להתמחות בציור ולהתמקצעות ביצירת חלונות מקום וזמן."}, "en": {"n": "The Room of Tiferet", "t": "The training room of Gabriel's angels, equipped for brewing, for painting, and for opening windows of place and time."}}, {"k": "chesed", "he": {"n": "מרפאת החסד", "t": "המרפאה של החאן, מנוהלת על ידי רפאל בכיר ומיומן ותחתיו שני מתלמדים, שבסיום הכשרתם יועברו ללגיונות או לקבוצות המלאכים השונות."}, "en": {"n": "The Chesed Clinic", "t": "The Khan's clinic, run by a senior Raphael angel with two apprentices, who move on to legions or angel groups when their training ends."}}, {"k": "binah", "he": {"n": "מועדון הבינה", "t": "מועדון המלאכים: רגיעה ומנוחה, שיחות וזמן אישי. יש בו גם ספרייה זמינה למלאכים לשם העשרה וצבירת ידע."}, "en": {"n": "The Binah Club", "t": "The angels' club: rest, conversation and time alone. It holds a library open to the angels."}}, {"k": "dorms", "he": {"n": "מעונות", "t": "מקום השינה של המלאכיות והמלאכים."}, "en": {"n": "The Dormitories", "t": "Where the angels sleep."}}, {"k": "yesodot", "he": {"n": "חדרי היסודות", "t": "החדרים של המורים, המנטורים והאורחים שמגיעים לחאן."}, "en": {"n": "The Yesod Rooms", "t": "Rooms for the teachers, the mentors and the guests who come to the Khan."}}, {"k": "courtyard", "he": {"n": "רחבת החאן", "t": "המרחב שבין החדרים."}, "en": {"n": "The Khan Court", "t": "The space between the rooms."}}];
const ANGELS      = [{"he": {"n": "מלאכית העליון מיקה", "a": "בת 17", "t": "התגלמותו של מלאך העליון מיכאל על האדמה, ראש לגיון הלוחמים."}, "en": {"n": "The archangel Mika", "a": "17", "t": "The incarnation of the archangel Michael on earth, head of the soldiers' legion."}}, {"he": {"n": "מלאכית העליון גבי", "a": "בת 17", "t": "התגלמותו של מלאך העליון גבריאל על האדמה, ראש לגיון הכלא העמוק."}, "en": {"n": "The archangel Gabi", "a": "17", "t": "The incarnation of the archangel Gabriel on earth, head of the Deep Prison legion."}}, {"he": {"n": "מלאכית העליון ריף", "a": "בת 17", "t": "התגלמותו של מלאך העליון רפאל על האדמה, ראש לגיון המרפאים."}, "en": {"n": "The archangel Riff", "a": "17", "t": "The incarnation of the archangel Raphael on earth, head of the healers' legion."}}, {"he": {"n": "מלאכית העליון אור", "a": "בת 17", "t": "התגלמותו של מלאך העליון אוריאל על האדמה."}, "en": {"n": "The archangel Or", "a": "17", "t": "The incarnation of the archangel Uriel on earth."}}, {"he": {"n": "פריאל", "a": "בן 1,009", "t": "מלאך משושלת מלאכי רפאל, ראש חאן מלאכי ירושלים. מנהל את החאן זה 500 שנה, אחד משלושת המלאכים הוותיקים והמוערכים ביותר. עוסק במדעי הרוח ובבניית מתודולוגיה חינוכית."}, "en": {"n": "Peliel", "a": "1,009", "t": "Of Raphael's line, head of the Jerusalem Khan. He has run it for five hundred years and is one of the three oldest and most respected angels alive. He works in the humanities and in building a teaching method."}}, {"he": {"n": "מריאל", "a": "בת 1,278", "t": "מלאכית משושלת מלאכי גבריאל, אחת משלושת המלאכים הוותיקים ביותר בעולם. אימן של תבל ושל זהר. בעברה ראש מועצת מלאכי ישראל, כיום חברת מועצה המייצגת את משפחות המלאכים בירושלים."}, "en": {"n": "Mariel", "a": "1,278", "t": "Of Gabriel's line, one of the three oldest angels in the world. Mother of Tevel and Zohar. Once head of the council of the angels of Israel, today a council member for the Jerusalem angel families."}}, {"he": {"n": "חננאל", "a": "בן 643", "t": "מלאך משושלת מלאכי מיכאל. ראש מועצת המלאכים, ראש לגיון מלאכי ישראל ולגיון הארבעה. פיקד על מערכות רבות וקרבות רבים מול עולם השדים."}, "en": {"n": "Hananel", "a": "643", "t": "Of Michael's line. Head of the angel council, of the legion of the angels of Israel and of the Legion of Four. He has commanded many campaigns and many battles against the demon world."}}, {"he": {"n": "צדקיאל", "a": "בן 312", "t": "מלאך משושלת מלאכי מיכאל, מכונה 'סגול הכנפיים' על שם דם השדים הרב ששפך. מיומנותו כלוחם הקנתה לו מעמד אגדי. אחרי כ־250 שנות שירות כמנהל הכלא העמוק שינה את ייעודו והתמקד בתגבור כוחות ברחבי העולם. אביו של אופיר."}, "en": {"n": "Tzadkiel", "a": "312", "t": "Of Michael's line, called Purple Wings for all the demon blood he spilled. His skill as a fighter made him a legend. After some 250 years running the Deep Prison he changed course and now reinforces forces around the world. Ophir's father."}}, {"he": {"n": "זהר", "a": "בת 75", "t": "מלאכית משושלת מלאכי גבריאל, בתה של מריאל. נועדה לגדולות מגיל צעיר. שירתה בעבר בלגיון הכלא, אך שירותה הופסק עקב עבירת משמעת חמורה."}, "en": {"n": "Zohar", "a": "75", "t": "Of Gabriel's line, Mariel's daughter, marked for great things from a young age. She served in the prison legion until a serious breach of discipline ended it."}}, {"he": {"n": "וודנה", "a": "בת 444", "t": "מלאכית משושלת מלאכי גבריאל, בתו של ראש לגיון המטשטשים. בעלת יכולות שליטה יוצאות דופן בממד הזמן."}, "en": {"n": "Vodna", "a": "444", "t": "Of Gabriel's line, daughter of the head of the Blurrers. She has a rare command of time."}}, {"he": {"n": "תירום", "a": "בן 262", "t": "מלאך משושלת מלאכי גבריאל, סגן ראש לגיון הכלא העמוק."}, "en": {"n": "Tirom", "a": "262", "t": "Of Gabriel's line, deputy head of the Deep Prison legion."}}, {"he": {"n": "פנימור", "a": "בת 301", "t": "מלאכית משושלת מלאכי מיכאל, ראש תא המלאכים במצפה רמון. אימה של קדמיאל."}, "en": {"n": "Panimor", "a": "301", "t": "Of Michael's line, head of the angel cell in Mitzpe Ramon. Kadmiel's mother."}}, {"he": {"n": "נאל", "a": "בן 197", "t": "מלאך משושלת מלאכי מיכאל, משרת בלגיון הספרנים. חלק ממשפחות המלאכים בירושלים."}, "en": {"n": "Nael", "a": "197", "t": "Of Michael's line, serving in the librarians' legion. One of the Jerusalem angel families."}}, {"he": {"n": "שמיהוד", "a": "בן 195", "t": "מלאך משושלת מלאכי רפאל, בכיר בלגיון הספרנים, ידוע כמומחה בתורת הקמעות."}, "en": {"n": "Shmihud", "a": "195", "t": "Of Raphael's line, senior in the librarians' legion, known as a master of amulet lore."}}, {"he": {"n": "יבניאל", "a": "בן 142", "t": "מלאך משושלת מלאכי מיכאל. שירת בלגיון המשלחות, ומשמש במועצת המלאכים כיועץ בכיר לאסטרטגיה צבאית."}, "en": {"n": "Yavniel", "a": "142", "t": "Of Michael's line. He served in the expeditions legion and advises the council on military strategy."}}, {"he": {"n": "עמנואל", "a": "בת 110", "t": "מלאכית משושלת מלאכי רפאל, מלמדת בחאן המלאכים ואחראית על מלאכי רפאל. לפני כן הייתה חלק מלגיון המשלחות."}, "en": {"n": "Immanuel", "a": "110", "t": "Of Raphael's line, teaches at the Khan and is responsible for Raphael's angels. Before that she was in the expeditions legion."}}, {"he": {"n": "זכריאל", "a": "בן 43", "t": "מלאך משושלת מלאכי רפאל, משרת בלגיון המצמיחים בצפת. אחיה של קניאל."}, "en": {"n": "Zachriel", "a": "43", "t": "Of Raphael's line, serving with the growers in Safed. Kaniel's brother."}}, {"he": {"n": "קניאל", "a": "בת 25", "t": "מלאכית משושלת מלאכי רפאל, מלמדת בחאן את תורת כלי הנשק ומשרתת בלגיון מלאכי רפאל. אחותו של זכריאל."}, "en": {"n": "Kaniel", "a": "25", "t": "Of Raphael's line, teaches weapons at the Khan and serves in Raphael's legion. Zachriel's sister."}}, {"he": {"n": "ברק (ברקיאל)", "a": "בן 18", "t": "מלאך משושלת מלאכי מיכאל, בנה של דנהל מקבוצת המלאכים בצפת. אחיה התאום של בר."}, "en": {"n": "Barak (Barkiel)", "a": "18", "t": "Of Michael's line, son of Danhal of the Safed angels. Bar's twin."}}, {"he": {"n": "בר (ברניאל)", "a": "בת 18", "t": "מלאכית משושלת מלאכי מיכאל, בתה של דנהל מקבוצת המלאכים בצפת. אחותו התאומה של ברק, משרתת בלגיון מלאכי מיכאל."}, "en": {"n": "Bar (Barniel)", "a": "18", "t": "Of Michael's line, daughter of Danhal of the Safed angels. Barak's twin, serving in Michael's legion."}}, {"he": {"n": "אופיר (אופיריאל)", "a": "בן 17", "t": "מלאך משושלת מלאכי מיכאל, בנו של צדקיאל סגול הכנפיים. אימו נרצחה בידי שדים."}, "en": {"n": "Ophir (Ophiriel)", "a": "17", "t": "Of Michael's line, son of Tzadkiel Purple Wings. His mother was killed by demons."}}, {"he": {"n": "אתר", "a": "בת 16", "t": "מלאכית משושלת מלאכי גבריאל, בתם של תקו ומור. מקבוצת המלאכים במצפה רמון."}, "en": {"n": "Eter", "a": "16", "t": "Of Gabriel's line, daughter of Tko and Mor, of the Mitzpe Ramon angels."}}, {"he": {"n": "הודיה", "a": "בת 15", "t": "מלאכית משושלת מלאכי רפאל, בתה של לב. מקבוצת המלאכים במצפה רמון."}, "en": {"n": "Hodaya", "a": "15", "t": "Of Raphael's line, daughter of Lev, of the Mitzpe Ramon angels."}}, {"he": {"n": "אנאבל", "a": "בת 14", "t": "מלאכית משושלת מלאכי רפאל. הוריה נרצחו בידי שדים, והיא גרה בחאן עם אחותה עמנואל שמשמשת שם מורה."}, "en": {"n": "Anabel", "a": "14", "t": "Of Raphael's line. Her parents were killed by demons and she lives at the Khan with her sister Immanuel, who teaches there."}}, {"he": {"n": "נור (נוריאל)", "a": "בן 13", "t": "מלאך משושלת מלאכי רפאל, בנה של רנין. ממשפחות המלאכים בירושלים."}, "en": {"n": "Nur (Nuriel)", "a": "13", "t": "Of Raphael's line, son of Ranin, of the Jerusalem angel families."}}, {"he": {"n": "מיאל", "a": "בת 12", "t": "מלאכית משושלת מלאכי רפאל, בתם של הדריאל ואסתיאל. ממשפחות המלאכים בצפת."}, "en": {"n": "Miel", "a": "12", "t": "Of Raphael's line, daughter of Hadriel and Astiel, of the Safed angel families."}}, {"he": {"n": "עוז (עוזיאל)", "a": "בן 10", "t": "מלאך משושלת מלאכי גבריאל, בנו של מלכיה, ראש מלאכי צפת."}, "en": {"n": "Oz (Uziel)", "a": "10", "t": "Of Gabriel's line, son of Malkiya, head of the Safed angels."}}];
const LORE_ERAS   = [{"k": "jer", "he": {"n": "מלכות ירושלים וקפריסין", "s": "דורות 1-10"}, "en": {"n": "The kingdoms of Jerusalem and Cyprus", "s": "Generations 1-10"}}, {"k": "fra", "he": {"n": "מלכות צרפת וספרד", "s": "דורות 11-20"}, "en": {"n": "The crowns of France and Spain", "s": "Generations 11-20"}}, {"k": "aut", "he": {"n": "אוסטריה וישראל", "s": "דורות 21-33"}, "en": {"n": "Austria and Israel", "s": "Generations 21-33"}}];
const LINEAGE     = [{"i": 1, "e": "jer", "y": "1172", "he": {"n": "איזבלה הראשונה", "t": "מלכת ירושלים. מלכה על הממלכה החשובה ביותר בעולם הצלבני, בתקופה הקשה ביותר שלה."}, "en": {"n": "Isabella I", "t": "Queen of Jerusalem, ruling the most important kingdom of the Crusader world in its hardest years."}}, {"i": 2, "e": "jer", "y": "1196", "he": {"n": "אליס משמפאן", "t": "בתה של איזבלה, מלכת ירושלים. בשידוך שסידרה סבתה מריה קומננה נישאה להוגו הראשון והפכה למלכת קפריסין."}, "en": {"n": "Alice of Champagne", "t": "Isabella's daughter, queen of Jerusalem. A match arranged by her grandmother Maria Komnene married her to Hugh I and made her queen of Cyprus."}}, {"i": 3, "e": "jer", "y": "1216", "he": {"n": "איזבלה דה ליזיניאן", "t": "בתם של הוגו ואליס, קרויה על שם סבתה. הייתה עוצרת ממלכת ירושלים ונסיכה בממלכת קפריסין."}, "en": {"n": "Isabella de Lusignan", "t": "Daughter of Hugh and Alice, named for her grandmother. Regent of Jerusalem and princess of Cyprus."}}, {"i": 4, "e": "jer", "y": "1235", "he": {"n": "הוגו השלישי", "t": "מלך קפריסין, מכונה גם הוגו הגדול. הפליג לעכו כדי לשלוט באופן רשמי גם בממלכת ירושלים, וקיבל לכך את אישור האפיפיור."}, "en": {"n": "Hugh III", "t": "King of Cyprus, called Hugh the Great. He sailed to Acre to rule Jerusalem formally as well, with the Pope's approval."}}, {"i": 5, "e": "jer", "y": "1280", "he": {"n": "גאי דה ליזיניאן", "t": "בנו הצעיר של הוגו השלישי. מרד באחיו הגדולים כדי לזכות בשלטון, נתפס והוצא להורג בגיל 23."}, "en": {"n": "Guy de Lusignan", "t": "Hugh III's youngest son. He rebelled against his older brothers for the throne, was caught and executed at 23."}}, {"i": 6, "e": "jer", "y": "1296", "he": {"n": "הוגו הרביעי", "t": "מלך קפריסין. אביו היה בן 16 ואימו, אשיבה גבירת ביירות, הייתה בת 40. ירש את דודו הנרי השני בשנת 1324 והפך את קפריסין למעצמה כלכלית."}, "en": {"n": "Hugh IV", "t": "King of Cyprus. His father was 16 and his mother, Eschiva lady of Beirut, was 40. He inherited from his uncle Henry II in 1324 and turned Cyprus into an economic power."}}, {"i": 7, "e": "jer", "y": "1334", "he": {"n": "ז'אק הראשון", "t": "מפקד אמיץ ונערץ של צבא קפריסין. נלקח כבן ערובה לאיטליה לתשע שנים; כשמת המלך פייר השני מינה אותו הפרלמנט למלך בעודו בכלא. שוחרר בכופר עצום והפך מייד למלך קפריסין, ירושלים וארמניה."}, "en": {"n": "James I", "t": "A brave and admired commander of the Cypriot army. Held hostage in Italy for nine years; when King Peter II died the parliament named him king while he was still imprisoned. Ransomed at enormous cost, he became king of Cyprus, Jerusalem and Armenia."}}, {"i": 8, "e": "jer", "y": "1375", "he": {"n": "ז'אנוס", "t": "נולד בשבי והגיע לקפריסין רק בגיל 10. עלה לשלטון ב-1398, אך היה מלך פזיז שהרגיז את ממלכת מצרים, שפלשה לקפריסין ולקחה אותו בשבי. ידוע כמלך שנולד בשבי ומת בשבי."}, "en": {"n": "Janus", "t": "Born in captivity, he reached Cyprus only at ten. He took the throne in 1398, a rash king who provoked Egypt; it invaded Cyprus and took him prisoner. Known as the king born a captive and dead a captive."}}, {"i": 9, "e": "jer", "y": "1418", "he": {"n": "אן מקפריסין", "t": "בתו של ז'אנוס. התחתנה עם לואי דוכס סבויה. ידועה כאישה יפהפייה שאהבה לערוך נשפים מפוארים ברחבי אירופה."}, "en": {"n": "Anne of Cyprus", "t": "Janus's daughter, married to Louis Duke of Savoy. Known as a great beauty who loved to hold magnificent balls across Europe."}}, {"i": 10, "e": "jer", "y": "1438", "he": {"n": "פיליפ השני", "t": "ידוע כפיליפ חסר הקרקע. מרד בהוריו ונכלא בידי לואי ה-11 מלך צרפת. בגיל 58 הפך לדוכס סבויה אחרי שאחיו מת ללא יורשים."}, "en": {"n": "Philip II", "t": "Known as Philip Landless. He rebelled against his parents and was imprisoned by Louis XI of France. At 58 he became Duke of Savoy when his brother died without heirs."}}, {"i": 11, "e": "fra", "y": "1476", "he": {"n": "לואיזה נסיכת סבויה", "t": "עברה לחצר צרפת כשהבינה שלמלך אין בנים חיים, ואימנה את בנה פרנסואה ליום שבו יוכל להפוך למלך. ב-1515 שכנעה את אצילי צרפת למנות אותו."}, "en": {"n": "Louise of Savoy", "t": "She moved to the French court once she saw the king had no living sons, and trained her son Francis for the day he could take the throne. In 1515 she persuaded the nobles to name him king."}}, {"i": 12, "e": "fra", "y": "1494", "he": {"n": "פרנסואה הראשון", "t": "מלך צרפת. הושפע מתרבות הרנסנס, בנה מחדש את הלובר, קנה את המונה ליזה ושכנע את לאונרדו דה וינצ'י לעבור לצרפת. דה וינצ'י מת כשהוא אוחז בידו."}, "en": {"n": "Francis I", "t": "King of France. A man of the Renaissance, he rebuilt the Louvre, bought the Mona Lisa and brought Leonardo da Vinci to France. Da Vinci died holding his hand."}}, {"i": 13, "e": "fra", "y": "1519", "he": {"n": "אנרי השני", "t": "מלך צרפת, קתולי אדוק, שהוביל למלחמות דת בין קתולים לפרוטסטנטים. התחתן עם קתרינה דה מדיצ'י, ואחרי שנהרג בתאונה היא ששלטה בפועל: הובילה מלחמות דת, אך גם הביאה לצרפת את הבלט ופיתחה את המטבח הצרפתי המודרני."}, "en": {"n": "Henry II", "t": "King of France, a devout Catholic whose reign led into the wars of religion. He married Catherine de' Medici, and after he was killed in an accident she ruled in fact: she waged the religious wars, but she also brought ballet to France and shaped its modern cuisine."}}, {"i": 14, "e": "fra", "y": "1546", "he": {"n": "אליזבת דה ולואה", "t": "בתם של קתרינה ואנרי. נישאה לפליפה השני מלך ספרד כחלק מהסכם שלום היסטורי, ולמרות שהיה זה שידוך נראה שהזוג אהבו זה את זה מאוד. מתה בלידה."}, "en": {"n": "Elisabeth de Valois", "t": "Daughter of Catherine and Henry. She married Philip II of Spain as part of a historic peace, and though it was arranged the two seem to have loved each other deeply. She died in childbirth."}}, {"i": 15, "e": "fra", "y": "1567", "he": {"n": "קתרינה מיקאלה", "t": "נסיכת ספרד, בתם של אליזבת ופליפה השני. התחתנה עם קרלו אמנואלה הראשון, דוכס סבויה, והמשיכה כל חייה בקשר מכתבים רציף ואוהב עם אביה."}, "en": {"n": "Catherine Michelle", "t": "Princess of Spain, daughter of Elisabeth and Philip II. She married Charles Emmanuel I of Savoy and wrote to her father lovingly all her life."}}, {"i": 16, "e": "fra", "y": "1587", "he": {"n": "ויטוריו אמדאו", "t": "דוכס סבויה. חלם להיות מלך, ובזכות הקשר המשפחתי הכריז על עצמו כמלך ירושלים, קפריסין וארמניה. התחתן עם האצילה הצרפתייה כריסטין מארי, 'מאדאם רויאל', שנחשבה למי שהביאה את השיק הצרפתי לסבויה."}, "en": {"n": "Victor Amadeus", "t": "Duke of Savoy. He dreamed of a crown and, on the strength of the family line, declared himself king of Jerusalem, Cyprus and Armenia. He married the French noblewoman Christine Marie, Madame Royale, who is credited with bringing French chic to Savoy."}}, {"i": 17, "e": "fra", "y": "1636", "he": {"n": "הנרייטה אדלייד מסבויה", "t": "התחתנה בשידוך עם פרדיננד מריה, נסיך בוואריה. הביאה למינכן את מהפכת הבארוק האיטלקי ואת התרבות הצרפתית, כשהביאה איתה משוררים, זמרים ואדריכלים איטלקים."}, "en": {"n": "Henriette Adelaide of Savoy", "t": "Married to Ferdinand Maria, prince of Bavaria. She brought the Italian baroque and French culture to Munich, arriving with Italian poets, singers and architects in her train."}}, {"i": 18, "e": "fra", "y": "1660", "he": {"n": "מריה אנה ויקטוריה", "t": "התחתנה עם לואי הדופין, בנו של לואי ה-14. מתה קצת לפני שלואי ה-14 מת, ולכן לא הפכה בעצמה למלכת צרפת."}, "en": {"n": "Maria Anna Victoria", "t": "Married the Grand Dauphin, son of Louis XIV. She died shortly before Louis XIV, and so never became queen of France herself."}}, {"i": 19, "e": "fra", "y": "1683", "he": {"n": "פליפה החמישי", "t": "אחרי שמלך ספרד מת ללא יורשים התמנה למלך ספרד בזכות קשריו המשפחתיים. ממלכות אירופה חששו שיירש גם את צרפת ויאחד את ספרד ואיטליה למעצמה אחת, ופרצה מלחמה בת 14 שנים. בסופה ויתר רשמית על צרפת ונשאר מלך ספרד בלבד."}, "en": {"n": "Philip V", "t": "When the king of Spain died without heirs, his family ties made him king. Europe feared he would inherit France too and fuse Spain and Italy into one unbeatable power; a fourteen-year war followed. At its end he formally gave up France and remained king of Spain."}}, {"i": 20, "e": "fra", "y": "1720", "he": {"n": "פליפה דוכס פארמה", "t": "בנם של פליפה החמישי ואליזבטה פארנזה, 'אשת הברזל'. אימו השיגה לו שליטה בדוכסות פארמה שבצפון איטליה, והוא התחתן עם לואיז אליזבת הצרפתייה, שהביאה לפארמה את התרבות הצרפתית."}, "en": {"n": "Philip Duke of Parma", "t": "Son of Philip V and Elisabeth Farnese, the iron woman. His mother won him the duchy of Parma in northern Italy, and he married Louise Élisabeth of France, who brought French culture to Parma."}}, {"i": 21, "e": "aut", "y": "1751", "he": {"n": "פרננדו דוכס פארמה", "t": "מכונה הדוכס המוזר, נחשב תמהוני וחסר שאיפות פוליטיות. התחתן עם מריה אמליה, בתה של הקיסרית מריה תרזה ואחותה של מארי אנטואנט. מריה אמליה הייתה מאוהבת בנסיך אחר והתחננה לאימה לא להשיא אותה לו, אך נאלצה משיקולים פוליטיים."}, "en": {"n": "Ferdinand Duke of Parma", "t": "Called the odd duke, thought eccentric and without political ambition. He married Maria Amalia, daughter of Empress Maria Theresa and sister of Marie Antoinette. Maria Amalia loved another prince and begged her mother not to make the match, but politics decided it."}}, {"i": 22, "e": "aut", "y": "1773", "he": {"n": "לודביקו, מלך אטרוריה", "t": "אחרי המהפכה הצרפתית כבש נפוליאון את פארמה, וכדי לפצות את לודביקו 'המציא לו ממלכה' בשטחים שבין טוסקנה ופירנצה וקרא לה אטרוריה. לודביקו היה מרוצה: אף שאיבד את שטחיו, קיבל באופן רשמי את התואר מלך."}, "en": {"n": "Ludovico, king of Etruria", "t": "After the revolution Napoleon took Parma, and to compensate Ludovico he invented a kingdom for him between Tuscany and Florence and called it Etruria. Ludovico was pleased: he had lost his lands but gained the title of king."}}, {"i": 23, "e": "aut", "y": "1795", "he": {"n": "אנה דה ליו", "t": "נולדה מעט לפני נישואי אביה למריה לואיסה הספרדייה. אימה אלאנורה, בת לווייתה של סבתה מריה אמליה, גידלה אותה בווינה כאשת אצולה מכובדת אך הסתירה את ייחוסו של אביה. אנה התחתנה בגיל 16 עם היינריך פון קרנשטיין בן ה-35, שהסכים לשידוך בתמורה לנדוניה משמעותית שסיפק אביה בחשאי."}, "en": {"n": "Anna de Lieu", "t": "Born shortly before her father's marriage to Maria Luisa of Spain. Her mother Eleonora, a lady-in-waiting to her grandmother Maria Amalia, raised her in Vienna as a respectable noblewoman while hiding her father's line. At 16 Anna married Heinrich von Kernstein, 35, who accepted the match in return for a substantial dowry paid quietly by her father."}}, {"i": 24, "e": "aut", "y": "1812", "he": {"n": "ברברה פון-קרנשטיין", "t": "גדלה בפראג וחוותה מקרוב את התפוררות מעמד האצולה. בגיל 21 הכירה שם את גוסטב ויינברג, תעשיין טקסטיל מתעשר, והם עברו לליברץ, סמוך למפעלו בבוהמיה."}, "en": {"n": "Barbara von Kernstein", "t": "She grew up in Prague and watched the nobility come apart at close range. At 21 she met Gustav Weinberg, a rising textile industrialist, and they moved to Liberec, near his mill in Bohemia."}}, {"i": 25, "e": "aut", "y": "1835", "he": {"n": "קארל פון-ויינברג", "t": "בעזרת כספי אביו קנה אחוזה באזורי הכפר של בוהמיה ושינה את שמו. התחתן עם מתילדה פון-פלקנאו הגרמנייה וחי איתה חיי אצולה."}, "en": {"n": "Karl von Weinberg", "t": "With his father's money he bought an estate in the Bohemian countryside and changed his name. He married Mathilde von Falkenau and lived the life of the nobility with her."}}, {"i": 26, "e": "aut", "y": "1858", "he": {"n": "הנס ויינברג", "t": "בעקבות המשבר הגדול של 1873 בווינה הבין שהאחוזה לא תספיק ושעליו להתקיים כסוחר. חמש שנים אחר כך התחתן עם הרמינה מהאוור, בתו של סוחר שעונים ויאני, ירש את החנות והתקיים כסוחר שעונים מכובד."}, "en": {"n": "Hans Weinberg", "t": "After the crash of 1873 in Vienna he understood the estate would not be enough and that he would have to trade. Five years later he married Hermine Mahauer, daughter of a Viennese watch dealer, inherited the shop and made a respectable living in watches."}}, {"i": 27, "e": "aut", "y": "1879", "he": {"n": "אנה אדלר", "t": "גדלה בווינה של סוף המאה ה-19 והושפעה מרעיונות הקדמה והמודרנה. בבית קפה צנטרל המפואר הכירה את ד\"ר לודוויג אדלר, רופא יהודי ויאני מתבולל ומשכיל. היא המירה את דתה והתחתנה איתו."}, "en": {"n": "Anna Adler", "t": "She grew up in fin-de-siècle Vienna, taken with progress and the modern. At the grand Café Central she met Dr Ludwig Adler, an assimilated, educated Viennese Jewish physician. She converted and married him."}}, {"i": 28, "e": "aut", "y": "1900", "he": {"n": "דוד אדלר", "t": "גדל כיהודי מתבולל ולמד פסיכולוגיה בווינה ב-1920 אצל זיגמונד פרויד ואצל אלפרד אדלר, שהיה דודו מדרגה שנייה מצד אביו. הכיר בווינה את אדית רוזנברג, בת למשפחת תעשיינים יהודים."}, "en": {"n": "David Adler", "t": "Raised an assimilated Jew, he studied psychology in Vienna in 1920 under Sigmund Freud and under Alfred Adler, his father's second cousin. In Vienna he met Edith Rosenberg, of a family of Jewish industrialists."}}, {"i": 29, "e": "aut", "y": "1925", "he": {"n": "לאה אדלר", "t": "אחרי האנשלוס ב-1938 הבינו הוריה שעליהם להבריח אותה, והצליחו להעביר אותה מאוסטריה לפראג. שם נרשמה למפעל עליית הנוער של הנרייטה סאלד, עלתה לארץ ב-1939 ועברה לקיבוץ כפר סאלד. שם הכירה ב-1948 את יוזף שווייג, יהודי דובר גרמנית. סיפור האהבה נגדע כשיוזף נהרג במלחמת העצמאות, ולאה הייתה אז בהיריון."}, "en": {"n": "Lea Adler", "t": "After the Anschluss in 1938 her parents understood they had to get her out, and managed to move her from Austria to Prague. There she was enrolled in Henrietta Szold's Youth Aliyah, reached the country in 1939 and moved to kibbutz Kfar Szold. In 1948 she met Josef Schweig, a German-speaking Jew. The story ended when Josef was killed in the War of Independence; Lea was pregnant."}}, {"i": 30, "e": "aut", "y": "1949", "he": {"n": "שמעון אדלר", "t": "גדל בכפר סאלד לאם חד הורית שלא דיברה על עברה. אחרי הצבא למד הנדסת חשמל ועבר לגור בטבריה, שם הכיר את עליזה לוי, פקידת קבלה במלון."}, "en": {"n": "Shimon Adler", "t": "He grew up in Kfar Szold with a single mother who did not speak about her past. After the army he studied electrical engineering and moved to Tiberias, where he met Aliza Levy, a hotel receptionist."}}, {"i": 31, "e": "aut", "y": "1971", "he": {"n": "עידו אדלר", "t": "גדל בטבריה, עבר בגיל 22 לנהריה והיה מדריך טיולים בקרן הקיימת לישראל. שם הכיר את טליה רוזנברג."}, "en": {"n": "Ido Adler", "t": "He grew up in Tiberias, moved to Nahariya at 22 and guided hikes for the Jewish National Fund. There he met Talia Rosenberg."}}, {"i": 32, "e": "aut", "y": "1993", "he": {"n": "רון אדלר", "t": "אחרי הצבא עבר למושב בן עמי סמוך לבית הוריו, ובמקביל היה פקיד בסניף בנק הפועלים בנהריה. הכיר את נועה דסקל החיפאית במהלך לימודיו באוניברסיטת חיפה."}, "en": {"n": "Ron Adler", "t": "After the army he moved to moshav Ben Ami near his parents and worked as a clerk at the Bank Hapoalim branch in Nahariya. He met Noa Deskal of Haifa while studying at the University of Haifa."}}, {"i": 33, "e": "aut", "y": "2015", "he": {"n": "רעות אדלר", "t": "בתם של נועה דסקל-אדלר ורון אדלר. לומדת במכללת הגליל המערבי."}, "en": {"n": "Reut Adler", "t": "Daughter of Noa Deskal-Adler and Ron Adler. She studies at the Western Galilee College."}}];

לא {נבהלת|נבהל}","{סובלת|סובל} שגרה","{שומרת|שומר} סוד"]},"en":{"name":"The Legion of the Deep Prison","kick":"The old prison in Jerusalem · the twentieth legion","body":"You are placed in the legion that holds what must not get out. The Deep Prison was the first built for demons and half-demons, and it is still the largest. It is work with no glory and no audience, and whoever does it knows exactly how much rests on it.","traits":["Responsible","Unshakeable","Can bear routine","Keeps a secret"]}},{"k":"north","he":{"name":"לגיון השומרים הצפוני","kick":"כלא המלאכים בצפת","body":"{שובצת|שובצת} לצפון. הלגיון מפעיל את כלא המלאכים בצפת ושומר על הקהילה שסביבו. אבן ישנה, הרים, וקור שנכנס לעצמות - ומשמרת שנמדדת בשנים ולא בלילות.","traits":["{סבלנית|סבלן}","{נאמנה|נאמן} למקום","{ערנית|ערני}","{אוהבת|אוהב} שקט"]},"en":{"name":"The Northern Watch","kick":"The angel prison at Safed","body":"You are placed in the north. The legion runs the angel prison at Safed and guards the community around it. Old stone, mountains, and a cold that gets into the bones - and a watch measured in years rather than nights.","traits":["Patient","Loyal to a place","Alert","Likes quiet"]}},{"k":"south","he":{"name":"לגיון השומרים הדרומי","kick":"כלא המלאכים במצפה רמון","body":"{שובצת|שובצת} לדרום. הלגיון מפעיל את כלא המלאכים במצפה רמון, ולידו יושבת התיישבות המצמיחים שמאכילה את כולם. מדבר פתוח, שקט שאין בו קצה, ואופק שרואים בו כל דבר שמתקרב.","traits":["{עצמאית|עצמאי}","{עמידה|עמיד}","{רואה|רואה} רחוק","לא {מתלוננת|מתלונן}"]},"en":{"name":"The Southern Watch","kick":"The angel prison at Mitzpe Ramon","body":"You are placed in the south. The legion runs the angel prison at Mitzpe Ramon, beside the growers' settlement that feeds everyone. Open desert, a silence with no edge, and a horizon on which anything approaching can be seen.","traits":["Self-reliant","Durable","Sees far","Does not complain"]}},{"k":"east","he":{"name":"לגיון המלאכים המזרחי","kick":"צ'יאנג מאי, תאילנד","body":"{שובצת|שובצת} למזרח. הלגיון מרכז את פעילות המלאכים בכל מה שמצידו השני של העולם, ומפעיל את הכלא בצ'יאנג מאי. רחוק מהחאן, רחוק מהבית, ובעיקר - רחוק מכל מי שיכול להגיע מהר.","traits":["{עצמאית|עצמאי}","{מסתגלת|מסתגל}","{סקרנית|סקרן}","לא {זקוקה|זקוק} לאישור"]},"en":{"name":"The Eastern Legion","kick":"Chiang Mai, Thailand","body":"You are placed in the east. The legion holds together everything on the far side of the world, and runs the prison at Chiang Mai. Far from the Khan, far from home, and above all far from anyone who could arrive quickly.","traits":["Self-reliant","Adaptable","Curious","Needs no permission"]}},{"k":"west","he":{"name":"לגיון השומרים המערבי","kick":"בריסטול, אנגליה","body":"{שובצת|שובצת} למערב. הלגיון מרכז את פעילות המלאכים במערב ומפעיל את הכלא בבריסטול - שם יושב גם חאן המרפאים. גשם, ים אפור, ועיר שלא מפסיקה. מקום שבו קורים הרבה דברים בבת אחת.","traits":["{מאורגנת|מאורגן}","{מתפקדת|מתפקד} בעומס","{מגשרת|מגשר}","לא {נשברת|נשבר}"]},"en":{"name":"The Western Watch","kick":"Bristol, England","body":"You are placed in the west. The legion holds the west together and runs the prison at Bristol, where the healers' Khan also sits. Rain, a grey sea, and a city that never stops. A place where a great many things happen at once.","traits":["Organised","Works under load","Bridges","Does not break"]}},{"k":"marpeim","he":{"name":"לגיון המרפאים","kick":"ממלאכי רפאל · אבן אוניקס","body":"{שובצת|שובצת} ללגיון שנמצא בכל מקום. לכל קהילה ולכל מוסד של מלאכים יש נציג מרפאים, והמרכז שבו לומדים את התורה הזאת נמצא בבריסטול. זה לגיון של אנשים שאליהם באים - ולכן גם לגיון שקשה מאוד לצאת ממנו בסוף היום.","traits":["{נוכחת|נוכח}","{רגועה|רגוע} בחירום","{נותנת|נותן} הרבה","{נשארת|נשאר} עד הסוף"]},"en":{"name":"The Legion of Healers","kick":"Of Raphael's line · onyx","body":"You are placed in the legion that is everywhere. Every angel community and every institution has a healer representative, and the centre where the craft is learned sits in Bristol. It is a legion of people others come to - and therefore one that is very hard to walk away from at the end of a day.","traits":["Present","Calm in emergency","Gives a great deal","Stays to the end"]}},{"k":"rokchim","he":{"name":"לגיון הרוקחים","kick":"ממלאכי גבריאל · אבן ענבר","body":"{שובצת|שובצת} ללגיון של השיקויים. רוקחים מכינים את מה שמטפל בחולים, מחזק מלאכים ומגרש שדים ממקומות קדושים, ושולחים נציגים לקהילות ולבני האדם. עבודה מדויקת, שקטה, ולא סלחנית - מידה אחת לא נכונה והכול נזרק.","traits":["{מדייקת|מדייק}","{סבלנית|סבלן}","{עובדת|עובד} לבד","{אוהבת|אוהב} תהליך"]},"en":{"name":"The Legion of Apothecaries","kick":"Of Gabriel's line · amber","body":"You are placed in the legion of potions. Apothecaries brew what treats the sick, strengthens angels and drives demons from holy places, and they send representatives to the communities and to humans. Precise, quiet, unforgiving work - one measure wrong and the whole batch is thrown out.","traits":["Precise","Patient","Works alone","Loves the process"]}},{"k":"matzmichim","he":{"name":"לגיון המצמיחים","kick":"המזון הטהור · אבן תרשיש","body":"{שובצת|שובצת} ללגיון שמאכיל את כולם. בכל מדינה יש התיישבות של מצמיחים שאחראית על המזון הטהור של המלאכים באזור, ושלנו יושבת ליד הקהילה במצפה רמון. אף אחד לא מדבר על הלגיון הזה, וכל אחד תלוי בו שלוש פעמים ביום.","traits":["{עקשנית|עקשן}","{סבלנית|סבלן}","{מחוברת|מחובר} לאדמה","לא {צריכה|צריך} תשומת לב"]},"en":{"name":"The Legion of Growers","kick":"The pure food · chrysolite","body":"You are placed in the legion that feeds everyone. Every country has a growers' settlement responsible for the angels' pure food in its region; ours sits beside the community at Mitzpe Ramon. Nobody talks about this legion, and everyone depends on it three times a day.","traits":["Stubborn","Patient","Rooted","Needs no attention"]}},{"k":"mevasrim","he":{"name":"לגיון המבשרים","kick":"ממלאכי גבריאל · אבן אקוומרין","body":"{שובצת|שובצת} ללגיון שיושב בראש ההר הגבוה בכל יבשת. המבשרים מקיימים טקסים ותפילות כדי להיות קרובים לשמיים, מתחברים לקווי זמן וזרמי אירועים, וצופים מראש התנהגות שדים. זה הלגיון הבטוח ביותר וגם הדורשני ביותר - ילדיו לא לומדים בחאן, והמאתיים הראשונות של חייהם עוברות בבידוד כמעט מוחלט.","traits":["{רואה|רואה} קדימה","{מבודדת|מבודד}","{שקועה|שקוע}","לא {חיה|חי} בהווה"]},"en":{"name":"The Legion of Heralds","kick":"Of Gabriel's line · aquamarine","body":"You are placed in the legion that sits on the highest mountain of every continent. The heralds hold rites and prayers to stay close to the heavens, connect to lines of time and currents of events, and foresee the movements of demons. It is the safest legion and the most demanding - its children do not study at the Khan, and their first two centuries pass in near-total isolation.","traits":["Sees ahead","Isolated","Absorbed","Does not live in the present"]}},{"k":"safranim","he":{"name":"לגיון הספרנים","kick":"מחקר ותיעוד · אבן טופז","body":"{שובצת|שובצת} ללגיון שכותב הכול. הספרנים מתעדים את ההיסטוריה של המלאכים והשדים, את עבודת הרוקחים והרופאים, את הקמעות, כלי הנשק והמשפטים. הם לא חיים בקהילה אחת: חלקם עפים בעולם ומנסים דברים חדשים, וחלקם יושבים על הכתבים הישנים. שני הפלגים מתווכחים כל הזמן, וזה בסדר.","traits":["{מדייקת|מדייק}","{סקרנית|סקרן}","{מתווכחת|מתווכח}","{זוכרת|זוכר} הכול"]},"en":{"name":"The Legion of Librarians","kick":"Research and record · topaz","body":"You are placed in the legion that writes it all down. The librarians record the history of angels and demons, the work of the apothecaries and physicians, the amulets, the weapons and the trials. They do not live in one community: some fly the world trying new things, some sit with the old texts. The two wings argue constantly, and that is as it should be.","traits":["Precise","Curious","Argues","Remembers everything"]}},{"k":"muarim","he":{"name":"לגיון המוארים","kick":"המלאך הלבן · אבן לשם","body":"{שובצת|שובצת} ללגיון שלא נלחם. המוארים מכוונים את פני העולם האנושי לטוב - לוחשים באוזני מנהיגים, לוחמים, אמנים והוגי דעות. תפקידם במלחמה נגד השדים קריטי, והם לא יפגעו באף בריה, אדם, מלאך או שד, גם במחיר עצמם.","traits":["{משפיעה|משפיע} בשקט","{מוותרת|מוותר} על קרדיט","{עקרונית|עקרוני}","לא {פוגעת|פוגע}"]},"en":{"name":"The Legion of the Illumined","kick":"The white angel · jacinth","body":"You are placed in the legion that does not fight. The illumined turn the human world toward the good - whispering in the ears of leaders, fighters, artists and thinkers. Their part in the war against the demons is critical, and they will harm no creature, human, angel or demon, even at the cost of themselves.","traits":["Quietly influential","Gives up credit","Principled","Harms no one"]}},{"k":"mishlachot","he":{"name":"לגיון המשלחות","kick":"המאתרים · אבן ג'ספר","body":"{שובצת|שובצת} ללגיון שלא עוצר. המשלחות עפות ברחבי העולם ומאתרות ביצי מלאכים, ספרים, חפצים קדושים וטהורים - כל מה שאבד ואסור שיישאר אבוד. זה לגיון של אנשים שקשה להם במקום אחד, ושמוצאים דברים שאחרים עברו לידם.","traits":["{נודדת|נודד}","{עקשנית|עקשן}","{מוצאת|מוצא}","לא {נקשרת|נקשר} למקום"]},"en":{"name":"The Legion of Expeditions","kick":"The finders · jasper","body":"You are placed in the legion that does not stop. The expeditions fly the world locating angel eggs, books, holy and pure objects - everything lost that must not stay lost. It is a legion of people who cannot bear one place, and who find what others walked straight past.","traits":["Wanderer","Stubborn","Finds things","Does not settle"]}},{"k":"metashteshim","he":{"name":"לגיון המטשטשים","kick":"המוחקים · אבן קריסטל","body":"{שובצת|שובצת} ללגיון שאף אחד לא רואה. המטשטשים מוחקים את הסימנים והעקבות שמלאכים ושדים משאירים בעולם בני האדם. קהילה קטנה, סגורה ומבודדת, שנעה בין מוקדי עימות - ואם הם עשו את העבודה נכון, אף אחד לא ידע שהם היו שם.","traits":["{דיסקרטית|דיסקרטי}","{נעה|נע} מהר","{מנותקת|מנותק}","{מוחקת|מוחק} גם את עצמו"]},"en":{"name":"The Legion of the Blurrers","kick":"The erasers · clear crystal","body":"You are placed in the legion nobody sees. The blurrers erase the signs and traces angels and demons leave in the human world. A small, closed, isolated community that moves between flashpoints - and if they did the work well, nobody knows they were there.","traits":["Discreet","Moves fast","Detached","Erases themselves too"]}},{"k":"gashmiim","he":{"name":"לגיון הגשמיים","kick":"המגע עם בני האדם · פנינה","body":"{שובצת|שובצת} ללגיון שמדבר עם העולם. הגשמיים משלבים מלאכים במשרות מפתח, רושמים ילדים לבתי ספר, מטפלים מול עיריות ורווחה, ואם צריך - גם מול הנפילים. בלעדיהם אף מלאך לא היה יכול לחיות כאן בכלל.","traits":["{מדברת|מדבר} עם כולם","{מסתדרת|מסתדר}","{מבינה|מבין} אנשים","{פותחת|פותח} דלתות"]},"en":{"name":"The Legion of the Corporeal","kick":"Contact with humans · pearl","body":"You are placed in the legion that talks to the world. The corporeal place angels in key positions, enrol children in schools, handle municipalities and welfare offices, and when necessary the Nephilim as well. Without them no angel could live here at all.","traits":["Talks to anyone","Gets things done","Reads people","Opens doors"]}},{"k":"otzar","he":{"name":"לגיון האוצר","kick":"הכסף שמחזיק הכול · יהלום","body":"{שובצת|שובצת} ללגיון שאף אחד לא חושב עליו עד שנגמר. האוצר מנהל את הכסף וההשקעות שמאפשרים לקהילות המלאכים להתקיים בעולם בני האדם, ועובד ברציפות מול הגשמיים. עבודה של מאה שנה קדימה, לא של חודש.","traits":["{חושבת|חושב} רחוק","{זהירה|זהיר}","{מדייקת|מדייק}","{נושאת|נושא} באחריות"]},"en":{"name":"The Legion of the Treasury","kick":"The money that holds it up · diamond","body":"You are placed in the legion nobody thinks about until it runs out. The treasury manages the money and investments that let the angel communities exist inside the human world, working continuously with the corporeal. Work measured in a hundred years, not a month.","traits":["Thinks far ahead","Careful","Precise","Carries the weight"]}},{"k":"arbaa","he":{"name":"לגיון הארבעה","kick":"נדיר · שלושה לוחמים וראש מלאכי ישראל","body":"לא {שובצת|שובצת}. {נבחרת|נבחרת}. לגיון הארבעה בנוי מראש לגיון מלאכי ישראל ומשלושה לוחמים, אחד מכל שושלת מלאכי עליון, והם החזקים שיש. מי שמקבל{ת|} את התפקיד נשאר{ת|} בו עד מותו או עד ששחררו אותו ממנו. לכל אחד מהשלושה יש חניך שמוכן להחליף אותו - וזה אומר בדיוק מה שזה נשמע.","traits":["נדיר","{החזקה|החזק} שיש","{נבחרת|נבחר}","עד הסוף"]},"en":{"name":"The Legion of the Four","kick":"Rare · three warriors and the head of the angels of Israel","body":"You were not placed. You were chosen. The Legion of the Four is built from the head of the angels of Israel and three warriors, one from each archangel line, and they are the strongest there are. Whoever takes the post holds it until death or until they are released from it. Each of the three has a trainee ready to replace them - which means exactly what it sounds like.","traits":["Rare","The strongest there is","Chosen","To the end"]}},{"k":"tevel","he":{"name":"לגיון התבל","kick":"נדיר · שלושת ראשי האזורים","body":"לא {שובצת|שובצת}. {הגעת|הגעת}. לגיון התבל מורכב משלושת ראשי לגיונות האזור - מלאכי ישראל, מלאכי המערב ומלאכי המזרח. המערב יושב בבריסטול, המזרח בצ'יאנג מאי, ובאמצע, איפשהו, ירושלים. שלושה מלאכים שמחזיקים ביניהם את כל העולם.","traits":["נדיר","{רואה|רואה} את התמונה כולה","{מנהיגה|מנהיג}","{מחזיקה|מחזיק} עולם"]},"en":{"name":"The World Legion","kick":"Rare · the three regional heads","body":"You were not placed. You arrived. The World Legion is made of the three regional heads - the angels of Israel, of the West and of the East. The West sits in Bristol, the East in Chiang Mai, and somewhere in the middle, Jerusalem. Three angels who hold the whole world between them.","traits":["Rare","Sees the whole picture","Leads","Holds a world"]}},{"k":"moatza","he":{"name":"המועצה","kick":"נדיר · שמונה עשר נציגים וארבעים קהילות","body":"לא {שובצת|שובצת}. {קיבלת|קיבלת} כיסא. המועצה מורכבת מנציג אחד מכל לגיון ומארבעים נציגים של קהילות המלאכים בעולם, ובראשה עומדות מלאכיות העליון. הרבה מהמקומות עוברים בירושה בין משפחות מלאכים במשך דורות. לכל נציג יש קמע מאבן אודם, וכשצריך לזמן את המועצה - האבן היא שקוראת.","traits":["נדיר","{נציגה|נציג}","{מקשיבה|מקשיב}","אבן אודם"]},"en":{"name":"The Council","kick":"Rare · eighteen representatives and forty communities","body":"You were not placed. You were given a seat. The Council is made of one representative from every legion and forty from the angel communities of the world, headed by the archangels themselves. Many of the seats pass by inheritance between angel families across generations. Every representative carries a ruby amulet, and when the Council must be summoned, it is the stone that calls.","traits":["Rare","Representative","Listens","Ruby"]}}],"lines":{"mika":{"hayalim":2,"arbaa":1},"gabi":{"mevasrim":2,"rokchim":2},"rif":{"marpeim":3},"or":{"metashteshim":1,"mishlachot":1}}};
const QUIZZES = {"angels": {"art": "gal", "he": {"t": "לאיזו מלאכית את שייכת", "tm": "לאיזו שושלת מלאכים אתה שייך", "l": "ארבע אחיות, ארבעה מלאכים ראשיים, ארבע דרכים להיות בעולם. שתים עשרה שאלות."}, "en": {"t": "Which archangel line are you", "tm": "Which archangel line are you", "l": "Four sisters, four archangels, four ways of being in the world. Twelve questions."}, "results": [{"k": "mika", "img": "ang_brown", "he": {"f": {"name": "מיקה", "kick": "מלאכית העליון מיכאל", "body": "את מחליטה ואז זזים. מיקה מובילה את לגיון החיילים, והכוח שלה הוא לא הכי חזקה בחדר אלא הכי ברורה בו: היא יודעת מה צריך לקרות, ואנשים הולכים אחריה בלי שביקשה. מהירה, אמיצה, ומחוברת למטרה עד הסוף.", "traits": ["מנהיגה", "מהירה", "אמיצה", "מחליטה מהר", "מחויבת למטרה"]}, "m": {"name": "שושלת מיכאל", "kick": "מלאכי מיכאל · לגיון החיילים", "body": "אתה מחליט ואז זזים. שושלת מיכאל היא שושלת הלוחמים, וכוחה הוא לא להיות החזקה בחדר אלא הברורה בו: לדעת מה צריך לקרות, ושאנשים ילכו אחריך בלי שביקשת. מהיר, אמיץ, ומחובר למטרה עד הסוף.", "traits": ["מנהיג", "מהיר", "אמיץ", "מחליט מהר", "מחויב למטרה"]}}, "en": {"name": "The line of Michael", "kick": "Mika · the soldiers' legion", "body": "You decide, and then things move. Michael's line is the line of soldiers, and its power is not being the strongest in the room but the clearest in it: knowing what has to happen, and having people follow without being asked.", "traits": ["Leader", "Fast", "Brave", "Decides quickly", "Committed to the goal"]}}, {"k": "gabi", "img": "ang_red", "he": {"f": {"name": "גבי", "kick": "מלאכית העליון גבריאל", "body": "גבי מחזיקה את מאזני הצדק, ואת מרגישה בפנים מה נכון לפני שמישהו הספיק להסביר לך. את מזהה כל שקר, אין לך סבלנות לבולשיט, והכעס שלך מגיע מהר, בוער, ועובר. מאותו מקום בדיוק יוצאות גם השירה והציור: הקול שלך יכול להרוס ולבנות.", "traits": ["חדת צדק", "מזהה שקרים", "פתיל קצר", "יוצרת", "שולטת בזמן"]}, "m": {"name": "שושלת גבריאל", "kick": "מלאכי גבריאל · מאזני הצדק", "body": "שושלת גבריאל מחזיקה את מאזני הצדק, ואתה מרגיש בפנים מה נכון לפני שמישהו הספיק להסביר לך. אתה מזהה כל שקר, אין לך סבלנות לבולשיט, והכעס שלך מגיע מהר, בוער, ועובר. מאותו מקום בדיוק יוצאים גם השירה והציור: הקול שלך יכול להרוס ולבנות.", "traits": ["חד צדק", "מזהה שקרים", "פתיל קצר", "יוצר", "שולט בזמן"]}}, "en": {"name": "The line of Gabriel", "kick": "Gabi · the scales of justice", "body": "Gabriel's line holds the scales of justice: you feel what is right before anyone has explained it to you. You catch every lie, you have no patience for nonsense, and your anger arrives fast, burns and passes. The same place gives you song and painting - your voice can tear down and build.", "traits": ["Sharp sense of justice", "Detects lies", "Short fuse", "A maker", "Commands time"]}}, {"k": "rif", "img": "ang_bob", "he": {"f": {"name": "ריף", "kick": "מלאכית העליון רפאל", "body": "את זו שאליה באים כשקשה. ריף מרפאת גוף ונפש, שומרת על הנשמות האבודות, ויודעת לעמוד עם מישהו ברגע שבו הוא נפרד ממי שאהב. מלאת חמלה, ובידיים שלך נאצרות התרופות, הסגולות והתפילות.", "traits": ["מרפאה", "מלאת חמלה", "נשארת עד הסוף", "שומרת על האבודים"]}, "m": {"name": "שושלת רפאל", "kick": "מלאכי רפאל · לגיון המרפאים", "body": "אתה זה שאליו באים כשקשה. שושלת רפאל מרפאת גוף ונפש, שומרת על הנשמות האבודות, ויודעת לעמוד עם מישהו ברגע שבו הוא נפרד ממי שאהב. מלא חמלה, ובידיים שלך נאצרות התרופות, הסגולות והתפילות.", "traits": ["מרפא", "מלא חמלה", "נשאר עד הסוף", "שומר על האבודים"]}}, "en": {"name": "The line of Raphael", "kick": "Riff · the healers' legion", "body": "You are the one people come to when it hurts. Raphael's line heals body and mind, watches over lost souls, and knows how to stand beside someone at the moment of parting. Full of compassion, and keeper of the medicines, the remedies and the prayers.", "traits": ["A healer", "Full of compassion", "Stays to the end", "Guards the lost"]}}, {"k": "or", "img": "ang_white", "he": {"f": {"name": "אור", "kick": "מלאכית העליון אוריאל", "body": "את שולטת באיתני הטבע ומחוברת לחיות עד כדי הבנת שפתן, ודווקא בין בנ
