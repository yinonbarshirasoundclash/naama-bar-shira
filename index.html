<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="נעמה בר שירה - סופרת פנטזיה ישראלית זוכת פרס גפן. תשעה ספרים: מלאכיות עליון, מלאכיות בשערי השחר, בין השמשות ואיזבלה מלכת ירושלים.">
<meta name="theme-color" content="#04050A">
<meta property="og:type" content="website">
<meta property="og:site_name" content="נעמה בר שירה · מלאכיות עליון">
<meta property="og:title" content="נעמה בר שירה - מלאכים ושדים, ממש כאן">
<meta property="og:description" content="פנטזיה ישראלית שמתרחשת במקומות שאתם מכירים. תשעה ספרים, ארבעה פרסים.">

<title>נעמה בר שירה · מלאכיות עליון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;500;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Assistant:wght@300;400;600;700&display=swap">

<style>
/* ============ TOKENS - dark-first: the twilight hour is the native state ============ */
:root{
  --ink:#04050A; --ink-2:#0A0C16; --ink-3:#131624;
  --gold:#C9A356; --gold-soft:#E4C889; --ember:#D9663E;
  --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3);
  --text:#EAE3D6; --text-dim:#B6AF9F; --muted:#8A8474;
  --line:rgba(201,163,86,.20); --line-strong:rgba(201,163,86,.42);
  --glow:rgba(201,163,86,.10);
  --sky-top:#020307; --sky-mid:#0E0B26; --sky-low:#2E1B34; --sky-horizon:#7E4029; --city:#010204;
  --shadow:0 24px 60px -28px rgba(0,0,0,.85);
  --cover-a:#1B1440; --cover-b:#05070F; --cover-c:#3B2340;
  --cover-text:#F1E8D7; --cover-label:#E4C889; --cover-line:rgba(201,163,86,.38);

  --f-display:"Frank Ruhl Libre",'Times New Roman',serif;
  --f-display-lat:"Cormorant Garamond",'Times New Roman',serif;
  --f-body:"Assistant",'Segoe UI',system-ui,sans-serif;

  --measure:66ch; --pad:clamp(1.1rem,4vw,2.6rem);
  --rhythm:clamp(3.2rem,8vw,6.5rem);
}
*,*::before,*::after{box-sizing:border-box}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); font-weight:300; font-size:clamp(1rem,.55vw + .9rem,1.09rem);
  line-height:1.72; -webkit-font-smoothing:antialiased;
}
[dir="ltr"] body{font-family:var(--f-body)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ TYPE ============ */
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.16;text-wrap:balance;margin:0}
[dir="ltr"] h1,[dir="ltr"] h2,[dir="ltr"] h3,[dir="ltr"] .serif-lat{font-family:var(--f-display-lat);font-weight:400}
h1{font-size:clamp(2.4rem,6.2vw,4.6rem);font-weight:900;letter-spacing:-.015em}
h2{font-size:clamp(1.75rem,3.6vw,2.8rem)}
h3{font-size:clamp(1.15rem,1.8vw,1.42rem);font-weight:700}
p{margin:0}
.eyebrow{
  font-family:var(--f-body);font-size:.72rem;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--gold);display:block;
}
[dir="rtl"] .eyebrow{letter-spacing:.14em}
.lede{font-size:clamp(1.06rem,1.4vw,1.28rem);color:var(--text-dim);line-height:1.66;max-width:var(--measure)}
.dim{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ============ SHELL ============ */
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--pad)}
.narrow{max-width:760px}
.stack{display:flex;flex-direction:column}
.g-xs{gap:.5rem}.g-s{gap:.9rem}.g-m{gap:1.6rem}.g-l{gap:2.6rem}.g-xl{gap:clamp(3rem,6vw,5rem)}
section.band{padding-block:var(--rhythm)}
.rule{height:1px;background:linear-gradient(to var(--to,right),transparent,var(--line-strong),transparent);border:0;margin:0}

/* ============ NAV ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(14px) saturate(1.2);
  background:color-mix(in oklab,var(--bg) 84%,transparent);
  border-block-end:1px solid var(--line);
}
.topbar-in{display:flex;align-items:center;gap:.65rem;min-height:66px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-inline-end:auto;text-align:start}
.brand b{font-family:var(--f-display);font-size:1.16rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
[dir="ltr"] .brand b{font-family:var(--f-display-lat);font-weight:600}
.brand span{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.nav{display:flex;gap:.05rem;flex-wrap:nowrap}
.nav button{
  padding:.42rem .56rem;font-size:.83rem;color:var(--text-dim);border-radius:2px;
  position:relative;transition:color .2s;white-space:nowrap;
}
[dir="ltr"] .nav button{padding-inline:.45rem}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{color:var(--gold-soft)}
.nav button[aria-current="page"]::after{
  content:"";position:absolute;inset-inline:.56rem;bottom:.12rem;height:1px;background:var(--gold);
}
.tools{display:flex;align-items:center;gap:.4rem}
.chip{
  border:1px solid var(--line-strong);border-radius:999px;padding:.3rem .72rem;
  font-size:.75rem;letter-spacing:.06em;color:var(--text-dim);transition:.2s;
}
.chip:hover{color:var(--gold-soft);border-color:var(--gold)}
.chip b{font-weight:700;color:var(--gold-soft)}
.navtoggle.chip{display:none}  /* .chip sets inline-flex later in the sheet - keep this rule stronger */
/* The nav collapses when the labels stop fitting on one line, not at a fixed
   width - the Hebrew and English label sets are different lengths. fitNav()
   measures the bar and sets body[data-nav="compact"]. */
body[data-nav="compact"] .navtoggle.chip{display:inline-flex;font-size:1.15rem;line-height:1;padding:.28rem .55rem}
body[data-nav="compact"] .nav{
  position:fixed;inset-block-start:66px;inset-inline:0;background:var(--surface);
  border-block-end:1px solid var(--line);flex-direction:column;gap:0;padding:.5rem var(--pad) 1.1rem;
  display:none;
}
body[data-nav="compact"] .nav[data-open="true"]{display:flex}
body[data-nav="compact"] .nav button{padding:.66rem .2rem;font-size:1rem;text-align:start;border-block-end:1px solid var(--line)}
body[data-nav="compact"] .nav button[aria-current="page"]::after{display:none}

/* ============ THE GATE - arch motif drawn from her titles ============ */
.gate{position:relative;display:grid;place-items:center;isolation:isolate}
.gate-svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.arch{
  --w:min(88vw,620px);
  width:var(--w);aspect-ratio:3/4.1;
  border-start-start-radius:var(--w);border-start-end-radius:var(--w);
  border:1px solid var(--line-strong);
  background:linear-gradient(to bottom,var(--sky-top),var(--sky-mid) 42%,var(--sky-low) 76%,var(--sky-horizon));
  position:relative;overflow:hidden;
}
.arch::after{
  content:"";position:absolute;inset:8px;
  border-start-start-radius:var(--w);border-start-end-radius:var(--w);
  border:1px solid var(--glow);
}

/* ============ HERO ============ */
.hero{position:relative;min-height:min(78vh,700px);display:grid;align-items:center;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,transparent 62%,color-mix(in oklab,var(--bg) 88%,transparent) 92%,var(--bg));
}
.hero-in{position:relative;z-index:2;padding-block:clamp(4rem,11vw,8rem)}
.hero h1{margin-block:.6rem .1rem}
.hero .lede{margin-block-start:1.3rem}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-block-start:2rem}
.badge{
  display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.04em;
  border:1px solid var(--line-strong);padding:.4rem .8rem;border-radius:999px;
  background:color-mix(in oklab,var(--surface) 70%,transparent);color:var(--text-dim);
}
.badge b{color:var(--gold-soft);font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:.7rem;margin-block-start:2.2rem}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.55rem;padding:.72rem 1.5rem;
  border:1px solid var(--gold);color:var(--gold-soft);font-size:.9rem;font-weight:600;
  letter-spacing:.05em;border-radius:2px;transition:.22s;background:transparent;
}
.btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn-solid{background:var(--gold);color:#0B0F1C;border-color:var(--gold)}
.btn-solid:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:#0B0F1C}
.btn-quiet{border-color:var(--line-strong);color:var(--text-dim)}
.btn-quiet:hover{background:transparent;color:var(--gold-soft);border-color:var(--gold)}
.btn-sm{padding:.46rem 1rem;font-size:.8rem}

/* ============ CARDS / GRIDS ============ */
.grid{display:grid;gap:1.4rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gworlds{grid-template-columns:1fr;gap:1.6rem}
@media (min-width:880px){.gworlds{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{
  border:1px solid var(--line);background:color-mix(in oklab,var(--surface) 86%,transparent);padding:1.5rem;
  display:flex;flex-direction:column;gap:.75rem;transition:.25s;position:relative;
}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px)}

/* Book cover placeholder - becomes a real <img> by swapping the inner element */
.cover{
  aspect-ratio:2/3;position:relative;overflow:hidden;
  border:1px solid var(--cover-line);
  background:linear-gradient(155deg,var(--cover-a),var(--cover-b) 55%,var(--cover-c));
  display:grid;place-items:center;padding:1.1rem;text-align:center;
}
.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cover .ct{
  display:block;font-family:var(--f-display);font-weight:700;
  font-size:clamp(.78rem,1.5vw,1rem);line-height:1.32;
  color:var(--cover-text);text-shadow:0 2px 14px rgba(0,0,0,.65);
}
.cover .cs{
  display:block;font-size:.6rem;letter-spacing:.16em;line-height:1.5;
  text-transform:uppercase;color:var(--cover-label);margin-block-end:.55rem;
  padding-block-end:.5rem;border-block-end:1px solid var(--cover-line);
}
.cover::after{content:"";position:absolute;inset:6px;border:1px solid var(--cover-line);pointer-events:none}
.cover.mini{padding:0}
.cover.mini .cs,.cover.mini .ct,.cover.mini .cover-flag{display:none}
.cover.has-img{padding:0;background:var(--cover-b)}
.cover.has-img::after{display:none}
.cover.has-img.mini::before{display:none}
.cover.mini::before{
  content:"";position:absolute;inset:22% 26%;border:1px solid var(--cover-line);
  border-start-start-radius:99px;border-start-end-radius:99px;
}
.cover-flag{
  position:absolute;inset-block-start:0;inset-inline-start:0;z-index:2;
  background:var(--gold);color:var(--cover-b);font-size:.64rem;font-weight:700;
  letter-spacing:.1em;padding:.28rem .6rem;
}

.book{display:flex;flex-direction:column;gap:.7rem;height:100%}
.book > .btn{margin-block-start:auto}
.book .meta{display:flex;flex-direction:column;gap:.2rem}
.book h3{font-size:1.02rem;line-height:1.3}
.price{display:flex;align-items:baseline;gap:.5rem;font-variant-numeric:tabular-nums}
.price .now{color:var(--gold-soft);font-weight:700;font-size:1.05rem}
.price .was{color:var(--muted);text-decoration:line-through;font-size:.84rem}

/* ============ WORLD PANELS ============ */
.world{
  border:1px solid var(--line);background:
    linear-gradient(to bottom,color-mix(in oklab,var(--surface) 92%,transparent),var(--surface));
  padding:clamp(1.4rem,3vw,2.4rem);display:flex;flex-direction:column;gap:1rem;
  position:relative;overflow:hidden;
}
.world::before{
  content:"";position:absolute;inset-block-start:-40%;inset-inline-end:-18%;
  width:60%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 68%);pointer-events:none;
}
.world .wnum{
  font-family:var(--f-display-lat);font-size:.8rem;letter-spacing:.24em;color:var(--gold);
}
.taglist{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{font-size:.72rem;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);padding:.22rem .55rem;border-radius:999px}

/* a link whose URL has not been supplied yet reads as unavailable, not broken */
.is-pending{opacity:.42;cursor:default;pointer-events:none}

/* ============ GALLERY ============ */
.gal{display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.gal{grid-template-columns:repeat(4,1fr)}}
.plate{
  position:relative;overflow:hidden;border:1px solid var(--cover-line);
  background:var(--cover-b);aspect-ratio:47/66;cursor:zoom-in;display:block;width:100%;
  border-start-start-radius:60% 22%;border-start-end-radius:60% 22%;
}
.plate img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.plate:hover img{transform:scale(1.045)}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(201,163,86,.30);
  border-start-start-radius:60% 22%;border-start-end-radius:60% 22%;
}
.plate .cap{
  position:absolute;inset-inline:0;inset-block-end:0;padding:1.5rem .7rem .75rem;
  background:linear-gradient(to top,rgba(4,6,12,.93),rgba(4,6,12,.6) 55%,transparent);
  display:flex;flex-direction:column;gap:.1rem;text-align:center;
}
.plate .cap b{
  font-family:var(--f-display);font-size:1.08rem;font-weight:700;color:#F3EAD9;letter-spacing:.01em;
}
[dir="ltr"] .plate .cap b{font-family:var(--f-display-lat);font-weight:600}
.plate .cap span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}

/* ============ INTERNATIONAL ============ */
.intl{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-block-start:.4rem}
.intlcard{margin:0;display:flex;flex-direction:column;gap:.75rem}
.intlimg{
  display:block;width:100%;aspect-ratio:4/3;overflow:hidden;padding:0;
  border:1px solid var(--line-strong);background:var(--cover-b);cursor:zoom-in;
}
.intlimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.intlimg:hover img{transform:scale(1.05)}
.intlcard figcaption{display:flex;flex-direction:column;gap:.2rem}
.intlcard b{font-family:var(--f-display-lat);font-weight:600;font-size:1rem;color:var(--gold-soft)}
.intlcard span{font-size:.86rem;color:var(--text-dim);line-height:1.55}

/* ============ PAGE HERO ============ */
.phero{
  position:relative;isolation:isolate;overflow:hidden;
  display:grid;align-items:end;
  min-height:clamp(15rem,30vw,23rem);
  padding-block:clamp(3rem,7vw,5rem) clamp(1.6rem,4vw,2.6rem);
  border-block-end:1px solid var(--line);
}
.phero-img{
  position:absolute;inset:0;z-index:-2;
  background-size:cover;background-position:var(--pos,center 40%);
  filter:saturate(.7) contrast(1.05);
  opacity:var(--op,.42);
}
.phero::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(to bottom,color-mix(in oklab,var(--bg) 72%,transparent),color-mix(in oklab,var(--bg) 30%,transparent) 38%,color-mix(in oklab,var(--bg) 88%,transparent) 78%,var(--bg)),
    linear-gradient(to var(--edge,left),transparent 45%,color-mix(in oklab,var(--bg) 70%,transparent));
}
[dir="rtl"] .phero::after{--edge:right}
.phero-in{position:relative;z-index:1}
.phero .lede{color:var(--text)}
.phero + .band{padding-block-start:clamp(2.4rem,5vw,3.4rem)}

/* ============ FIELD GALLERY ============ */
.tabn{font-size:.72rem;opacity:.65;font-variant-numeric:tabular-nums}
.fgrid{
  columns:2 190px;column-gap:.7rem;
}
@media (min-width:760px){.fgrid{columns:3 230px}}
@media (min-width:1080px){.fgrid{columns:4 230px}}
.fcell{
  position:relative;overflow:hidden;padding:0;display:block;width:100%;
  border:1px solid var(--line);background:var(--cover-b);cursor:zoom-in;
  break-inside:avoid;margin-block-end:.7rem;
}
.fcell img{width:100%;height:auto;display:block;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.fcell:hover img{transform:scale(1.04)}
.fcell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(201,163,86,.16);pointer-events:none}
.fcap{
  position:absolute;inset-inline:0;inset-block-end:0;padding:1.6rem .7rem .6rem;
  background:linear-gradient(to top,rgba(4,6,12,.9),transparent);
  color:#EFE6D5;font-size:.78rem;line-height:1.35;text-align:start;
  opacity:0;transform:translateY(6px);transition:.28s;
}
.fcell:hover .fcap,.fcell:focus-visible .fcap{opacity:1;transform:none}
@media (hover:none){.fcap{opacity:1;transform:none}}

.fview{margin:0;display:flex;flex-direction:column;gap:1rem;align-items:center}
.fview img{max-width:100%;max-height:72vh;object-fit:contain;border:1px solid var(--line-strong)}
.fview figcaption{display:flex;flex-direction:column;gap:.3rem;align-items:center;text-align:center}
.fview figcaption b{font-family:var(--f-display);font-size:1.15rem}
[dir="ltr"] .fview figcaption b{font-family:var(--f-display-lat);font-weight:600}
.fnav{display:flex;align-items:center;gap:1.2rem;margin-block-start:.5rem}
.fnav button{
  width:2.2rem;height:2.2rem;border:1px solid var(--line-strong);border-radius:999px;
  color:var(--gold-soft);font-size:1.3rem;line-height:1;display:grid;place-items:center;transition:.2s;
}
.fnav button:hover{border-color:var(--gold);background:var(--glow)}

/* ============ BRAND MARKS ============ */
.chip svg,.btn svg,.socialmark svg{
  width:1em;height:1em;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.chip{display:inline-flex;align-items:center;gap:.42rem}
.socialmark{display:grid;place-items:center;width:2rem;height:2rem;color:var(--gold-soft)}
.socialmark svg{width:1.35rem;height:1.35rem;stroke-width:1.5}

/* ============ SOCIAL CARDS ============ */
.socialgrid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.socialcard{
  display:flex;flex-direction:column;gap:.2rem;text-decoration:none;
  border:1px solid var(--line-strong);padding:1.1rem 1.3rem;transition:.22s;
  background:color-mix(in oklab,var(--surface) 70%,transparent);
}
.socialcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.socialcard b{font-family:var(--f-display);font-size:1.08rem;color:var(--gold-soft)}
[dir="ltr"] .socialcard b{font-family:var(--f-display-lat);font-weight:600}
.socialcard span{font-size:.84rem;color:var(--muted)}

/* ============ BOOK PANEL ============ */
.lb-book{align-items:start;overflow-y:auto}
.lb-panel{
  position:relative;width:min(96vw,880px);margin-block:auto;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  padding:clamp(1.4rem,4vw,2.8rem);
}
.lb-close{
  position:absolute;inset-block-start:.7rem;inset-inline-end:.7rem;z-index:2;
  border:1px solid var(--line-strong);border-radius:999px;width:2rem;height:2rem;
  display:grid;place-items:center;color:var(--text-dim);
}
.lb-close:hover{color:var(--gold-soft);border-color:var(--gold)}
.bookwrap{display:grid;gap:clamp(1.4rem,4vw,2.6rem);grid-template-columns:1fr;align-items:start}
@media (min-width:720px){.bookwrap{grid-template-columns:230px 1fr}}
.bookaside{max-width:230px}
.bookbuy{
  display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;
  margin-block-start:1.2rem;padding-block-start:1.2rem;border-block-start:1px solid var(--line);
}

maayan:{he:[
"כשתקיפה בלתי צפויה חושפת בפני האחיות מיקה, גבי ואור את סודות שורשיהן הסבוכים, הן הופכות מנערות למלאכיות ומבינות שהן ניצבות מול ייעודן בעולם מסוכן ומופלא שאינן מכירות.",
"קהילת המלאכים הסודית בחאן בירושלים מקבלת אותן אל חיקה ומוכנה לספק להן הגנה. אור, שתמיד הרגישה שונה, מקווה ששם סוף־סוף תרגיש שייכת. מיקה לא מעוניינת לעזוב את עולמה - טוב לה בחייה כפי שהם והיא אוהבת את חבריה. ואילו גבי מאוהבת בחבר שלה ולא רוצה לוותר עליו, גם כאשר כנפיים ענקיות מתפרצות מגבה כל פעם שהיא מנסה לנשק אותו.",
"האם האחיות יצליחו להציל מלאכים שנחטפו, לגבור על הסדקים המעמיקים ביחסיהן וללמוד את תפקידן לפני שיותקפו בידי השדים?",
"היכנסו לעולם הנסתר של המלאכים בירושלים, בספר פנטזיה גדוש הרפתקאות, רומנטיקה ושבעה מדורים של שאול."]},

shaar:{q:"הירח בהק דרך החלון, אור לא הצליחה להפסיק לבהות בו. משהו זר חי בגופה, היא הרגישה אותו גדל, ראתה את דמותו בין העננים, בצללים בפינות הרחוב, בפנים של כל מי שהסתכל עליה.",
he:[
"סערה מתחוללת בנפשה של אור. קול מתגבר בתוכה, משתלט עליה, ולמרות שהייתה רוצה להסתיר את זה מהסובבים אותה - הם מתחילים להיפגע. המלאכים חייבים להפריד בינה ובין השדה שכבשה את ליבה, גם אם בכוח.",
"אור נאלצת לרדת אל מעמקי השאול כדי להציל לא רק את עצמה, אלא גם את כל מי שהיא אוהבת. בעוד היא מנווטת בעולם הבוגדני של מטה, אחיותיה צוללות לעולמות המטושטשים של חצאי השדים שחיים על הקו בין תל אביב לירושלים, כשגורל השמיים והאדמה מונח על הכף.",
"גבי, מיקה וריף חייבות למצוא דרך לשתף פעולה ולהציל את נפשה של אור לפני שיהיה מאוחר מדי. אך השבר ביניהן הולך וגובר, מאיים לקרוע אותן. הגבולות בין טוב ורע אינם ברורים כפי שחשבו פעם."]},

shimemet:{q:"״את בהחלט מהווה איום,״ אמר לה לוקי, בוחן אותה בעיני האזמרגד שלו. ״אבל אני לא אגלה. לוסי, מתי תביני שאנחנו באותו צד? את שלי.״",
he:[
"אור הפכה ללוסיאל. השאול הוא כבר חלק ממנה והיא לא זוכרת דבר ממי שהייתה. בעולם האכזרי של מטה היא חייבת לחזק את כוחה ואחיזתה בין השדים, אך לכוח יש מחיר.",
"גבי וריף יורדות לשאול כדי להציל את אחותן, מלוות בבנות לילית, חצאי שדים וסוקובוסית אחת שמוכנה לעשות הכול כדי להציל את אהובת ליבה. מיקה מוצאת את עצמה כלואה ביער הפיות בביריה, וכדי להנהיג את המלאכים היא צריכה להילחם בכל מה שהיא עצמה האמינה בו.",
"הספר השלישי והאחרון בטרילוגיה, ובו העולמות של מעלה ומטה מתכנסים להתנגשות חזיתית. מלאכים, שדים ובני לילית בקרבות מכריעים במעמקי השאול, שדי נזימבי צועדים ברחובות ירושלים, ומעל - בשממת העדן - נחשפים סודות שלא ידענו על קיומם."]},

ben:{he:[
"שחר מתעורר למציאות שלא הכיר. הוא לא רק בן של מלאכית־עליון. הוא לא רק נער שגדל בין עצי יער הפיות בצפון. הוא משהו אחר לגמרי. משהו מסוכן.",
"כשהוא מגלה את סודו האפל ובורח אל עולם זר, שחר נאלץ לגלות את זהותו מחדש ולחשוף את הסודות שאימו ואחיותיה הסתירו ממנו כל חייו. בעודו נרדף, כוחות הרסניים מתקרבים אליו - רוקה, שפחתו הקטלנית של אבדון, נשלחת למשימה שאין ממנה דרך חזרה.",
"באותה עת ארבע האחיות - אור, גבי, מיקה וריף - מתמודדות עם סדקים הולכים ומתרחבים: בגידות, אהבות אסורות, אימהוּת מורכבת ולבטים קיומיים שמאיימים לפרק את הברית ביניהן.",
"שבע־עשרה שנה לאחר סיום ״מלאכיות עליון״ מתחיל פרק חדש. מהו מקומו של שחר בתוכנית הגדולה? האם האחיות יתאחדו או יקרסו תחת נטל העבר? והאם באמת אפשר לברוח מגורל שנכתב בשמיים ובשאול גם יחד?"]},

tzava:{he:[
"שחר, בנה של אור מלאכית העליון ולוקיאנתרו מלך השאול, מגיע אל החאן במטרה לממש את ייעודו. תחת עינה הפקוחה של מיקה הוא ניצב מול האתגרים הקשים ביותר: עליו ללמוד על הצד המלאכי שבו, בעוד שד צמא לדם חי בתוכו. האם יהיה המגן של האנושות, או הנשק שיחריב אותה?",
"בעוד שחר צועד על החבל הדק שבין אור לחושך, החאן כולו ניצב בפני מבחן. מיקה נאבקת לשמור על סדר בעולם קורס, בזמן שאור מתמסרת לכס המלכות של השאול. הכתר כבד, והטראומות מהעבר מאיימות להצית מלחמה בין האחיות שתשרוף את השמיים ואת התהומות גם יחד.",
"מנקמה שבוערת בתאי המאסר ועד לצבאות הנפילים הצועדים לירושלים - מסע עוצר נשימה של הקרבה וגילוי עצמי. במקום שבו הגבול בין מלאך לשד מיטשטש, רק דבר אחד בטוח: בדרך אל יום הדין, הקשר החזק ביותר אינו נכתב בדם, אלא בבחירה."]},

zohar:{he:[
"זהר, נצר למשפחה מלאכית עתיקה ורבת עוצמה, תמיד ידעה שנועדה להיות רוקחת. היא התאמנה לכך כל חייה והוכיחה שהיא הטובה ביותר. עם סיום חאן המלאכים ציפתה להמשיך ללגיון הרוקחים, אך ראש לגיון הכלא העמוק, צדקיאל, זיהה את היכולות הטמונות בה ודרש להחזיק בה תחת שליטתו.",
"כך מוצאת זהר את דרכה אל הכלא הקבור עמוק מתחת לאדמה, מוקפת במאות שדים כלואים, ושוקעת בשגרה שכוללת עבודות מטבח, סיורים ושמירות. בהחלט לא העתיד שעליו חלמה. עד שברגע אחד גורלי נסחפים צדקיאל וזהר למשימה שתשנה את חייה מעבר לכל דמיון.",

let lang = "he", view = "home", cart = {}, signed = false;
const t = () => T[lang];
const L = o => o[lang];
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const VIEWS = ["home","author","worlds","books","gallery","field","reviews","shop","events","speaking","community","rights"];
function go(v){ view=v; document.getElementById("nav").dataset.open="false"; render(); window.scrollTo({top:0,behavior:"instant"}); }
function fitNav(){
  const bar=document.querySelector(".topbar-in"), nav=document.getElementById("nav");
  document.body.removeAttribute("data-nav");     /* measure the row at full size */
  nav.dataset.open="false";
  if(bar.scrollWidth > bar.clientWidth+1) document.body.setAttribute("data-nav","compact");
}
let fitRAF=0;
addEventListener("resize",()=>{ cancelAnimationFrame(fitRAF); fitRAF=requestAnimationFrame(fitNav); });
function toggleNav(){ const n=document.getElementById("nav"); n.dataset.open = n.dataset.open==="true" ? "false" : "true"; }
function toggleLang(){ lang = lang==="he" ? "en" : "he"; render(); }

/* ---------- CART ---------- */
function add(id){ cart[id]=(cart[id]||0)+1; openCart(true); renderCart(); syncCount(); }
function setQty(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; renderCart(); syncCount(); }
function cartItems(){ return Object.keys(cart).map(id=>({b:BOOKS.find(x=>x.id===id),q:cart[id]})).filter(x=>x.b); }
function cartQty(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function bundleFor(n){ let best=null; BUNDLES.forEach(b=>{ if(b.qty===n) best=b; }); return best; }
function cartTotal(){
  const n=cartQty(); const bd=bundleFor(n);
  if(bd) return bd.price;
  return cartItems().reduce((s,x)=>s+(x.b.sale||x.b.price)*x.q,0);
}
function syncCount(){ document.getElementById("cartCount").textContent=cartQty(); }
function openCart(o){
  document.getElementById("drawer").dataset.open=o?"true":"false";
  document.getElementById("scrim").dataset.open=o?"true":"false";
}
function orderText(){
  const c=t().cart, lines=cartItems().map(x=>`• ${L(x.b).t} ×${x.q}`).join("\n");
  const nm=(document.getElementById("f-name")||{}).value||"";
  const ad=(document.getElementById("f-addr")||{}).value||"";
  const dd=(document.getElementById("f-ded")||{}).value||"";
  let s = (lang==="he"?"הזמנה מהאתר של נעמה בר שירה\n\n":"Order from N.B. Shira\n\n")+lines;
  s += `\n\n${c.total}: ₪${cartTotal()}`;
  if(signed) s += `\n${lang==="he"?"עותק חתום":"Signed copy"}${dd?` - ${c.dedication} ${dd}`:""}`;
  if(nm) s += `\n${c.name}: ${nm}`;
  if(ad) s += `\n${c.addr}: ${ad}`;
  return s;
}
function sendOrder(){ window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(orderText())}`,"_blank","noopener"); }

function mapEl(){
  const he=lang==="he";
  const OFF_X=px(35.30), OFF_Y=10;   // off-map marker, above the frame
  const pins = PLACES.map((p,i)=>{
    const x = p.off?OFF_X:px(p.lon), y = p.off?OFF_Y:py(p.lat);
    return `
    <g class="pin${p.off?" off":""}" data-i="${i}" onclick="showPlace(${i})" tabindex="0"
       role="button" aria-label="${esc(L(p).n)}" onkeypress="if(event.key==='Enter')showPlace(${i})">
      ${p.off?`<line x1="${x}" y1="${y+9}" x2="${x}" y2="${py(33.50).toFixed(1)}" stroke="var(--line-strong)" stroke-dasharray="3 5"></line>`:""}
      <circle class="halo" cx="${x}" cy="${y}" r="11"></circle>
      <circle class="dot"  cx="${x}" cy="${y}" r="9.5"></circle>
      <text class="pnum" x="${x}" y="${y+3.4}" text-anchor="middle">${i+1}</text>
    </g>`;
  }).join("");

  const rows = PLACES.map((p,i)=>`<button class="ploc" data-i="${i}" onclick="showPlace(${i})">
      <span class="pn">${i+1}</span>
      <span class="pt"><b>${esc(L(p).n)}</b><span class="dim">${esc(L(p.book))}</span></span>
    </button>`).join("");

  return `<div class="mapgrid">
    <div class="mapwrap">
      <svg class="mapsvg" viewBox="0 0 218 522" role="img"
           aria-label="${he?"מפת זירות ההתרחשות בספרים":"Map of the settings in the books"}">
        <defs>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--surface-2)"/>
            <stop offset="100%" stop-color="var(--surface)"/>
          </linearGradient>
          <!-- the frame is a window on a larger region, not a border: fade both cut edges -->
          <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--surface)" stop-opacity="1"/>
            <stop offset="100%" stop-color="var(--surface)" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="fadeBot" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="var(--surface)" stop-opacity="1"/>
            <stop offset="100%" stop-color="var(--surface)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${path(COAST)} ${path(BORDER).replace(/^M/,"L")} Z"
              fill="url(#land)" stroke="var(--line-strong)" stroke-width="1" stroke-linejoin="round"/>
        <ellipse cx="${px(35.585).toFixed(1)}" cy="${py(32.815).toFixed(1)}" rx="5" ry="8" class="water"/>
        <path d="${path(DEAD_SEA)} Z" class="water"/>
        <rect x="0" y="0"   width="218" height="34" fill="url(#fadeTop)"/>
        <rect x="0" y="470" width="218" height="52" fill="url(#fadeBot)"/>
        ${pins}
      </svg>
    </div>
    <div class="stack g-m">
      <div class="placelist">${rows}</div>
      <div class="mapnote" id="mapNote">
        <span class="eyebrow">${he?"בחרו זירה":"Choose a setting"}</span>
        <p class="dim">${he
          ? "תשע זירות מתוך הספרים - מצור בצפון ועד ים המלח. אחת מהן אפילו לא באזור."
          : "Nine settings from the books, from Tyre in the north to the Dead Sea. One of them isn't even in the region."}</p>
      </div>
    </div>
  </div>`;
}
function showPlace(i){
  const p=PLACES[i], pl=L(p);
  document.querySelectorAll(".pin").forEach(el=>el.dataset.on = el.dataset.i==String(i)?"true":"false");
  document.querySelectorAll(".ploc").forEach(el=>el.dataset.on = el.dataset.i==String(i)?"true":"false");
  document.getElementById("mapNote").innerHTML =
    `<div class="stack g-xs">
       <span class="eyebrow">${esc(L(p.book))}</span>
       <h3 style="color:var(--gold-soft);font-size:1.2rem">${esc(pl.n)}</h3>
       <p>${esc(pl.d)}</p>
     </div>`;
}

/* ---------- SKY CANVAS ---------- */
let skyRAF=null;
/* A quiet starfield behind the whole page. Positions are seeded, so the sky is
   the same on every visit; only the twinkle moves. */
let starRAF=null;
function startStars(){
  const cv=document.getElementById("stars"); if(!cv) return;
  const ctx=cv.getContext("2d"); let w,h,stars=[];
  let seed=20240;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  function size(){
    const dpr=Math.min(devicePixelRatio||1,2);
    w=innerWidth; h=innerHeight;
    cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    seed=20240;
    const n=Math.round(w*h/5200);
    stars=Array.from({length:n},()=>({
      x:rnd()*w, y:rnd()*h, r:rnd()*1.05+.22,
      a:rnd()*.5+.14, p:rnd()*Math.PI*2, s:rnd()*.5+.25
    }));
  }
  function paint(ts){
    ctx.clearRect(0,0,w,h);
    for(const st of stars){
      const tw = ts==null ? 1 : (.62+.38*Math.sin(ts/2200*st.s+st.p));
      ctx.globalAlpha=st.a*tw;
      ctx.fillStyle = st.r>1 ? "#E4C889" : "#DCE4F2";
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(ts){ paint(ts); starRAF=requestAnimationFrame(loop); }
  size();
  if(still) paint(null); else { cancelAnimationFrame(starRAF); starRAF=requestAnimationFrame(loop); }
  addEventListener("resize",()=>{ size(); if(still) paint(null); },{passive:true});
}

function startSky(){
  const cv=document.getElementById("sky"); if(!cv) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx=cv.getContext("2d"); let w,h,parts=[];
  function size(){
    const r=cv.getBoundingClientRect(); const dpr=Math.min(devicePixelRatio||1,2);
    w=cv.width=r.width*dpr; h=cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    w=r.width; h=r.height;
    parts=Array.from({length:Math.round(w*h/9000)},()=>({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5+.25,
      s:Math.random()*.14+.03, a:Math.random()*.5+.12, p:Math.random()*Math.PI*2
    }));
  }
  size(); addEventListener("resize",size,{passive:true});
  const css=getComputedStyle(document.documentElement);
  function frame(ts){
    const gold=css.getPropertyValue("--gold-soft").trim()||"#E4C889";
    ctx.clearRect(0,0,w,h);
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,css.getPropertyValue("--sky-top").trim());
    g.addColorStop(.44,css.getPropertyValue("--sky-mid").trim());
    g.addColorStop(.74,css.getPropertyValue("--sky-low").trim());
    g.addColorStop(.93,css.getPropertyValue("--sky-horizon").trim());
    g.addColorStop(1,css.getPropertyValue("--sky-low").trim());
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    parts.forEach(p=>{
      p.y-=p.s; p.x+=Math.sin((ts/2600)+p.p)*.12;
      if(p.y<-4){p.y=h+4;p.x=Math.random()*w;}
      ctx.globalAlpha=p.a*(.55+.45*Math.sin(ts/1400+p.p));
      ctx.fillStyle=gold; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    });
    ctx.globalAlpha=1;
    drawSkyline(ctx,w,h,css);
    skyRAF=requestAnimationFrame(frame);
  }
  cancelAnimationFrame(skyRAF); skyRAF=requestAnimationFrame(frame);
}

/* A Levantine roofline: flat roofs, a dome, a minaret, arched openings.
   Deterministic - the same skyline every load, so it reads as a place, not noise. */
const SKYLINE = [
  [0,74,"flat"],[52,58,"flat"],[92,86,"arch"],[150,46,"flat"],[196,64,"dome"],
  [268,52,"flat"],[310,96,"flat"],[352,38,"minaret"],[382,70,"arch"],[446,54,"flat"],
  [498,88,"flat"],[540,60,"dome"],[604,44,"flat"],[652,78,"arch"],[712,56,"flat"],
  [764,92,"flat"],[806,50,"minaret"],[838,72,"flat"],[898,60,"dome"],[962,46,"flat"],[1010,80,"flat"]
];
function drawSkyline(ctx,w,h,css){
  const unit = w/1040, base = h + 2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, base);
  for(let i=0;i<SKYLINE.length;i++){
    const [x0,ht,kind] = SKYLINE[i];
    const x = x0*unit;
    const nx = (i+1<SKYLINE.length ? SKYLINE[i+1][0] : 1040)*unit;
    const y = base - ht*unit*1.35;
    if(kind==="dome"){
      const cx=(x+nx)/2, r=(nx-x)/2;
      ctx.lineTo(x,y+r*.35);
      ctx.arc(cx,y+r*.35,r,Math.PI,0);
      ctx.lineTo(nx,base);
      ctx.lineTo(nx,y+r*.35);
    } else if(kind==="minaret"){
      const cx=(x+nx)/2, tw=(nx-x)*.34;
      ctx.lineTo(x,base - ht*unit*.5);
      ctx.lineTo(cx-tw,base - ht*unit*.5);
      ctx.lineTo(cx-tw,y);
      ctx.lineTo(cx,y-14*unit);
      ctx.lineTo(cx+tw,y);
      ctx.lineTo(cx+tw,base - ht*unit*.5);
      ctx.lineTo(nx,base - ht*unit*.5);
    } else if(kind==="arch"){
      const cx=(x+nx)/2, r=(nx-x)/2;
      ctx.lineTo(x,y);
      ctx.quadraticCurveTo(cx,y-r*.5,nx,y);
    } else {
      ctx.lineTo(x,y); ctx.lineTo(nx,y);
    }
  }
  ctx.lineTo(w,base); ctx.lineTo(0,base);
  ctx.closePath();
  ctx.globalAlpha=1;
  ctx.fillStyle = css.getPropertyValue("--city").trim() || "#05070F";
  ctx.fill();
  /* dawn caught on the roofline */
  ctx.globalAlpha=.5;
  ctx.lineWidth=1;
  ctx.strokeStyle = css.getPropertyValue("--gold").trim() || "#C9A356";
  ctx.stroke();
  ctx.restore();
}
