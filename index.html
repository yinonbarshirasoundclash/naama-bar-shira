<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="נעמה בר שירה - סופרת פנטזיה ישראלית זוכת פרס גפן. תשעה ספרים: מלאכיות עליון, מלאכיות בשערי השחר, בין השמשות ואיזבלה מלכת ירושלים.">
<meta name="theme-color" content="#04050A">
<meta property="og:type" content="website">
<meta property="og:site_name" content="נעמה בר שירה · מלאכיות עליון">
<meta property="og:title" content="נעמה בר שירה - מלאכים ושדים, ממש כאן">
<meta property="og:description" content="פנטזיה ישראלית שמתרחשת במקומות שאתם מכירים. תשעה ספרים, ארבעה פרסים.">
<meta property="og:image" content="https://yinonbarshirasoundclash.github.io/naama-bar-shira/assets/img/cov_3d.webp">

<title>נעמה בר שירה · מלאכיות עליון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;500;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Assistant:wght@300;400;600;700&display=swap">

<style>
/* ============ TOKENS - dark-first: the twilight hour is the native state ============ */
:root{
  --ink:#04050A; --ink-2:#0A0C16; --ink-3:#131624;
  --gold:#C9A356; --gold-soft:#E4C889; --ember:#D9663E;
  --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3);
  --text:#EAE3D6; --text-dim:#B6AF9F; --muted:#8A8474;
  --line:rgba(201,163,86,.20); --line-strong:rgba(201,163,86,.42);
  --glow:rgba(201,163,86,.10);
  --sky-top:#020307; --sky-mid:#0E0B26; --sky-low:#2E1B34; --sky-horizon:#7E4029; --city:#010204;
  --shadow:0 24px 60px -28px rgba(0,0,0,.85);
  --cover-a:#1B1440; --cover-b:#05070F; --cover-c:#3B2340;
  --cover-text:#F1E8D7; --cover-label:#E4C889; --cover-line:rgba(201,163,86,.38);

  --f-display:"Frank Ruhl Libre",'Times New Roman',serif;
  --f-display-lat:"Cormorant Garamond",'Times New Roman',serif;
  --f-body:"Assistant",'Segoe UI',system-ui,sans-serif;

  --measure:66ch; --pad:clamp(1.1rem,4vw,2.6rem);
  --rhythm:clamp(3.2rem,8vw,6.5rem);
}
*,*::before,*::after{box-sizing:border-box}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); font-weight:300; font-size:clamp(1rem,.55vw + .9rem,1.09rem);
  line-height:1.72; -webkit-font-smoothing:antialiased;
}
[dir="ltr"] body{font-family:var(--f-body)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ TYPE ============ */
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.16;text-wrap:balance;margin:0}
[dir="ltr"] h1,[dir="ltr"] h2,[dir="ltr"] h3,[dir="ltr"] .serif-lat{font-family:var(--f-display-lat);font-weight:400}
h1{font-size:clamp(2.4rem,6.2vw,4.6rem);font-weight:900;letter-spacing:-.015em}
h2{font-size:clamp(1.75rem,3.6vw,2.8rem)}
h3{font-size:clamp(1.15rem,1.8vw,1.42rem);font-weight:700}
p{margin:0}
.eyebrow{
  font-family:var(--f-body);font-size:.72rem;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--gold);display:block;
}
[dir="rtl"] .eyebrow{letter-spacing:.14em}
.lede{font-size:clamp(1.06rem,1.4vw,1.28rem);color:var(--text-dim);line-height:1.66;max-width:var(--measure)}
.dim{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.fnav .num{direction:ltr;unicode-bidi:isolate}

/* ============ SHELL ============ */
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--pad)}
.narrow{max-width:760px}
.stack{display:flex;flex-direction:column}
.g-xs{gap:.5rem}.g-s{gap:.9rem}.g-m{gap:1.6rem}.g-l{gap:2.6rem}.g-xl{gap:clamp(3rem,6vw,5rem)}
section.band{padding-block:var(--rhythm)}
.rule{height:1px;background:linear-gradient(to var(--to,right),transparent,var(--line-strong),transparent);border:0;margin:0}

/* ============ NAV ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(14px) saturate(1.2);
  background:color-mix(in oklab,var(--bg) 84%,transparent);
  border-block-end:1px solid var(--line);
}
.topbar-in{display:flex;align-items:center;gap:.55rem;min-height:66px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-inline-end:auto;text-align:start}
.brand b{font-family:var(--f-display);font-size:1.16rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
[dir="ltr"] .brand b{font-family:var(--f-display-lat);font-weight:600}
.brand span{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.nav{display:flex;gap:.05rem;flex-wrap:nowrap}
.nav button{
  padding:.42rem .56rem;font-size:.83rem;color:var(--text-dim);border-radius:2px;
  position:relative;transition:color .2s;white-space:nowrap;
}
/* the English labels are longer than the Hebrew ones - they need the row tighter */
[dir="ltr"] .nav button{padding-inline:.34rem;font-size:.79rem}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{color:var(--gold-soft)}
.nav button[aria-current="page"]::after{
  content:"";position:absolute;inset-inline:.56rem;bottom:.12rem;height:1px;background:var(--gold);
}
.tools{display:flex;align-items:center;gap:.4rem}
.chip{
  border:1px solid var(--line-strong);border-radius:999px;padding:.3rem .72rem;
  font-size:.75rem;letter-spacing:.06em;color:var(--text-dim);transition:.2s;
}
.chip:hover{color:var(--gold-soft);border-color:var(--gold)}
.chip b{font-weight:700;color:var(--gold-soft)}
.navtoggle.chip{display:none}  /* .chip sets inline-flex later in the sheet - keep this rule stronger */
/* The nav collapses when the labels stop fitting on one line, not at a fixed
   width - the Hebrew and English label sets are different lengths. fitNav()
   measures the bar and sets body[data-nav="compact"]. */
body[data-nav="compact"] .navtoggle.chip{display:inline-flex;font-size:1.15rem;line-height:1;padding:.28rem .55rem}
body[data-nav="compact"] .nav{
  position:fixed;inset-block-start:66px;inset-inline:0;background:var(--surface);
  border-block-end:1px solid var(--line);flex-direction:column;gap:0;padding:.5rem var(--pad) 1.1rem;
  display:none;
}
body[data-nav="compact"] .nav[data-open="true"]{display:flex}
body[data-nav="compact"] .nav button{padding:.66rem .2rem;font-size:1rem;text-align:start;border-block-end:1px solid var(--line)}
body[data-nav="compact"] .nav button[aria-current="page"]::after{display:none}

.crosslink{
  display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center;justify-content:space-between;
  border:1px solid var(--line);padding:1.3rem 1.4rem;
  background:color-mix(in oklab,var(--surface) 55%,transparent);
}
.crosslink b{font-family:var(--f-display);color:var(--gold-soft);font-size:1.12rem}
[dir="ltr"] .crosslink b{font-family:var(--f-display-lat)}
.crosslink p{max-width:56ch;font-size:.9rem}

/* ============ APPENDICES ============ */
.h3{font-family:var(--f-display);font-size:1.32rem;color:var(--text)}
[dir="ltr"] .h3{font-family:var(--f-display-lat)}

.circles{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;max-width:44rem}
.circles li{
  display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.15rem .9rem;align-items:baseline;
  border-block-end:1px solid var(--line);padding-block:.62rem;
}
.circles .cnum{grid-area:1/1/3/2;color:var(--gold);font-size:1.05rem;align-self:center}
.circles .cname{grid-area:1/2/2/3;font-family:var(--f-display);color:var(--text);font-size:1.02rem}
[dir="ltr"] .circles .cname{font-family:var(--f-display-lat)}
.circles .csin{grid-area:2/2/3/3;color:var(--text-dim);font-size:.84rem}
.circles .cruler{grid-area:1/3/3/4;align-self:center;color:var(--gold-soft);font-size:.84rem;letter-spacing:.04em}

/* the plates are ink on paper - they stay warm objects on the dark page */
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem .8rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:1.15rem .9rem}
/* a button lays its children out as blocks - flex inside one drops the caption
   outside the box in Chrome, so the plate stacks plain blocks instead */
/* a real <button> wraps its children in an anonymous flex box that clips the
   caption, so the plate is a div with a button role instead */
.dplate{display:block;width:100%;text-align:start;cursor:pointer}
.pshot{
  display:block;border:1px solid var(--line-strong);background:#E9DFC9;
  transition:border-color .25s, transform .25s;
}
.pshot img{width:100%;height:auto;display:block}
.dplate:hover .pshot,.dplate:focus-visible .pshot{border-color:var(--gold);transform:translateY(-3px)}
.dplate .pname{display:block;margin-block-start:.5rem;font-family:var(--f-display);color:var(--text);font-size:.92rem;line-height:1.25}
[dir="ltr"] .dplate .pname{font-family:var(--f-display-lat)}
.dplate .prole{display:block;margin-block-start:.15rem;color:var(--text-dim);font-size:.73rem;line-height:1.35}

.loreview{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:1.6rem;align-items:start}
.loreplate{width:100%;height:auto;border:1px solid var(--line-strong);background:#E9DFC9}
.loreview p{color:var(--text-dim);line-height:1.75}
@media (max-width:640px){ .loreview{grid-template-columns:1fr} .loreplate{max-width:220px} }

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.dcard{
  border:1px solid var(--line);padding:1rem 1.1rem;text-align:start;
  background:color-mix(in oklab,var(--surface) 55%,transparent);
}
.dcard b{display:block;font-family:var(--f-display);color:var(--gold-soft);font-size:1rem;margin-block-end:.4rem}
[dir="ltr"] .dcard b{font-family:var(--f-display-lat)}
.dcard p{color:var(--text-dim);font-size:.88rem;line-height:1.65}
.agechip{
  font-size:.7rem;color:var(--text-dim);border:1px solid var(--line-strong);
  border-radius:999px;padding:.1rem .5rem;margin-inline-start:.35rem;vertical-align:.1em;
}

.eradiv{display:flex;align-items:baseline;gap:.8rem;border-block-end:1px solid var(--line-strong);padding-block-end:.5rem;margin-block-start:1.4rem}
.eradiv span{font-family:var(--f-display);color:var(--gold-soft);font-size:1.05rem}
[dir="ltr"] .eradiv span{font-family:var(--f-display-lat)}
.eradiv i{color:var(--text-dim);font-size:.78rem;letter-spacing:.1em;font-style:normal;text-transform:uppercase}

.gens{list-style:none;margin:0;padding:0;max-width:62rem}
.gens li{display:grid;grid-template-columns:2.2rem 1fr;gap:.9rem;padding-block:.85rem;border-block-end:1px solid var(--line)}
.gens .gnum{color:var(--gold);font-size:.9rem;padding-block-start:.15rem}
.gens b{display:block;font-family:var(--f-display);color:var(--text);font-size:1rem;margin-block-end:.25rem}
[dir="ltr"] .gens b{font-family:var(--f-display-lat)}
.gens .gyear{color:var(--gold-soft);font-size:.78rem;margin-inline-start:.4rem}
.gens p{color:var(--text-dim);font-size:.88rem;line-height:1.7}

/* ============ THE GATE - arch motif drawn from her titles ============ */
.gate{position:relative;display:grid;place-items:center;isolation:isolate}
.gate-svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.arch{
  --w:min(88vw,620px);
  width:var(--w);aspect-ratio:3/4.1;
  border-start-start-radius:var(--w);border-start-end-radius:var(--w);
  border:1px solid var(--line-strong);
  background:linear-gradient(to bottom,var(--sky-top),var(--sky-mid) 42%,var(--sky-low) 76%,var(--sky-horizon));
  position:relative;overflow:hidden;
}
.arch::after{
  content:"";position:absolute;inset:8px;
  border-start-start-radius:var(--w);border-start-end-radius:var(--w);
  border:1px solid var(--glow);
}

/* ============ HERO ============ */
.hero{position:relative;min-height:min(78vh,700px);display:grid;align-items:center;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,transparent 62%,color-mix(in oklab,var(--bg) 88%,transparent) 92%,var(--bg));
}
.hero-in{position:relative;z-index:2;padding-block:clamp(4rem,11vw,8rem)}
.hero h1{margin-block:.6rem .1rem}
.hero .lede{margin-block-start:1.3rem}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-block-start:2rem}
@media (max-width:620px){
  /* four awards read as two tidy rows on a phone, not three ragged ones */
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
  .badge{font-size:.7rem;padding:.38rem .6rem;gap:.3rem;justify-content:center;text-align:center;
         flex-direction:column;line-height:1.25}
}
.badge{
  display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.04em;
  border:1px solid var(--line-strong);padding:.4rem .8rem;border-radius:999px;
  background:color-mix(in oklab,var(--surface) 70%,transparent);color:var(--text-dim);
}
.badge b{color:var(--gold-soft);font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:.7rem;margin-block-start:2.2rem}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.55rem;padding:.72rem 1.5rem;
  border:1px solid var(--gold);color:var(--gold-soft);font-size:.9rem;font-weight:600;
  letter-spacing:.05em;border-radius:2px;transition:.22s;background:transparent;
}
.btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn-solid{background:var(--gold);color:#0B0F1C;border-color:var(--gold)}
.btn-solid:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:#0B0F1C}
.btn-quiet{border-color:var(--line-strong);color:var(--text-dim)}
.btn-quiet:hover{background:transparent;color:var(--gold-soft);border-color:var(--gold)}
.btn-sm{padding:.46rem 1rem;font-size:.8rem}

/* ============ CARDS / GRIDS ============ */
.grid{display:grid;gap:1.4rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gworlds{grid-template-columns:1fr;gap:1.6rem}
@media (min-width:880px){.gworlds{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{
  border:1px solid var(--line);background:color-mix(in oklab,var(--surface) 86%,transparent);padding:1.5rem;
  display:flex;flex-direction:column;gap:.75rem;transition:.25s;position:relative;
}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px)}

/* Book cover placeholder - becomes a real <img> by swapping the inner element */
.cover{
  aspect-ratio:2/3;position:relative;overflow:hidden;
  border:1px solid var(--cover-line);
  background:linear-gradient(155deg,var(--cover-a),var(--cover-b) 55%,var(--cover-c));
  display:grid;place-items:center;padding:1.1rem;text-align:center;
}
.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cover .ct{
  display:block;font-family:var(--f-display);font-weight:700;
  font-size:clamp(.78rem,1.5vw,1rem);line-height:1.32;
  color:var(--cover-text);text-shadow:0 2px 14px rgba(0,0,0,.65);
}
.cover .cs{
  display:block;font-size:.6rem;letter-spacing:.16em;line-height:1.5;
  text-transform:uppercase;color:var(--cover-label);margin-block-end:.55rem;
  padding-block-end:.5rem;border-block-end:1px solid var(--cover-line);
}
.cover::after{content:"";position:absolute;inset:6px;border:1px solid var(--cover-line);pointer-events:none}
.cover.mini{padding:0}
.cover.mini .cs,.cover.mini .ct,.cover.mini .cover-flag{display:none}
.cover.has-img{padding:0;background:var(--cover-b)}
.cover.has-img::after{display:none}
.cover.has-img.mini::before{display:none}
.cover.mini::before{
  content:"";position:absolute;inset:22% 26%;border:1px solid var(--cover-line);
  border-start-start-radius:99px;border-start-end-radius:99px;
}
.cover-flag{
  position:absolute;inset-block-start:0;inset-inline-start:0;z-index:2;
  background:var(--gold);color:var(--cover-b);font-size:.64rem;font-weight:700;
  letter-spacing:.1em;padding:.28rem .6rem;
}

.book{display:flex;flex-direction:column;gap:.7rem;height:100%}
.book > .btn{margin-block-start:auto}
.book .meta{display:flex;flex-direction:column;gap:.2rem}
.book h3{font-size:1.02rem;line-height:1.3}
.price{display:flex;align-items:baseline;gap:.5rem;font-variant-numeric:tabular-nums}
.price .now{color:var(--gold-soft);font-weight:700;font-size:1.05rem}
.price .was{color:var(--muted);text-decoration:line-through;font-size:.84rem}

/* ============ WORLD PANELS ============ */
.world{
  border:1px solid var(--line);background:
    linear-gradient(to bottom,color-mix(in oklab,var(--surface) 92%,transparent),var(--surface));
  padding:clamp(1.4rem,3vw,2.4rem);display:flex;flex-direction:column;gap:1rem;
  position:relative;overflow:hidden;
}
.world::before{
  content:"";position:absolute;inset-block-start:-40%;inset-inline-end:-18%;
  width:60%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 68%);pointer-events:none;
}
.world .wnum{
  font-family:var(--f-display-lat);font-size:.8rem;letter-spacing:.24em;color:var(--gold);
}
.taglist{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{font-size:.72rem;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);padding:.22rem .55rem;border-radius:999px}

/* a link whose URL has not been supplied yet reads as unavailable, not broken */
.is-pending{opacity:.42;cursor:default;pointer-events:none}

/* ============ GALLERY ============ */
.gal{display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.gal{grid-template-columns:repeat(4,1fr)}}
.plate{
  position:relative;overflow:hidden;border:1px solid var(--cover-line);
  background:var(--cover-b);aspect-ratio:47/66;cursor:zoom-in;display:block;width:100%;
  border-start-start-radius:60% 22%;border-start-end-radius:60% 22%;
}
.plate img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.plate:hover img{transform:scale(1.045)}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(201,163,86,.30);
  border-start-start-radius:60% 22%;border-start-end-radius:60% 22%;
}
.plate .cap{
  position:absolute;inset-inline:0;inset-block-end:0;padding:1.5rem .7rem .75rem;
  background:linear-gradient(to top,rgba(4,6,12,.93),rgba(4,6,12,.6) 55%,transparent);
  display:flex;flex-direction:column;gap:.1rem;text-align:center;
}
.plate .cap b{
  font-family:var(--f-display);font-size:1.08rem;font-weight:700;color:#F3EAD9;letter-spacing:.01em;
}
[dir="ltr"] .plate .cap b{font-family:var(--f-display-lat);font-weight:600}
.plate .cap span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}

/* ============ INTERNATIONAL ============ */
.intl{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-block-start:.4rem}
.intlcard{margin:0;display:flex;flex-direction:column;gap:.75rem}
.intlimg{
  display:block;width:100%;aspect-ratio:4/3;overflow:hidden;padding:0;
  border:1px solid var(--line-strong);background:var(--cover-b);cursor:zoom-in;
}
.intlimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.intlimg:hover img{transform:scale(1.05)}
.intlcard figcaption{display:flex;flex-direction:column;gap:.2rem}
.intlcard b{font-family:var(--f-display-lat);font-weight:600;font-size:1rem;color:var(--gold-soft)}
.intlcard span{font-size:.86rem;color:var(--text-dim);line-height:1.55}

/* ============ PAGE HERO ============ */
.phero{
  position:relative;isolation:isolate;overflow:hidden;
  display:grid;align-items:end;
  min-height:clamp(15rem,30vw,23rem);
  padding-block:clamp(3rem,7vw,5rem) clamp(1.6rem,4vw,2.6rem);
  border-block-end:1px solid var(--line);
}
.phero-img{
  position:absolute;inset:0;z-index:-2;
  background-size:cover;background-position:var(--pos,center 40%);
  filter:saturate(.7) contrast(1.05);
  opacity:var(--op,.42);
}
.phero::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(to bottom,color-mix(in oklab,var(--bg) 72%,transparent),color-mix(in oklab,var(--bg) 30%,transparent) 38%,color-mix(in oklab,var(--bg) 88%,transparent) 78%,var(--bg)),
    linear-gradient(to var(--edge,left),transparent 45%,color-mix(in oklab,var(--bg) 70%,transparent));
}
[dir="rtl"] .phero::after{--edge:right}
.phero-in{position:relative;z-index:1}
.phero .lede{color:var(--text)}
.phero + .band{padding-block-start:clamp(2.4rem,5vw,3.4rem)}

/* ============ FIELD GALLERY ============ */
.tabn{font-size:.72rem;opacity:.65;font-variant-numeric:tabular-nums}
.fgrid{
  columns:2 190px;column-gap:.7rem;
}
@media (min-width:760px){.fgrid{columns:3 230px}}
@media (min-width:1080px){.fgrid{columns:4 230px}}
.fcell{
  position:relative;overflow:hidden;padding:0;display:block;width:100%;
  border:1px solid var(--line);background:var(--cover-b);cursor:zoom-in;
  break-inside:avoid;margin-block-end:.7rem;
}
.fcell img{width:100%;height:auto;display:block;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.fcell:hover img{transform:scale(1.04)}
.fcell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(201,163,86,.16);pointer-events:none}
.fcap{
  position:absolute;inset-inline:0;inset-block-end:0;padding:1.6rem .7rem .6rem;
  background:linear-gradient(to top,rgba(4,6,12,.9),transparent);
  color:#EFE6D5;font-size:.78rem;line-height:1.35;text-align:start;
  opacity:0;transform:translateY(6px);transition:.28s;
}
.fcell:hover .fcap,.fcell:focus-visible .fcap{opacity:1;transform:none}
@media (hover:none){.fcap{opacity:1;transform:none}}

.fview{margin:0;display:flex;flex-direction:column;gap:1rem;align-items:center}
.fview img{max-width:100%;max-height:72vh;object-fit:contain;border:1px solid var(--line-strong)}
.fview figcaption{display:flex;flex-direction:column;gap:.3rem;align-items:center;text-align:center}
.fview figcaption b{font-family:var(--f-display);font-size:1.15rem}
[dir="ltr"] .fview figcaption b{font-family:var(--f-display-lat);font-weight:600}
.fnav{display:flex;align-items:center;gap:1.2rem;margin-block-start:.5rem}
.fnav button{
  width:2.2rem;height:2.2rem;border:1px solid var(--line-strong);border-radius:999px;
  color:var(--gold-soft);font-size:1.3rem;line-height:1;display:grid;place-items:center;transition:.2s;
}
.fnav button:hover{border-color:var(--gold);background:var(--glow)}

/* ============ BRAND MARKS ============ */
.chip svg,.btn svg,.socialmark svg{
  width:1em;height:1em;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.chip{display:inline-flex;align-items:center;gap:.42rem}
.socialmark{display:grid;place-items:center;width:2rem;height:2rem;color:var(--gold-soft)}
.socialmark svg{width:1.35rem;height:1.35rem;stroke-width:1.5}

/* ============ SOCIAL CARDS ============ */
.socialgrid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.socialcard{
  display:flex;flex-direction:column;gap:.2rem;text-decoration:none;
  border:1px solid var(--line-strong);padding:1.1rem 1.3rem;transition:.22s;
  background:color-mix(in oklab,var(--surface) 70%,transparent);
}
.socialcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.socialcard b{font-family:var(--f-display);font-size:1.08rem;color:var(--gold-soft)}
[dir="ltr"] .socialcard b{font-family:var(--f-display-lat);font-weight:600}
.socialcard span{font-size:.84rem;color:var(--muted)}

/* ============ BOOK PANEL ============ */
.lb-book{align-items:start;overflow-y:auto}
.lb-panel{
  position:relative;width:min(96vw,880px);margin-block:auto;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  padding:clamp(1.4rem,4vw,2.8rem);
}
.lb-close{
  position:absolute;inset-block-start:.7rem;inset-inline-end:.7rem;z-index:2;
  border:1px solid var(--line-strong);border-radius:999px;width:2rem;height:2rem;
  display:grid;place-items:center;color:var(--text-dim);
}
.lb-close:hover{color:var(--gold-soft);border-color:var(--gold)}
.bookwrap{display:grid;gap:clamp(1.4rem,4vw,2.6rem);grid-template-columns:1fr;align-items:start}
@media (min-width:720px){.bookwrap{grid-template-columns:230px 1fr}}
.bookaside{max-width:230px}
.bookbuy{
  display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;
  margin-block-start:1.2rem;padding-block-start:1.2rem;border-block-start:1px solid var(--line);
}
.lb-panel{padding-block-start:clamp(2.6rem,5vw,3.2rem) !important}
.jacket{display:flex;flex-direction:column;gap:.9rem;margin-block-start:.5rem}
.jacket p{font-size:1rem;line-height:1.75;color:var(--text-dim);max-width:60ch}
.bq{
  margin:0;border-inline-start:2px solid var(--gold);padding-inline-start:1.1rem;
  font-family:var(--f-display);font-size:1.08rem;line-height:1.6;font-weight:300;color:var(--text);
}
[dir="ltr"] .bq{font-family:var(--f-display-lat);font-style:italic}
.warn{
  border:1px solid var(--ember);padding:.8rem 1rem;font-size:.88rem;line-height:1.6;
  color:var(--text-dim);background:color-mix(in oklab,var(--ember) 8%,transparent);
}
.warn b{color:var(--ember)}
.bookbtns{display:flex;gap:.5rem;flex-wrap:wrap}
.bookbtns .btn{flex:1 1 auto}

/* ============ LIGHTBOX ============ */
.lb{
  position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:clamp(1rem,4vw,3rem);
  background:rgba(4,6,12,.93);backdrop-filter:blur(6px);
}
.lb[data-open="true"]{display:grid}
.lb img{max-width:min(92vw,760px);max-height:88vh;object-fit:contain;border:1px solid var(--line-strong)}
/* direct child only - a descendant selector here pins every button inside the book panel */
.lb > button{
  position:absolute;inset-block-start:1rem;inset-inline-end:1rem;
  border:1px solid var(--line-strong);border-radius:999px;padding:.4rem .8rem;color:#EFE6D5;font-size:.9rem;
}

/* ============ REVIEWS ============ */
.revgrid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.revgrid-big{grid-template-columns:1fr}
@media (min-width:900px){.revgrid-big{grid-template-columns:repeat(3,1fr)}}
.rev{
  margin:0;border:1px solid var(--line);padding:1.5rem 1.6rem 1.3rem;
  background:color-mix(in oklab,var(--surface) 82%,transparent);
  display:flex;flex-direction:column;gap:1rem;position:relative;transition:.25s;
}
.rev:hover{border-color:var(--line-strong)}
.rev::before{
  content:"”";position:absolute;inset-block-start:.15rem;inset-inline-start:1.1rem;
  font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--gold);opacity:.3;
}
[dir="ltr"] .rev::before{content:"“";font-family:var(--f-display-lat)}
.rev blockquote{
  margin:0;font-family:var(--f-display);font-weight:300;line-height:1.62;
  font-size:1rem;color:var(--text);
}
[dir="ltr"] .rev blockquote{font-family:var(--f-display-lat);font-size:1.06rem}
.rev-big blockquote{font-size:clamp(1.08rem,1.5vw,1.28rem);line-height:1.55}
.rev figcaption{
  display:flex;flex-direction:column;gap:.12rem;margin-block-start:auto;
  padding-block-start:.85rem;border-block-start:1px solid var(--line);
}
.rev figcaption b{font-size:.9rem;font-weight:600;color:var(--gold-soft);letter-spacing:.02em}
.rev figcaption span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ============ CREDENTIALS ============ */
.creds{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cred{
  border-inline-start:2px solid var(--gold);padding-inline-start:.9rem;
  display:flex;flex-direction:column;gap:.15rem;
}
.cred b{font-family:var(--f-display);font-size:1rem;color:var(--gold-soft)}
[dir="ltr"] .cred b{font-family:var(--f-display-lat);font-weight:600}
.cred span{font-size:.84rem;color:var(--muted);line-height:1.5}

/* ============ ACCOLADES ============ */
.acc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.acc li{
  font-size:.8rem;line-height:1.45;color:var(--gold-soft);
  padding-inline-start:.95rem;position:relative;
}
.acc li::before{
  content:"";position:absolute;inset-inline-start:0;inset-block-start:.55em;
  width:5px;height:5px;background:var(--gold);transform:rotate(45deg);
}

/* ============ AGE / CONTENT LABEL ============ */
.mature{
  display:inline-flex;align-items:center;gap:.4rem;align-self:flex-start;
  font-size:.7rem;font-weight:600;letter-spacing:.1em;
  color:var(--ember);border:1px solid var(--ember);border-radius:999px;padding:.16rem .6rem;
}
.mature-note{font-size:.78rem;color:var(--muted);line-height:1.5}
.startline{
  display:flex;gap:.5rem;align-items:baseline;font-size:.82rem;color:var(--gold-soft);
  border-block-start:1px solid var(--line);padding-block-start:.8rem;margin-block-start:.2rem;
}
.startline::before{content:"→";opacity:.6}
[dir="rtl"] .startline::before{content:"←"}

/* ============ READING ORDER ============ */
.otabs{display:flex;flex-wrap:wrap;gap:.4rem}
.otab{
  border:1px solid var(--line-strong);padding:.42rem .95rem;font-size:.86rem;
  color:var(--text-dim);border-radius:999px;transition:.2s;
}
.otab:hover{color:var(--gold-soft);border-color:var(--gold)}
.otab[data-on="true"]{background:var(--gold);border-color:var(--gold);color:#07090F;font-weight:600}

.otree{list-style:none;margin:0;padding:0;position:relative}
.otree::before{
  content:"";position:absolute;inset-block:1.1rem;inset-inline-start:.95rem;
  width:1px;background:linear-gradient(to bottom,transparent,var(--line-strong) 8%,var(--line-strong) 92%,transparent);
}
.ostep{
  display:grid;grid-template-columns:2rem 1fr;gap:1rem;align-items:start;
  padding-block:.85rem;position:relative;
}
.odot{
  width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--gold);background:var(--bg);color:var(--gold-soft);
  font-family:var(--f-display);font-weight:700;font-size:.85rem;
  font-variant-numeric:tabular-nums;z-index:1;
}
[dir="ltr"] .odot{font-family:var(--f-display-lat)}
.ostep.is-side{margin-inline-start:2.4rem}
.ostep.is-side::before{
  content:"";position:absolute;inset-inline-start:-1.5rem;inset-block-start:1.75rem;
  width:1.4rem;height:1px;background:var(--line-strong);
}
.ostep.is-side .odot{
  width:1.25rem;height:1.25rem;margin-inline-start:.38rem;margin-block-start:.38rem;
  border-style:dashed;border-color:var(--ember);background:var(--bg);
}
.obody{display:flex;flex-direction:column;gap:.15rem}
.obody b{font-family:var(--f-display);font-size:1.06rem;font-weight:700;line-height:1.3}
[dir="ltr"] .obody b{font-family:var(--f-display-lat);font-weight:600}
.oser{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.onote{font-size:.9rem;color:var(--text-dim);line-height:1.55;margin-block-start:.35rem;max-width:58ch}
.ostep.is-side .obody b{font-size:1rem;color:var(--text-dim)}

/* ============ PULLQUOTE ============ *//* ============ PULLQUOTE ============ */
.pull{
  border-inline-start:2px solid var(--gold);padding-inline-start:1.4rem;
  font-family:var(--f-display);font-size:clamp(1.2rem,2.2vw,1.7rem);line-height:1.5;
  font-weight:300;color:var(--text);max-width:56ch;
}
[dir="ltr"] .pull{font-family:var(--f-display-lat);font-style:italic}
.pull cite{display:block;font-family:var(--f-body);font-size:.78rem;font-style:normal;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-block-start:.9rem}

/* ============ MAP ============ */
.mapgrid{display:grid;gap:clamp(1.2rem,3vw,2.2rem);grid-template-columns:1fr;align-items:start}
@media (min-width:760px){.mapgrid{grid-template-columns:minmax(180px,240px) 1fr}}
.mapwrap{border:1px solid var(--line);background:var(--surface);padding:clamp(.7rem,2vw,1.2rem)}
.mapsvg{width:100%;height:auto;display:block}
.water{fill:var(--bg);stroke:var(--line);opacity:.9}

.pin{cursor:pointer}
.pin .dot,.pin .halo,.pin .pnum{transition:.22s}
.pin .dot{fill:var(--surface);stroke:var(--gold);stroke-width:1}
.pin .halo{fill:none;stroke:var(--gold);opacity:0}
.pin .pnum{font-family:var(--f-body);font-size:11px;font-weight:700;fill:var(--gold-soft)}
.pin.off .dot{stroke:var(--line-strong)}
.pin.off .pnum{fill:var(--muted)}
.pin:hover .dot,.pin[data-on="true"] .dot{fill:var(--ember);stroke:var(--ember)}
.pin:hover .pnum,.pin[data-on="true"] .pnum{fill:#fff}
.pin[data-on="true"] .halo{opacity:.55;stroke:var(--ember)}

.placelist{display:grid;gap:0;border:1px solid var(--line);background:var(--surface)}
.ploc{
  display:flex;gap:.9rem;align-items:baseline;width:100%;text-align:start;
  padding:.8rem 1.1rem;border-block-end:1px solid var(--line);transition:.2s;
}
.ploc:last-child{border-block-end:0}
.ploc:hover{background:color-mix(in oklab,var(--gold) 8%,transparent)}
.ploc[data-on="true"]{background:var(--glow);box-shadow:inset 3px 0 0 var(--gold)}
[dir="rtl"] .ploc[data-on="true"]{box-shadow:inset -3px 0 0 var(--gold)}
.ploc .pn{
  font-family:var(--f-display);font-weight:700;font-size:.82rem;color:var(--gold);
  min-width:1.1rem;font-variant-numeric:tabular-nums;
}
[dir="ltr"] .ploc .pn{font-family:var(--f-display-lat)}
.ploc .pt{display:flex;flex-direction:column;gap:.05rem;line-height:1.35}
.ploc .pt b{font-family:var(--f-display);font-size:.98rem;font-weight:700}
[dir="ltr"] .ploc .pt b{font-family:var(--f-display-lat);font-weight:600}
.ploc .pt .dim{font-size:.78rem}
.mapnote{
  border:1px solid var(--line-strong);background:var(--surface-2);
  padding:1.3rem 1.4rem;min-height:130px;display:flex;flex-direction:column;justify-content:center;
}

/* ============ TABLE / LEDGER (the Archive) ============ */
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ledger th,.ledger td{text-align:start;padding:.85rem .7rem;border-block-end:1px solid var(--line)}
.ledger th{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.ledger tr:hover td{background:color-mix(in oklab,var(--surface) 60%,transparent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface);padding:.4rem 1rem}

/* ============ CART ============ */
.drawer{
  position:fixed;inset-block:0;inset-inline-end:0;width:min(430px,100%);z-index:90;
  background:var(--surface);border-inline-start:1px solid var(--line-strong);
  box-shadow:var(--shadow);transform:translateX(var(--off,110%));transition:transform .32s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
[dir="rtl"] .drawer{--off:-110%}
.drawer[data-open="true"]{--off:0 !important}
.drawer header{display:flex;align-items:center;gap:1rem;padding:1.2rem var(--pad);border-block-end:1px solid var(--line)}
.drawer header h3{margin-inline-end:auto}
.drawer .body{flex:1;overflow-y:auto;padding:1.2rem var(--pad);display:flex;flex-direction:column;gap:1rem}
.drawer footer{padding:1.2rem var(--pad);border-block-start:1px solid var(--line);display:flex;flex-direction:column;gap:.9rem}
.li{display:flex;gap:.9rem;align-items:flex-start;border-block-end:1px solid var(--line);padding-block-end:1rem}
.li .lit{flex:1;display:flex;flex-direction:column;gap:.2rem}
.qty{display:flex;align-items:center;gap:.55rem;border:1px solid var(--line-strong);width:max-content}
.qty button{width:26px;height:26px;display:grid;place-items:center;color:var(--gold-soft)}
.scrim{position:fixed;inset:0;background:rgba(4,6,12,.6);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{
  background:var(--bg);border:1px solid var(--line-strong);color:var(--text);
  padding:.6rem .7rem;font:inherit;font-size:.92rem;border-radius:2px;
}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-family:var(--f-display);font-weight:700}
.total b{color:var(--gold-soft)}

/* ============ MISC ============ */
.note{
  border:1px dashed var(--line-strong);padding:.9rem 1.1rem;font-size:.86rem;color:var(--muted);
  background:color-mix(in oklab,var(--surface) 50%,transparent);
}
.stat{display:flex;flex-direction:column;gap:.1rem}
.stat b{font-family:var(--f-display);font-size:clamp(1.9rem,4vw,2.7rem);font-weight:900;color:var(--gold-soft);line-height:1}
[dir="ltr"] .stat b{font-family:var(--f-display-lat);font-weight:600}
.stat span{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.split{display:grid;gap:clamp(2rem,5vw,4rem);grid-template-columns:1fr}
@media (min-width:900px){.split{grid-template-columns:1.05fr .95fr;align-items:start}
  .split-narrow{grid-template-columns:.8fr 1.2fr}}
.portrait{
  aspect-ratio:4/5;border:1px solid var(--cover-line);position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--cover-a),var(--cover-b) 60%,var(--cover-c));
  display:grid;place-items:center;
}
.portrait img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.portrait .ph{color:rgba(241,232,215,.55);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;z-index:1;text-align:center;padding:1rem}
.evrow{display:flex;gap:1.2rem;align-items:baseline;padding-block:1.1rem;border-block-end:1px solid var(--line);flex-wrap:wrap}
.evdate{font-family:var(--f-display);font-weight:700;color:var(--gold-soft);min-width:5.5rem;font-variant-numeric:tabular-nums}
.foot{border-block-start:1px solid var(--line);padding-block:2.6rem 3.4rem;color:var(--muted);font-size:.86rem}
.sociallinks{display:flex;gap:.5rem;flex-wrap:wrap}
.view{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pcheck{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);padding:.85rem 1rem;cursor:pointer;transition:.2s}
.pcheck:hover{border-color:var(--line-strong)}
.pcheck[data-on="true"]{border-color:var(--gold);background:var(--glow)}
.pcheck input{margin-block-start:.3rem;accent-color:var(--gold)}
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<div class="topbar">
  <div class="wrap topbar-in">
    <button class="brand" onclick="go('home')">
      <b id="brandName">נעמה בר שירה</b>
      <span id="brandSub">מלאכיות עליון</span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <button class="chip" id="langBtn" onclick="toggleLang()">EN</button>
      <button class="chip" id="cartBtn" onclick="openCart(true)" aria-label="order"><span aria-hidden="true">◇</span> <b id="cartCount">0</b></button>
      <button class="navtoggle chip" onclick="toggleNav()" aria-label="תפריט">☰</button>
    </div>
  </div>
</div>

<main id="app"></main>

<div class="scrim" id="scrim" onclick="openCart(false)"></div>
<div class="lb" id="lb" onclick="lb(null)"><button aria-label="close">✕</button><img id="lbImg" src="" alt=""></div>
<div class="lb lb-book" id="bookLb" onclick="if(event.target===this)closeBook()"><div class="lb-panel" id="bookPanel"></div></div>
<aside class="drawer" id="drawer" aria-label="הזמנה">
  <header>
    <h3 id="cartTitle">ההזמנה שלך</h3>
    <button class="chip" onclick="openCart(false)">✕</button>
  </header>
  <div class="body" id="cartBody"></div>

const LORE_DEMONS = [{"k": "satan", "he": {"n": "השטן - הילל בן שחר", "r": "אבי השדים", "t": "מלאך ממלאכי העליון. הוא ואחותו יופיאל היו היפים במלאכים, וצבע שערם בהק כשמש. הילל חטא בחטא היוהרה, ברצונו להיות אל, מרד וגורש מגן העדן. כעונש נלקח ממנו היופי: על גופו השרירי הולבש ראש עז, שערו הבוהק הפך לרעמה פרועה, וכנפיו הלבנות הפכו קירחות וקשות ככנפי עטלף. המלאך המגורש התאחד עם אשתו הראשונה של האדם, לילית, ובתמורה לחיי נצח ולכוחות ילדה לו מאה צאצאים, שמהם נוצרו כל השדים."}, "en": {"n": "Hillel ben Shachar - Satan, father of demons", "r": "Father of demons", "t": "One of the high angels. He and his sister Yofiel were the most beautiful of the angels, their hair as bright as the sun. Hillel sinned in pride, wanting to be a god, rebelled and was cast out of Eden. His beauty was taken from him as punishment: a goat's head set on his muscled body, his bright hair turned to a wild mane, his white wings made bald and hard as a bat's. The exiled angel joined with Lilith, Adam's first wife, and in exchange for eternal life and power she bore him a hundred offspring, from whom all demons came."}}, {"k": "shamdon", "he": {"n": "שמדון", "r": "אבי שושלת שדי שמדון", "t": "השד הראשון שנולד לשושלת השדים, צאצאו הראשון של הילל בן שחר. הוא ואשתר, שהייתה אשתו השנייה של אדם, יצרו את שושלת נסיכי השאול. הושמד במלחמה הראשונה בין המלאכים, בני האדם והשדים, מלחמה שבסופה, במבול הגדול, גורשו השדים לשאול."}, "en": {"n": "Shamdon", "r": "Father of the Shamdon line", "t": "The first demon born into the line, Hillel ben Shachar's firstborn. Together with Ashtar, Adam's second wife, he founded the dynasty of the princes of Sheol. He was destroyed in the first war between angels, humans and demons, the war that ended in the great flood, when the demons were banished to Sheol."}}, {"k": "ashmadai", "he": {"n": "אשמדאי", "r": "אבי מלך השדים", "t": "צאצאו הראשון של שמדון. הושמד בידי מלאכית העליון אור. צאצאי שושלתו נקראים אגרים ובעלי יכולת לשינוי צורה. שלושת צאצאיו הבולטים: לוקיאנתרו הבכור, אמדאוס השני והלבינדי השלישי."}, "en": {"n": "Ashmadai", "r": "Father of the demon king", "t": "Shamdon's firstborn. Destroyed by the archangel Or. His descendants are called Agarim and can change shape. His three notable children: Lukiantro the eldest, Amadeus the second and Halevindi the third."}}, {"k": "lukiantro", "he": {"n": "לוקיאנתרו", "r": "מלך השאול · המדור השביעי, עיר החטאים", "t": "ארמונו נמצא במדור השביעי, המכונה גם עיר החטאים, ושם נמצאים רוב עדרי השאול. הוא שולט בעזרת דודיו נסיכי השאול, ובמדור השני בעזרת אחיו האגרתים, שדים משני צורה. הם כולאים את הנשמות המגיעות לשאול בבורות תחתית ומענים אותן בחזרה על הרגעים הגרועים בחייהן, אלה שהובילו אותן לשם, עד שנשמה מתוקנת זכאית לניסיון נוסף בעולם בני האדם. צאצאיו: הלני, בתו והמלאכית בנש, שהושמדה לפי התיעודים, ושחר, בנו ומלאכית העליון אור, שחי על פני האדמה עם אימו."}, "en": {"n": "Lukiantro", "r": "King of Sheol · the seventh circle, the City of Sinners", "t": "His palace stands in the seventh circle, the City of Sinners, where most of the herds of Sheol are kept. He rules with his uncles, the princes of Sheol, and holds the second circle through his shape-shifting Agarti brothers. Souls that reach Sheol are held in pits and made to relive the worst hours of their lives, the ones that sent them there, until a mended soul earns another attempt in the world of the living. His children: Helni, his daughter by the angel Benesh, destroyed according to the records, and Shachar, his son by the archangel Or, who lives on earth with his mother."}}, {"k": "sagu", "he": {"n": "סאגו", "r": "שליט מדור צלמוות · המדור הראשון", "t": "צאצאו השני של שמדון, שליט המדור לחוטאים בכעס. צלמוות הוא המדור שמפריד בין עולם בני האדם למדורי השאול. סאגו הוא אבי שדי ענקי האש, שבסיפורי המלחמה האחרונה תוארו כשדים בגודל עצום ובעלי כוח אדיר יותר מרעידת אדמה, שיכולים להגיע לגובה של הר. גם לפני הגירוש נצפו רק מעט שדים כאלה, בעיקר בקרבת הרי געש. לרוב הם נמצאים תחת קליפת האדמה."}, "en": {"n": "Sagu", "r": "Ruler of Tzalmavet · the first circle", "t": "Shamdon's second son, ruler of the circle of wrath. Tzalmavet is the circle that separates the human world from the circles of Sheol. Sagu is the father of the fire giants, described in the tales of the last war as demons of enormous size, stronger than an earthquake, able to grow as tall as a mountain. Even before the banishment only a few were ever seen, mostly near volcanoes. Most of the time they lie beneath the earth's crust."}}, {"k": "samuel", "he": {"n": "סמואל", "r": "שליט מדור גולא · המדור השני", "t": "צאצאו החמישי של שמדון. הושמד בקרב מול מלאכיות העליון. מדור גולא הוא המדור לחוטאים בגרגרנות, ובו הם מעונים ברעב בלתי נגמר ובלתי נשלט. סמואל חולק את המדור עם שליט זוטר בשם בעל זבוב, והמדור מלא חרקים ומזיקים הניזונים מנשמות בני האדם. סמואל אינו בנה של אשתר כשאר אחיו, אלא צאצא של שמדון ומלאכית ששמה לא ידוע, ולכן מכונה גם 'מלאך המוות', בהיותו חצי שד וחצי מלאך. החיבה שלו לבני האדם הולידה לו שני צאצאים שהם חצי אדם וחצי שד."}, "en": {"n": "Samuel", "r": "Ruler of Gula · the second circle", "t": "Shamdon's fifth son, destroyed in battle against the archangel sisters. Gula is the circle of gluttony, where souls are tormented by a hunger that never ends and cannot be controlled. Samuel shares the circle with a lesser ruler named Ba'al Zvuv, and it swarms with insects and vermin that feed on human souls. Unlike his brothers Samuel is not Ashtar's son but the child of Shamdon and an angel whose name is unknown, which is why he is also called the Angel of Death, being half demon and half angel. His fondness for humans gave him two children who are half human, half demon."}}, {"k": "ghul", "he": {"n": "ע'ול", "r": "הצאצא הראשון של סמואל", "t": "הושמד בקרב מול מלאכיות העליון. אבי שדי הנזימבי, המוכרים בשמם הרווח זומבים. שדי הנזימבי אינם נולדים, אלא הם גופות של בני אדם שע'ול משתלט עליהן ומפעיל כמו בובות. כשהגופות אינן בשליטתו, הצורך היחיד שמניע אותן דומה לזה של הנשמות המעונות במדור השני: רעב בלתי נגמר ובלתי נשלט, והן יאכלו כל דבר שנקלע בדרכן."}, "en": {"n": "Ghul", "r": "Samuel's firstborn", "t": "Destroyed in battle against the archangel sisters. Father of the Nzimbi demons, better known as zombies. Nzimbi are not born: they are human corpses that Ghul takes over and works like puppets. Out of his control, the only thing that drives them is the hunger of the second circle, endless and uncontrollable, and they will eat whatever crosses their path."}}, {"k": "gaotika", "he": {"n": "גאוטיקה", "r": "הצאצאית השנייה של סמואל", "t": "אם שדי הטוביקנה, המכונים גם אנשי זאב, שדים ממושמעים ויחסית ניתנים לשליטה, המשמשים מגינים ולוחמים של שושלת הנסיכים. בגלל דם האדם הזורם בגאוטיקה, אפשר להעביר את כוחות השד של שושלתה לבני אדם באמצעות נשיכה, דם או קיום יחסי מין."}, "en": {"n": "Gaotika", "r": "Samuel's second child", "t": "Mother of the Tovikana demons, also called wolf men: disciplined and relatively controllable, they serve as guards and fighters for the princes' line. Because human blood runs in Gaotika, the powers of her line can pass to humans through a bite, through blood, or through sex."}}, {"k": "abadon", "he": {"n": "אבדון", "r": "שליט מדור אבדון · המדור השלישי", "t": "צאצאו השלישי של שמדון, אבי שדי המאגוס המכונים מכשפים. המדור השלישי הוא מדור החמדנות: הנשמות מוחזקות בו בכלובים מזהב, נרדפות בתחושת חוסר הגשמה ונטרפות שוב ושוב על ידי שדיה של ממון, השליטה הזוטרה של המדור. גם שדי ההאנהגוארה חיים במדור הזה, ונשלטים בידי ממון ברמת תודעה של חיות טורפות."}, "en": {"n": "Abadon", "r": "Ruler of Abadon · the third circle", "t": "Shamdon's third son, father of the Magus demons, the sorcerers. The third circle is greed: souls are kept in cages of gold, hounded by a sense of never having enough, devoured again and again by the demons of Mammon, the circle's lesser ruler. The Hanhaguara demons also live here, ruled by Mammon at the awareness of predatory animals."}}, {"k": "belial", "he": {"n": "בלייעל", "r": "שליט מדור אסידיה · המדור הרביעי", "t": "צאצאו השני של הילל בן שחר. במדור אסידיה נענשים החוטאים בשקרים, בעצלנות ובניצול. זהו מדור שכולו מים, וכלואה בו גם השדה לוויתן. החוטאים שוקעים בו בים אין סופי של שקרים ואשמה. בלייעל ובנו הבכור אוסה, שהיה בן ארבע מאות שנה, הושמדו במלחמה הגדולה של השדים, אך בעזרת דמה של לילית הוחזר בלייעל לחיים, ומאז הוא וצאצאיו אינם יכולים למות. בלייעל ולילית יצרו את שושלת לוציפר, שדי הפמליירים המוכרים כערפדים."}, "en": {"n": "Belial", "r": "Ruler of Acedia · the fourth circle", "t": "The second son of Hillel ben Shachar. Acedia punishes lies, sloth and exploitation. It is a circle of water, and the demon Leviathan is imprisoned there too. Its sinners sink into an endless sea of lies and guilt. Belial and his firstborn Osa, who was four hundred years old, were destroyed in the great war of the demons, but Lilith's blood brought Belial back, and since then neither he nor his descendants can die. Belial and Lilith created the line of Lucifer, the Famelier demons known as vampires."}}, {"k": "elias", "he": {"n": "אליאס", "r": "שליט מדור שחט · המדור החמישי", "t": "צאצאו הרביעי של שמדון, אבי שדי הדראקון המכונים דרקונים. המדור שומם ויש בו בעיקר סלעים, והוא מיועד לחוטאים מתוך קנאה. נשמות האדם בו נרדפות בידי צאצאיו של אליאס שוב ושוב ואינן מוצאות מנוח."}, "en": {"n": "Elias", "r": "Ruler of Shachat · the fifth circle", "t": "Shamdon's fourth son, father of the Draconi demons, the dragons. The circle is barren and mostly rock, and it is meant for envy. The souls there are hunted by Elias's offspring again and again and find no rest."}}, {"k": "lucifer", "he": {"n": "לוציפר", "r": "שליט מדור אופליה · המדור השישי", "t": "צאצאו של בלייעל, אבי שדי הפמליירים המוכרים בשם ערפדים. אינם יכולים למות והם ניזונים מדם ומפחד. המדור של לוציפר שרוי בחשכה מוחלטת, ואליו נשלחים החוטאים בחטא הגאווה."}, "en": {"n": "Lucifer", "r": "Ruler of Ophelia · the sixth circle", "t": "Belial's son, father of the Famelier demons known as vampires. They cannot die and they feed on blood and on fear. Lucifer's circle lies in total darkness, and pride is what sends a soul there."}}, {"k": "lilith", "he": {"n": "לילית", "r": "אם השדים, השדה הראשונה", "t": "נועדה לשרת ולהיות זוגתו של אדם, אך במהרה התגלתה כלא ציתנית, מרדנית ופרועה, ואדם ביקש אישה אחרת במקומה. לאחר הגירוש פגשה לילית את הילל בן שחר, מלאך שגורש מגן העדן. הם התאחדו, ובתמורה לחיי נצח ולכוחות ילדה לו מאה צאצאים, השדים."}, "en": {"n": "Lilith", "r": "Mother of demons, the first she-demon", "t": "She was meant to serve Adam as his mate, but she was quickly found disobedient, rebellious and wild, and Adam asked for another woman in her place. After she was cast out Lilith met Hillel ben Shachar, an angel exiled from Eden. They joined, and in exchange for eternal life and power she bore him a hundred offspring: the demons."}}, {"k": "lilo", "he": {"n": "לילו", "r": "אבי שושלת שדי הלילית", "t": "צאצאם של לילית ובלייעל ואבי שדי הלילית, המכונים פיות ופיונים. לילית ולילו הולידו שתים עשרה בנות, שייסדו את שנים עשר שבטי הפיות. בני שבטי הפיות אינם יכולים ללדת צאצאים נוספים, ודרכם היחידה להמשיך את השושלת היא לחטוף ילדים אנושיים, לשתות את דמם ולהחליפו בדם פיות בשילוב עם כוח הטבע."}, "en": {"n": "Lilo", "r": "Father of the Lilith demon line", "t": "Child of Lilith and Belial and father of the Lilith demons, the fae. Lilith and Lilo had twelve daughters, who founded the twelve fae tribes. The fae cannot bear children of their own, and the only way they have to continue the line is to take human children, drink their blood and replace it with fae blood bound to the power of nature."}}, {"k": "balt", "he": {"n": "בלת-אילו", "r": "המלכה האם של שבט הפרחים", "t": "בתם הצעירה של לילית ולילו. צאצאיה נוצרים בשילוב של ילדי הלילית עם פרחים, פירות ועצים. בלת-אילו יצרה שתים עשרה גבירות, והן מפוזרות ברחבי העולם ומפיצות את שושלתה."}, "en": {"n": "Balt-Ilu", "r": "Queen mother of the flower tribe", "t": "The youngest daughter of Lilith and Lilo. Her offspring are made by binding Lilith's children to flowers, fruit and trees. Balt-Ilu created twelve ladies, scattered across the world, who carry her line onward."}}, {"k": "lilach", "he": {"n": "לילך", "r": "גבירת הפרחים", "t": "בתה הצעירה של בלת-אילו. לילך יצרה שנים עשר צאצאים. הצאצאים הזכרים של גבירת הפרחים מכונים ביור והנקבות מכונות דיור."}, "en": {"n": "Lilach", "r": "Lady of the flowers", "t": "The youngest daughter of Balt-Ilu. Lilach made twelve offspring. The males of a flower lady's line are called Bior and the females Dior."}}, {"k": "succubus", "he": {"n": "סוקובוס ואינקובוס", "r": "צאצאים של לילית", "t": "חיים במסווה בין בני האדם. אינקובוס הוא השד הזכרי שמשפיע, מפתה ותוקף נשים, וסוקובוס היא השדה הנשית שמשפיעה, מפתה ותוקפת גברים. הם יונקים את האנרגייה מהקורבן במגע, מגע שמוביל לעייפות קיצונית, למחלות ואף למוות. הם יפים ומפתים, ומסתירים את טבעם המפלצתי בשינוי צורה. בצורתם האמיתית עורם בגוון סגול ורוד עד כחול והם בעלי קרניים."}, "en": {"n": "Succubus and incubus", "r": "Children of Lilith", "t": "They live disguised among humans. The incubus is the male demon who sways, seduces and preys on women; the succubus is the female who does the same to men. They draw energy from their victim through touch, which leaves extreme exhaustion, illness and sometimes death. They are beautiful and alluring, hiding a monstrous nature by changing shape. In their true form their skin runs from violet-pink to blue and they are horned."}}, {"k": "incubus", "he": {"n": "האינקובוס", "r": "הצורה הזכרית", "t": "בצורתו האמיתית הוא בעל קרניים ועור בגוון סגול ורוד עד כחול. הסוקובוסים והאינקובוסים חיים במסווה בין בני האדם, ובספרים הם קשורים לאחוזה שעל הר הכרמל."}, "en": {"n": "The incubus", "r": "The male form", "t": "In his true form he is horned, his skin between violet-pink and blue. Succubi and incubi live disguised among humans; in the books they are tied to the estate on Mount Carmel."}}, {"k": "ophrit", "he": {"n": "שדי עופרית", "r": "צאצאים של לילית", "t": "שדים שחיים במקומות שוממים כמו מדבריות, מעמקי יערות או מערות מתחת לאדמה. הם נמנעים ממגע גלוי עם בני האדם ויוצאים רק בסתר ובלילות. לעופרית יש יכולת להיכנס לחלומות של בני האדם ולהיזון מרגשות ומפחדים. הם מזוהים עם חופש פרוע ועם סכנה, והם חיים במונרכיות."}, "en": {"n": "Ophrit demons", "r": "Children of Lilith", "t": "Demons who live in desolate places: deserts, deep forest, caves beneath the ground. They avoid open contact with humans and come out only in secret, at night. An Ophrit can enter human dreams and feed on feeling and on fear. They stand for wild freedom and for danger, and they live in monarchies."}}];
const SHEOL       = [{"n": 1, "he": {"n": "צלמוות", "s": "כעס", "r": "סאגו"}, "en": {"n": "Tzalmavet", "s": "Wrath", "r": "Sagu"}}, {"n": 2, "he": {"n": "גולא", "s": "גרגרנות", "r": "סמואל"}, "en": {"n": "Gula", "s": "Gluttony", "r": "Samuel"}}, {"n": 3, "he": {"n": "אבדון", "s": "חמדנות", "r": "אבדון"}, "en": {"n": "Abadon", "s": "Greed", "r": "Abadon"}}, {"n": 4, "he": {"n": "אסידיה", "s": "שקרים, עצלנות וניצול", "r": "בלייעל"}, "en": {"n": "Acedia", "s": "Lies, sloth and exploitation", "r": "Belial"}}, {"n": 5, "he": {"n": "שחט", "s": "קנאה", "r": "אליאס"}, "en": {"n": "Shachat", "s": "Envy", "r": "Elias"}}, {"n": 6, "he": {"n": "אופליה", "s": "גאווה", "r": "לוציפר"}, "en": {"n": "Ophelia", "s": "Pride", "r": "Lucifer"}}, {"n": 7, "he": {"n": "עיר החטאים", "s": "מושב המלוכה", "r": "לוקיאנתרו"}, "en": {"n": "The City of Sinners", "s": "Seat of the crown", "r": "Lukiantro"}}];
const LEGIONS     = [{"he": {"n": "מלאכי-עליון", "t": "הלגיון שבראשו עומדות ארבע מלאכיות העליון: מיקה, גבי, ריף ואור."}, "en": {"n": "The High Angels", "t": "The legion headed by the four archangel sisters: Mika, Gabi, Riff and Or."}}, {"he": {"n": "המועצה", "t": "בראשה עומדות מלאכיות העליון. מורכבת משמונה עשר נציגים, אחד מכל לגיון, ועוד ארבעים נציגים מקהילות המלאכים בעולם. רבים מהמקומות עוברים בתורשה בין משפחות מלאכים."}, "en": {"n": "The Council", "t": "Headed by the archangel sisters. Eighteen delegates, one from each legion, and forty more from angel communities around the world. Many of the seats pass down through angel families."}}, {"he": {"n": "לגיון התבל", "t": "מורכב מראשי שלושת לגיונות האזור: מלאכי ישראל, מלאכי המערב ומלאכי המזרח. המערב יושב בבריסטול שבאנגליה, המזרח בצ'יאנג מאי שבתאילנד."}, "en": {"n": "The World Legion", "t": "The heads of the three regional legions: the angels of Israel, of the West and of the East. The West sits in Bristol, England; the East in Chiang Mai, Thailand."}}, {"he": {"n": "לגיון הארבעה", "t": "מפקדו הוא ראש לגיון מלאכי ישראל, ולצידו שלושה מלאכים, כל אחד נצר לשושלת מלאכי העליון. ראש הלגיון נשאר בתפקידו עד מותו או עד שישוחרר, והאחריות למינוי מוטלת על מלאכיות העליון."}, "en": {"n": "The Legion of Four", "t": "Commanded by the head of the angels of Israel, with three angels beside him, each descended from an archangel line. Its head serves until death or release, and the archangel sisters appoint him."}}, {"he": {"n": "לגיון המבשרים", "t": "ממלאכי גבריאל, היושבים בראש ההר הגבוה בכל יבשת ומקיימים טקסים ותפילות כדי להיות קרובים לשמיים. הם מתחברים לקווי זמן ולזרמי אירועים הרי גורל, ובין שאר תפקידיהם אחראים לצפות התנהגות שדים."}, "en": {"n": "The Heralds", "t": "Gabriel's angels, who sit on the highest mountain of each continent and hold rites and prayers to stay close to the sky. They read timelines and currents of fateful events, and among other duties they forecast the movements of demons."}}, {"he": {"n": "לגיון החיילים", "t": "חיילי מיכאל, שמובלים בידי מלאכית העליון מיקה ולצידה ראש מלאכי ישראל. לוחמים מיומנים, חזקים וממושמעים, שנבחרים בקפידה."}, "en": {"n": "The Soldiers", "t": "Michael's soldiers, led by the archangel Mika with the head of the angels of Israel beside her. Skilled, strong, disciplined fighters, chosen with care."}}, {"he": {"n": "לגיון המרפאים", "t": "ממלאכי רפאל. מפעיל את מרפאות המלאכים, וחלקם פועלים גם בין בני האדם. הלגיון שולח נציג לכל קהילה ולכל מוסד. חאן המרפאים ממוקם בבריסטול שבאנגליה."}, "en": {"n": "The Healers", "t": "Raphael's angels. They run the angel clinics, and some work among humans as well. The legion sends a delegate to every community and institution. The healers' Khan is in Bristol, England."}}, {"he": {"n": "לגיון הרוקחים", "t": "ממלאכי גבריאל. רוקח שיקויים לטיפול בחולים, לחיזוק מלאכים ולגירוש שדים ממקומות קדושים, ושולח נציגים לקהילות המלאכים ולבני האדם."}, "en": {"n": "The Apothecaries", "t": "Gabriel's angels. They brew potions to treat the sick, to strengthen angels and to drive demons from holy places, and send delegates to angel communities and to humans."}}, {"he": {"n": "לגיון המצמיחים", "t": "מגדל את האוכל הטהור שהמלאכים אוכלים. בכל מדינה יש התיישבות של מצמיחים שאחראית למזון המלאכים באזור."}, "en": {"n": "The Growers", "t": "They raise the pure food the angels eat. Every country has a growers' settlement responsible for the angels' food in that region."}}, {"he": {"n": "לגיון המשלחות", "t": "עף ברחבי העולם ומאתר חפצי מלאכים וחפצים קדושים: ביצי מלאכים, ספרים, חפצים טהורים ועוד."}, "en": {"n": "The Expeditions", "t": "They fly the world locating angel relics and sacred objects: angel eggs, books, pure artefacts and more."}}, {"he": {"n": "לגיון השומרים הצפוני", "t": "מפעיל את כלא המלאכים בצפת, ואחראי לשמור ולהגן על קבוצת מלאכי צפת."}, "en": {"n": "The Northern Guard", "t": "They run the angel prison in Safed and protect the Safed angel group."}}, {"he": {"n": "לגיון השומרים הדרומי", "t": "מפעיל את כלא המלאכים במצפה רמון, ואחראי לשמור ולהגן על קבוצת מלאכי מצפה רמון."}, "en": {"n": "The Southern Guard", "t": "They run the angel prison in Mitzpe Ramon and protect the Mitzpe Ramon angel group."}}, {"he": {"n": "לגיון המלאכים המזרחי", "t": "מרכז את פעילות המלאכים במזרח ומפעיל את כלא המלאכים בצ'יאנג מאי, תאילנד."}, "en": {"n": "The Eastern Legion", "t": "They coordinate angel activity in the East and run the angel prison in Chiang Mai, Thailand."}}, {"he": {"n": "לגיון השומרים המערבי", "t": "מרכז את פעילות המלאכים במערב ומפעיל את כלא המלאכים בבריסטול, אנגליה."}, "en": {"n": "The Western Guard", "t": "They coordinate angel activity in the West and run the angel prison in Bristol, England."}}, {"he": {"n": "לגיון הספרנים", "t": "אחראי על מחקר ופיתוח: תיעוד היסטוריית המלאכים והשדים, ותיעוד עבודת הרוקחים, הרופאים, הקמעות, כלי הנשק ומשפטי המלאכים. מלאכיו אינם חיים בקהילה אלא עפים למרכזי מלאכים, ושם הם כותבים ספרי מחקר ומשמשים כתבים קיימים המבוססים על מורשת מלאכי העבר."}, "en": {"n": "The Librarians", "t": "Research and development: the history of angels and demons, and the record of the apothecaries, the physicians, the amulets, the weapons and angel law. Its angels do not live in a community but fly between angel centres, writing research and keeping the older texts, which rest on what past angels left behind."}}, {"he": {"n": "לגיון המטשטשים", "t": "אחראי על מחיקת הסימנים והעקבות שמשאירים מלאכים ושדים בעולם בני האדם. קהילה קטנה ומבודדת, שמלאכיה נעים בין מוקדי עימות."}, "en": {"n": "The Blurrers", "t": "They erase the marks and traces angels and demons leave in the human world. A small, isolated community whose angels move between flashpoints."}}, {"he": {"n": "לגיון הגשמיים", "t": "אחראי על המגע עם עולם בני האדם: שילוב מלאכים במשרות מפתח, רישום מלאכים צעירים לבתי ספר, וטיפול מול גורמים אנושיים כמו עיריות וגורמי רווחה. במידת הצורך הוא גם אחראי על הקשר עם הנפילים."}, "en": {"n": "The Worldly", "t": "They handle contact with the human world: placing angels in key jobs, enrolling young angels in schools, dealing with municipalities and welfare services. When needed, they also hold the line to the Nephilim."}}, {"he": {"n": "לגיון האוצר", "t": "אחראי על ניהול הכסף וההשקעות שמאפשרים לקהילות המלאכים להתקיים, ועובד ברציפות מול לגיון הגשמיים."}, "en": {"n": "The Treasury", "t": "They manage the money and investments that keep the angel communities running, working closely with the Worldly."}}, {"he": {"n": "לגיון המוארים", "t": "אחראי על כיוון העולם האנושי לטוב. מלאכיו לוחשים באוזני מנהיגים, לוחמים, מצביאים, אומנים והוגי דעות. הלגיון אינו עוסק בלחימה, ומלאכיו לא יפגעו באף בריה, אדם, מלאך או שד, גם במחיר הקרבת עצמם."}, "en": {"n": "The Illumined", "t": "They steer the human world toward good, whispering to leaders, fighters, commanders, artists and thinkers. The legion does not fight, and its angels will harm no creature, human, angel or demon, even at the cost of themselves."}}, {"he": {"n": "לגיון הכלא העמוק", "t": "מפעיל את כלא השדים הוותיק והגדול ביותר, הממוקם בירושלים. הכלא העמוק היה הראשון שיועד לשדים ולחצאי שדים, והלגיון מכונה גם לגיון העשרים."}, "en": {"n": "The Deep Prison", "t": "They run the oldest and largest demon prison, in Jerusalem. The Deep Prison was the first built for demons and half-demons, and the legion is also called the Twentieth."}}];
const KHAN_ROOMS  = [{"he": {"n": "חדר הנצח", "t": "החדר החשוב ביותר, שסביבו נבנה החאן. במרכזו נמצא מעיין הנשמות. כחלק מטקס ההתבגרות, כל מלאך שמגיע לגיל עשר מטפטף טיפה מדמו למים ובכך מצרף חלק מנשמתו למעיין, מעשה שמחבר ומעצים את נשמות המלאכים."}, "en": {"n": "The Hall of Netzach", "t": "The most important room, the one the Khan was built around. At its centre lies the Spring of Souls. As part of the coming-of-age rite, every angel who turns ten lets a drop of blood fall into the water and joins part of their soul to the spring, an act that binds and strengthens the souls of the angels."}}, {"he": {"n": "היכל הכתר", "t": "החדר הגדול בחאן. על תקרתו ויטראז'ים מעוטרים של ארבעת מלאכי העליון. כאן מתקיימות הדרשות של ראש החאן והרצאות המלאכים האורחים."}, "en": {"n": "The Hall of Keter", "t": "The largest room in the Khan, its ceiling set with stained glass of the four archangels. Here the head of the Khan preaches and visiting angels give their talks."}}, {"he": {"n": "חדר החוכמה", "t": "חדרו של ראש החאן. הכניסה אליו היא מתוך היכל הכתר."}, "en": {"n": "The Room of Chochmah", "t": "The chamber of the head of the Khan, entered from the Hall of Keter."}}, {"he": {"n": "חדר הכבשן", "t": "החדר שבו חרוט על הקיר עץ השדים העתיק, המשקף את שושלת שדי השאול לדורותיהם. בחדר עומד שולחן עגול עתיק שסביבו המלאכים מתכננים מתקפות נגד שדים."}, "en": {"n": "The Furnace Room", "t": "Its wall is carved with the ancient demon tree, the line of the demons of Sheol through the generations. An old round table stands there, and around it the angels plan their strikes."}}, {"he": {"n": "חדר הגבורה", "t": "חדר גדול שבו המלאכים מתאמנים בלחימה. הריק שבו מאפשר להם להתאמן על הקרקע או בתעופה, עם כלי נשק או בידיים חשופות."}, "en": {"n": "The Hall of Gevurah", "t": "A large room where the angels train to fight. Its emptiness lets them work on the ground or in flight, armed or bare-handed."}}, {"he": {"n": "חדר המלכות", "t": "חדר האימונים של מלאכי רפאל, מאובזר בכלים ובחומרים להכנת קמעות ובכלי עזר לריפוי."}, "en": {"n": "The Room of Malchut", "t": "The training room of Raphael's angels, stocked for making amulets and for healing."}}, {"he": {"n": "חדר ההוד", "t": "חדר האימונים של מלאכי מיכאל, ובו קיר נשקים וכלים שונים לאימון בקרבות."}, "en": {"n": "The Room of Hod", "t": "The training room of Michael's angels, with a weapons wall and gear for combat drill."}}, {"he": {"n": "חדר התפארת", "t": "חדר האימון של מלאכי גבריאל, מאובזר לרקיחת שיקויים, להתמחות בציור ולהתמקצעות ביצירת חלונות מקום וזמן."}, "en": {"n": "The Room of Tiferet", "t": "The training room of Gabriel's angels, equipped for brewing, for painting, and for opening windows of place and time."}}, {"he": {"n": "מרפאת החסד", "t": "המרפאה של החאן, מנוהלת על ידי רפאל בכיר ומיומן ותחתיו שני מתלמדים, שבסיום הכשרתם יועברו ללגיונות או לקבוצות המלאכים השונות."}, "en": {"n": "The Chesed Clinic", "t": "The Khan's clinic, run by a senior Raphael angel with two apprentices, who move on to legions or angel groups when their training ends."}}, {"he": {"n": "מועדון הבינה", "t": "מועדון המלאכים: רגיעה ומנוחה, שיחות וזמן אישי. יש בו גם ספרייה זמינה למלאכים לשם העשרה וצבירת ידע."}, "en": {"n": "The Binah Club", "t": "The angels' club: rest, conversation and time alone. It holds a library open to the angels."}}, {"he": {"n": "מעונות", "t": "מקום השינה של המלאכיות והמלאכים."}, "en": {"n": "The Dormitories", "t": "Where the angels sleep."}}, {"he": {"n": "חדרי היסודות", "t": "החדרים של המורים, המנטורים והאורחים שמגיעים לחאן."}, "en": {"n": "The Yesod Rooms", "t": "Rooms for the teachers, the mentors and the guests who come to the Khan."}}, {"he": {"n": "רחבת החאן", "t": "המרחב שבין החדרים."}, "en": {"n": "The Khan Court", "t": "The space between the rooms."}}];
