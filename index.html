"סערה מתחוללת בנפשה של אור. קול מתגבר בתוכה, משתלט עליה, ולמרות שהייתה רוצה להסתיר את זה מהסובבים אותה - הם מתחילים להיפגע. המלאכים חייבים להפריד בינה ובין השדה שכבשה את ליבה, גם אם בכוח.",
"אור נאלצת לרדת אל מעמקי השאול כדי להציל לא רק את עצמה, אלא גם את כל מי שהיא אוהבת. בעוד היא מנווטת בעולם הבוגדני של מטה, אחיותיה צוללות לעולמות המטושטשים של חצאי השדים שחיים על הקו בין תל אביב לירושלים, כשגורל השמיים והאדמה מונח על הכף.",
"גבי, מיקה וריף חייבות למצוא דרך לשתף פעולה ולהציל את נפשה של אור לפני שיהיה מאוחר מדי. אך השבר ביניהן הולך וגובר, מאיים לקרוע אותן. הגבולות בין טוב ורע אינם ברורים כפי שחשבו פעם."]},

shimemet:{q:"״את בהחלט מהווה איום,״ אמר לה לוקי, בוחן אותה בעיני האזמרגד שלו. ״אבל אני לא אגלה. לוסי, מתי תביני שאנחנו באותו צד? את שלי.״",
he:[
"אור הפכה ללוסיאל. השאול הוא כבר חלק ממנה והיא לא זוכרת דבר ממי שהייתה. בעולם האכזרי של מטה היא חייבת לחזק את כוחה ואחיזתה בין השדים, אך לכוח יש מחיר.",
"גבי וריף יורדות לשאול כדי להציל את אחותן, מלוות בבנות לילית, חצאי שדים וסוקובוסית אחת שמוכנה לעשות הכול כדי להציל את אהובת ליבה. מיקה מוצאת את עצמה כלואה ביער הפיות בביריה, וכדי להנהיג את המלאכים היא צריכה להילחם בכל מה שהיא עצמה האמינה בו.",
"הספר השלישי והאחרון בטרילוגיה, ובו העולמות של מעלה ומטה מתכנסים להתנגשות חזיתית. מלאכים, שדים ובני לילית בקרבות מכריעים במעמקי השאול, שדי נזימבי צועדים ברחובות ירושלים, ומעל - בשממת העדן - נחשפים סודות שלא ידענו על קיומם."]},

ben:{he:[
"שחר מתעורר למציאות שלא הכיר. הוא לא רק בן של מלאכית־עליון. הוא לא רק נער שגדל בין עצי יער הפיות בצפון. הוא משהו אחר לגמרי. משהו מסוכן.",
"כשהוא מגלה את סודו האפל ובורח אל עולם זר, שחר נאלץ לגלות את זהותו מחדש ולחשוף את הסודות שאימו ואחיותיה הסתירו ממנו כל חייו. בעודו נרדף, כוחות הרסניים מתקרבים אליו - רוקה, שפחתו הקטלנית של אבדון, נשלחת למשימה שאין ממנה דרך חזרה.",
"באותה עת ארבע האחיות - אור, גבי, מיקה וריף - מתמודדות עם סדקים הולכים ומתרחבים: בגידות, אהבות אסורות, אימהוּת מורכבת ולבטים קיומיים שמאיימים לפרק את הברית ביניהן.",
"שבע־עשרה שנה לאחר סיום ״מלאכיות עליון״ מתחיל פרק חדש. מהו מקומו של שחר בתוכנית הגדולה? האם האחיות יתאחדו או יקרסו תחת נטל העבר? והאם באמת אפשר לברוח מגורל שנכתב בשמיים ובשאול גם יחד?"]},

tzava:{he:[
"שחר, בנה של אור מלאכית העליון ולוקיאנתרו מלך השאול, מגיע אל החאן במטרה לממש את ייעודו. תחת עינה הפקוחה של מיקה הוא ניצב מול האתגרים הקשים ביותר: עליו ללמוד על הצד המלאכי שבו, בעוד שד צמא לדם חי בתוכו. האם יהיה המגן של האנושות, או הנשק שיחריב אותה?",
"בעוד שחר צועד על החבל הדק שבין אור לחושך, החאן כולו ניצב בפני מבחן. מיקה נאבקת לשמור על סדר בעולם קורס, בזמן שאור מתמסרת לכס המלכות של השאול. הכתר כבד, והטראומות מהעבר מאיימות להצית מלחמה בין האחיות שתשרוף את השמיים ואת התהומות גם יחד.",
"מנקמה שבוערת בתאי המאסר ועד לצבאות הנפילים הצועדים לירושלים - מסע עוצר נשימה של הקרבה וגילוי עצמי. במקום שבו הגבול בין מלאך לשד מיטשטש, רק דבר אחד בטוח: בדרך אל יום הדין, הקשר החזק ביותר אינו נכתב בדם, אלא בבחירה."]},

zohar:{he:[
"זהר, נצר למשפחה מלאכית עתיקה ורבת עוצמה, תמיד ידעה שנועדה להיות רוקחת. היא התאמנה לכך כל חייה והוכיחה שהיא הטובה ביותר. עם סיום חאן המלאכים ציפתה להמשיך ללגיון הרוקחים, אך ראש לגיון הכלא העמוק, צדקיאל, זיהה את היכולות הטמונות בה ודרש להחזיק בה תחת שליטתו.",
"כך מוצאת זהר את דרכה אל הכלא הקבור עמוק מתחת לאדמה, מוקפת במאות שדים כלואים, ושוקעת בשגרה שכוללת עבודות מטבח, סיורים ושמירות. בהחלט לא העתיד שעליו חלמה. עד שברגע אחד גורלי נסחפים צדקיאל וזהר למשימה שתשנה את חייה מעבר לכל דמיון.",
"החלטה של מלאך אחד שינתה את הייעוד שלה, והיכרות עם שד אחד שינתה את כל תפיסת עולמה."],
warn:"מכיל תכנים מיניים. מסיבות מלאות תשוקה עם ילדי הלילית, אימונים סקסיים מתחת לאדמה, ומלאכית אחת שמגלה שהיא לא כמו שציפו שתהיה."},

barak:{q:"״אתה כל כך שקוף,״ אברה הניח את ידו על הלסת של ברק. ברק לא הצליח להחליט אם לכעוס, להדוף אותו או להתמכר למגע.",
he:[
"מבין כל המלאכים שלא רואים את ברק באמת, מלאך אחד רואה אותו - אברה. ברק נאלץ להוכיח את עצמו ואת המחויבות שלו לאברה, שנפצע קשה במתקפה גדולה על מלאכי החאן. הוא חייב להציל אותו, את האדם היחיד שראה מי הוא מעבר לתווית המלאך והלוחם. ברק יוצא למשימה כמעט בלתי אפשרית - השגת דם שדים. למשימה מצטרף לא פחות מאשר אופיר.",
"אופיר הוא החבר הכי טוב של ברק. או שאולי הוא יותר מזה? ברק היה רוצה להישאר רק השותף לחדר של אופיר, אלא שזה לא כל כך פשוט. למרות הפחד שלו להרוס את החברות ביניהם, ברק מאוהב במלאך עם עיני הדבש בצורת שקד. אבל אופיר בכלל לא רואה אותו ככה - בשבילו ברק הוא רק אח וחבר.",
"האם ברק ישיג את הדם האסור? האם יצליח להציל את אברה? האם יתוודה בפני אופיר על אהבתו - ובמי מהשניים יבחר, או שמישהו מהם יבחר בו?"],
warn:"מכיל תכנים מיניים, מלאכים חתיכים, התמזמזות בחדר הכבשן, מסיבות מישלינגים והתגנבויות אסורות בלילה ברחבי החאן."},

suki:{q:"לא כל שד הוא רע, ולא כל מלאך הוא טוב. סוקי הולכת לגלות את זה בדרך הקשה.",
he:[
"סוקי חיה עם אביה ואחיה בעיירת נופש קטנה ומבודדת באוסטריה, שם הם מנהלים מועדון שייט. למרות שהתרגלה לחיים שקטים, סוקי יודעת שהיא שונה - היא חצי שדת סוקובוס, יצור מיני עם כוחות מסתוריים ומסוכנים.",
"השגרה שהכירה מופרת כשהשדים מגלים את מיקומם, וסוקי ואחיה אינק מבינים כי הם חלק מסיפור הרבה יותר גדול שהוסתר מהם - סיפור על סכסוכים בין משפחות, אהבה אסורה וסודות אפלים. האחים יוצאים למסע מסוכן בישראל, שם הם מגלים את זהותם האמיתית ופוגשים מלאכית מסתורית שמערערת את עולמה של סוקי.",
"הם מוצאים את עצמם בעין הסערה, כשסביבם מתנגשים רגשות, תשוקות וכוחות אכזריים. כעת סוקי צריכה להחליט אם תהפוך לאישה שהיא רוצה להיות, או לשדה חסרת מעצורים."],
warn:"מכיל עלילה עוצמתית, מלאת תשוקה, ותכנים מיניים."},

izabela:{he:[
"ממלכת ירושלים על סף קריסה. כס המלכות מתערער, בריתות נרקמות ונפרמות בלילות חשוכים, והארץ נחרבת מבפנים - בידי בני אדם, ובידי כוחות אפלים הרבה יותר.",
"איזבלה, נסיכה שנולדה אל תוך משחקי שלטון אכזריים, נשואה להאמפרי - אציל ואיש רוח, בן בריתה הקרוב ביותר. נישואיהם מבוססים על נאמנות, חברות ואהבה עמוקה, אך זוהי אהבה שנותרה ללא תשוקה ומגע. אל חייה שב דניאל, חבר ילדות שמעולם לא עזב את ליבה - ומעולם לא השתייך באמת לעולמה.",
"בעוד מזימות נרקמות בחצר המלוכה ושדים אורבים מסביב לחומות, איזבלה מגלה כי חוב אפל שנחתם בדם עוד בטרם לידתה עומד להיגבות. כעת עליה לבחור: לשמר ממלכה בכל מחיר, או להיאבק על הזכות לאהוב בדרכה שלה - גם אם הבחירה תחריב עולמות.",
"רומן היסטורי־פנטסטי סוחף, בהשראת דמותה האמיתית של מלכת ירושלים בתקופת מסעות הצלב."]}
};

/* Nav order follows the reader: what there is, how to buy it, then the world
   behind it. The author and the rest of the shelf come after. */
const VIEWS = ["home","books","shop","worlds","lore","quiz","author","reviews","field","events","speaking","community","rights"];
/* Reachable by address and from the footer, deliberately kept out of the nav row */
const EXTRA_VIEWS = ["privacy","terms"];
const ALL_VIEWS = VIEWS.concat(EXTRA_VIEWS);
function go(v){ view=v; if(v==="quiz") qzLoaded=false; /* re-read the tally on every visit */
  setHash(v); unlockScroll();

  document.getElementById("nav").dataset.open="false"; render(); window.scrollTo({top:0,behavior:"instant"}); }

/* The address bar follows the page you are on, so a link someone shares from
   the quiz opens the quiz and not the front door. replaceState, not push, so
   the back button still leaves the site rather than walking the whole tour. */
function setHash(v){
  try{ history.replaceState(null, "", v==="home" ? location.pathname : "#"+v); }catch(e){}
}
const viewUrl = v => location.origin + location.pathname + (v==="home" ? "" : "#"+v);
/* The gallery used to be a page of its own. It is now the first rubric inside
   the world, so #gallery forwards there instead of 404-ing to the front door -
   readers have shared that address. */
const LEGACY_VIEWS = {gallery:["lore","chars"]};
function fromHash(){
  const h = (location.hash||"").replace(/^#/,"");
  const g = LEGACY_VIEWS[h];
  if(g){ loreTab = g[1]; return g[0]; }
  return ALL_VIEWS.includes(h) ? h : "home";
}
/* Open the world on a named rubric in one step, without painting the page twice. */
function goLore(k){ loreTab = k; go("lore"); }
addEventListener("hashchange", ()=>{ const v=fromHash(); if(v!==view){ view=v; if(v==="quiz") qzLoaded=false; render(); } });
function fitNav(){
  const bar=document.querySelector(".topbar-in"), nav=document.getElementById("nav");
  document.body.removeAttribute("data-nav");     /* measure the row at full size */
  nav.dataset.open="false";
  if(bar.scrollWidth > bar.clientWidth+1) document.body.setAttribute("data-nav","compact");
}
let fitRAF=0;
addEventListener("resize",()=>{ cancelAnimationFrame(fitRAF); fitRAF=requestAnimationFrame(fitNav); });
function toggleNav(){ const n=document.getElementById("nav"); n.dataset.open = n.dataset.open==="true" ? "false" : "true"; }

/* ---------- CART ---------- */
function add(id){ cart[id]=(cart[id]||0)+1; openCart(true); renderCart(); syncCount(); }
function setQty(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; renderCart(); syncCount(); }
function cartItems(){ return Object.keys(cart).map(id=>({b:BOOKS.find(x=>x.id===id),q:cart[id]})).filter(x=>x.b); }
function cartQty(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function bundleFor(n){ let best=null; BUNDLES.forEach(b=>{ if(b.qty===n) best=b; }); return best; }
function cartTotal(){
  const n=cartQty(); const bd=bundleFor(n);
  if(bd) return bd.price;
  return cartItems().reduce((s,x)=>s+(x.b.sale||x.b.price)*x.q,0);
}
function syncCount(){ document.getElementById("cartCount").textContent=cartQty(); }
function openCart(o){
  document.getElementById("drawer").dataset.open=o?"true":"false";
  document.getElementById("scrim").dataset.open=o?"true":"false";
}
function orderText(){
  const c=t().cart, lines=cartItems().map(x=>`• ${L(x.b).t} ×${x.q}`).join("\n");
  const nm=(document.getElementById("f-name")||{}).value||"";
  const ad=(document.getElementById("f-addr")||{}).value||"";
  const dd=(document.getElementById("f-ded")||{}).value||"";
  let s = (lang==="he"?"הזמנה מהאתר של נעמה בר שירה\n\n":"Order from N.B. Shira\n\n")+lines;
  s += `\n\n${c.total}: ₪${cartTotal()}`;
  if(signed) s += `\n${lang==="he"?"עותק חתום":"Signed copy"}${dd?` - ${c.dedication} ${dd}`:""}`;
  if(nm) s += `\n${c.name}: ${nm}`;
  if(ad) s += `\n${c.addr}: ${ad}`;
  return s;
}
function sendOrder(){ window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(orderText())}`,"_blank","noopener"); }

    return `
    <g class="pin${p.off?" off":""}" data-i="${i}" onclick="showPlace(${i})" tabindex="0"
       role="button" aria-label="${esc(L(p).n)}" onkeypress="if(event.key==='Enter')showPlace(${i})">

/* The description used to sit only in the panel below, and readers told us they
   never noticed it. Now the name is drawn right beside the pin you pressed, and
   the panel carries the rest - with a photograph when the place has one. */
function showPlace(i){
  const p=PLACES[i], pl=L(p), he=lang==="he";
  document.querySelectorAll(".pin").forEach(el=>el.dataset.on = el.dataset.i==String(i)?"true":"false");
  document.querySelectorAll(".ploc").forEach(el=>el.dataset.on = el.dataset.i==String(i)?"true":"false");
  mapCallout(i);

  const note=document.getElementById("mapNote");
  if(note){
    note.dataset.on="true";
    /* The picture carries the whole caption under it - which book, the real-world
       location, and what happens there - so it reads on its own, not as a bare name. */
    const caption =
      `<span class="eyebrow">${esc(L(p.book))}</span>
       <b class="pcname">${esc(pl.n)}</b>
       ${pl.sub?`<span class="pcsub">${esc(pl.sub)}</span>`:""}
       <span class="pcd">${esc(pl.d)}</span>`;
    note.innerHTML = p.img
      ? `<figure class="placefig">
           <img class="placeshot" src="assets/places/${esc(p.img)}.webp" alt="${esc(pl.n)}" loading="lazy"
                onerror="this.closest('.placefig').classList.add('noshot');this.remove()">
           <figcaption>${caption}</figcaption>
         </figure>`
      : `<div class="placefig noshot"><div class="pcap">${caption}</div></div>`;
    /* on a phone the panel sits under the map, off screen - bring it along */
    if(matchMedia("(max-width:759px)").matches) note.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}

/* The label is drawn inside the SVG so it travels with the pin at any size.
   Long names ("ירושלים - חאן המלאכים") do not fit beside a pin near the middle
   of a 218-wide frame, so the box takes whichever side has room and drops above
   or below the pin when neither does. It is always clamped inside the frame. */
function mapCallout(i){
  const g=document.getElementById("mapCallout"); if(!g) return;
  const p=PLACES[i];
  const x = p.off?px(35.30):px(p.lon), y = p.off?10:py(p.lat);
  const name = L(p).n;
  const W=218, H=522, pad=3, gap=13, h=17;
  const w = Math.min(W-2*pad, Math.max(30, name.length*5.9 + 14));
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

  const fitsStart = x - gap - w >= pad;      /* room on the low-x side  */
  const fitsEnd   = x + gap + w <= W - pad;  /* room on the high-x side */
  let bx, by, lx;
  if(fitsStart || fitsEnd){
    const onStart = fitsStart && (x > W/2 || !fitsEnd);
    bx = onStart ? x - gap - w : x + gap;
    by = clamp(y - h/2, pad, H - h - pad);
    lx = onStart ? bx + w : bx;              /* the edge the leader touches */
    g.innerHTML = `
      <line x1="${(onStart?x-11:x+11).toFixed(1)}" y1="${y.toFixed(1)}" x2="${lx.toFixed(1)}" y2="${(by+h/2).toFixed(1)}" class="cxline"></line>
      ${boxEl(bx,by,w,h,name)}`;
  } else {
    bx = clamp(x - w/2, pad, W - w - pad);
    by = y - gap - h;
    if(by < pad) by = y + gap;               /* flip under the pin near the top */
    const anchorY = by < y ? by + h : by;
    g.innerHTML = `
      <line x1="${x.toFixed(1)}" y1="${(by<y?y-11:y+11).toFixed(1)}" x2="${clamp(x,bx+4,bx+w-4).toFixed(1)}" y2="${anchorY.toFixed(1)}" class="cxline"></line>
      ${boxEl(bx,by,w,h,name)}`;
  }
}
function boxEl(bx,by,w,h,name){
  return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="2" class="cxbox"></rect>
    <text x="${(bx+w/2).toFixed(1)}" y="${(by+h/2+3.6).toFixed(1)}" text-anchor="middle" class="cxtext">${esc(name)}</text>`;
}

  const i=all.indexOf(x), he=lang==="he";
  const prev=all[(i-1+all.length)%all.length].k, next=all[(i+1)%all.length].k;
  const f=FIGURES[k] || {he:{r:"",t:""},en:{r:"",t:""}};
  const c=L(f);
  const lore = f.lore ? LORE_DEMONS.find(d=>d.k===f.lore) : null;
  const text = c.t || (lore ? L(lore).t : "");
  const body = text
    ? `<p>${esc(text)}</p>`
      + (lore?`<div style="margin-block-start:.4rem"><button class="btn btn-sm btn-quiet"
             onclick="closeBook();goLore('demons')">${he?"לשושלות השדים":"To the demon dynasties"}</button></div>`:"")
    : `<p class="dim">${he?"התיאור של הדמות הזו עוד נכתב, ויעלה לכאן בקרוב.":"This character's entry is still being written, and will appear here soon."}</p>`;
  document.getElementById("bookPanel").innerHTML = `
    <button class="lb-close" onclick="closeBook()" aria-label="${he?"סגירה":"Close"}">✕</button>
    <div class="loreview">
      <img class="loreplate" src="${IMG[k]}" alt="${esc(L(x))}">
      <div class="stack g-s">
        ${c.r?`<span class="eyebrow">${esc(c.r)}</span>`:""}
        <h3 class="h3">${esc(L(x))}${c.a?` <span class="agechip num">${esc(c.a)}</span>`:""}</h3>
        ${body}
        <span class="fnav">
          <button onclick="openFig('${prev}')" aria-label="${he?"הקודם":"Previous"}">‹</button>
          <span class="dim num">${i+1} / ${all.length}</span>
          <button onclick="openFig('${next}')" aria-label="${he?"הבא":"Next"}">›</button>
        </span>
      </div>
    </div>`;
  document.getElementById("bookLb").dataset.open="true";
  document.body.style.overflow="hidden";
}
/* Was its own page. Now the opening rubric of the world: the cast a visitor

function revCard(r,big){
  const he=lang==="he";
  const meta = [r.book?esc(r.book):"", r.role?esc(L(r.role)):""].filter(Boolean).join(" · ");
  return `<figure class="rev${big?" rev-big":""}">
    <blockquote>${esc(L(r))}</blockquote>
    <figcaption>
      <b>${esc(r.by)}</b>${meta?`<span>${meta}</span>`:""}
    </figcaption>
  </figure>`;
}
/* The Rights page is written for foreign publishers and stays in English even while
   the rest of the site is in Hebrew, so it cannot use revCard(): that one follows the
   site language. This one is pinned to English - quote, reviewer name and book title. */
function revCardEn(r){
  const bk = r.book ? BOOKS.find(b=>b.he.t===r.book) : null;
  const ser = !bk && r.book ? BOOKS.find(b=>b.he.s===r.book) : null;
  const meta = bk ? bk.en.t : (ser ? ser.en.s : "");
  return `<figure class="rev rev-big">
    <blockquote>${esc(r.en)}</blockquote>
    <figcaption>
      <b>${esc(r.byEn || r.by)}</b>${meta?`<span>${esc(meta)}</span>`:""}
    </figcaption>
  </figure>`;
}
let fieldCat = "all";
function setField(k){ fieldCat=k; render(); }

function vField(){
  const he=lang==="he";
  const shown = fieldCat==="all" ? FIELD : FIELD.filter(f=>f.c===fieldCat);
  const counts = {}; FIELD.forEach(f=>counts[f.c]=(counts[f.c]||0)+1);
  const tabs = [{k:"all",he:"הכל",en:"All"}].concat(FIELD_CATS.filter(c=>counts[c.k]));

  return `<section class="band wrap stack g-l">
    <div class="stack g-s">
      <span class="eyebrow">${he?"בשטח":"On the road"}</span>

      <p class="lede">${he
        ? "ירידים, כנסים, השקות וחתימות - מדוכן בקניון במודיעין ועד יריד הספרים של פרנקפורט. חלק גדול מהעבודה קורה מול אנשים, לא מול מסך."
        : "Fairs, conventions, launches and signings - from a mall booth in Modi'in to the Frankfurt Book Fair. A great deal of this work happens in front of people, not a screen."}</p>
    </div>

    <div class="otabs">
      ${tabs.map(t=>`<button class="otab" data-on="${t.k===fieldCat}" onclick="setField('${t.k}')">${esc(L(t))}${t.k!=="all"?` <span class="tabn">${counts[t.k]}</span>`:""}</button>`).join("")}
    </div>

        <button class="fcell" onclick="openField('${f.i}')" aria-label="${esc(f.n)}">

}

function openField(id){
  const f=FIELD.find(x=>x.i===id); if(!f) return;

  const idx = list.findIndex(x=>x.i===id);

  document.getElementById("bookPanel").innerHTML = `
    <button class="lb-close" onclick="closeBook()" aria-label="${lang==="he"?"סגירה":"Close"}">✕</button>

      <figcaption>
        <span class="eyebrow">${cat?esc(L(cat)):""}</span>
        <b>${esc(f.n)}</b>
        <span class="fnav">
          <button onclick="openField('${list[(idx-1+list.length)%list.length].i}')">‹</button>
          <span class="dim num">${idx+1} / ${list.length}</span>
          <button onclick="openField('${list[(idx+1)%list.length].i}')">›</button>
        </span>
      </figcaption>
    </figure>`;
  document.getElementById("bookLb").dataset.open="true";
}

/* A page header sitting on one field photograph. The image is dimmed and
   dissolved into the page ground, so it warms the section without ever
   competing with the text on top of it. */
/* ---------- APPENDICES ---------- */
let loreTab = "chars";
function setLore(k){ loreTab=k; render(); const t=document.getElementById("loreTop"); if(t) t.scrollIntoView({block:"start",behavior:"smooth"}); }

function vLore(){
  const he=lang==="he";
  /* The illustrated rubrics come first, because they are what a visitor should
     find without hunting, and the cast opens the page because it is the one
     rubric a first-time reader already has a reason to care about. The 33
     generations moved up the moment they had portraits; the angels are the last
     text-only list left, and they belong ahead of nothing. */
  const tabs=[{k:"chars",he:"דמויות ראשיות",en:"Main characters"},
              {k:"rooms",he:"חדרי החאן",en:"Rooms of the Khan"},
              {k:"legions",he:"לגיונות המלאכים",en:"Angel legions"},
              {k:"sheol",he:"מדורי השאול",en:"The circles of Sheol"},
              {k:"demons",he:"שושלות השדים",en:"Demon dynasties"},
              {k:"line",he:"33 הדורות",en:"33 generations"},
              {k:"angels",he:"מלאכים בוגרים",en:"The angels"}];
  return `${pageHero("ברק עם סימניה מעוצבת מתנה",
      he?"עולם מלאכיות עליון":"The world of the Archangel Sisters",
      he?"מה שנשאר אחרי העמוד האחרון":"What is left after the last page",
      he?"פנטזיה שנשענת על מיתולוגיה יהודית: הדמויות הראשיות, חדרי החאן בירושלים, עשרים לגיונות מלאכים, שבעת מדורי השאול, שושלות שדים מאוירות מלילית ועד אשמדאי ורצף של שלושים ושלושה דורות. זה העולם ממשיך לעבוד גם כשסוגרים את הכריכה - הדמויות והנספחים, פתוחים לקריאה."
        : "The main cast, the rooms of the Khan in Jerusalem, twenty angel legions, the seven circles of Sheol, illustrated demon dynasties and a line of thirty-three generations. This is the world still working after the cover closes - the characters and the appendices, open to read.",
      "center 46%", .30)}

  <section class="band wrap stack g-l" id="loreTop">
    <div class="otabs">
      ${tabs.map(t=>`<button class="otab" data-on="${t.k===loreTab}" onclick="setLore('${t.k}')">${esc(L(t))}</button>`).join("")}
    </div>
    ${loreTab==="chars"?loreChars():""}
    ${loreTab==="demons"?loreDemons():""}
    ${loreTab==="legions"?loreList(LEGIONS, he?"עשרים הלגיונות":"The twenty legions",
        he?"כל מלאך משתייך ללגיון, וכל לגיון מחזיק חלק אחר של העולם: מי נלחם, מי מרפא, מי מגדל את האוכל, ומי מוחק את העקבות."
          :"Every angel belongs to a legion, and each legion holds a different part of the world: who fights, who heals, who grows the food, who erases the traces.", "legions")+lqInvite():""}
    ${loreTab==="rooms"?loreList(KHAN_ROOMS, he?"חאן המלאכים בירושלים":"The Khan of the Angels, Jerusalem",
        he?"החאן בנוי סביב מעיין הנשמות, וחדריו קרויים בשמות הספירות. הוא מופיע בכל הספרים."
          :"The Khan is built around the Spring of Souls, and its rooms carry the names of the sefirot. It appears in every one of the books.", "khan"):""}
    ${loreTab==="sheol"?loreSheol():""}
    ${loreTab==="angels"?loreAngels():""}
    ${loreTab==="line"?loreLine():""}
  </section>`;
}

/* The plates come first: they are the reason to be on this page, and a wall of

/* Rooms and legions are illustrated the same way the demon dynasties are: a plate
   grid, the full text behind a tap. `kind` names the folder the plates live in
   (assets/khan, assets/legions); without it the list falls back to plain text
   cards, so any future list works before its art exists. */
const PLATE_LISTS = {};
const plateSrc = (kind,k) => IMG[kind+":"+k] || `assets/${kind}/${k}.webp`;

/* Seven circles are a descent, not a table, so they get their own tab and a
   paragraph each. The plates are not drawn yet - flip SHEOL_ART once the art
   lands in assets/sheol and the same component the rooms use takes over. */
/* Seven circles are a descent, not a table. The plates are painted in a wholly
   different register from the Khan's - no frame, no ornament, no gold - so the
   grid drops its own frame too and lets them bleed. */
const SHEOL_ART = true;
function loreSheol(){
  const he=lang==="he";
  const title = he?"שבעת מדורי השאול":"The seven circles of Sheol";
  const lede  = he
    ? "השאול מחולק לשבעה מדורים, כל אחד לחטא אחר ולשליט אחר. הראשון מפריד בין עולם בני האדם לשאר, והשביעי הוא מושב המלוכה. מה שכתוב כאן הוא מה שרואים בדרך למטה."
    : "Sheol is divided into seven circles, each for a different sin and a different ruler. The first separates the human world from the rest; the seventh is the seat of the crown. What follows is what you see on the way down.";
  if(SHEOL_ART) return loreList(SHEOL, title, lede, "sheol");
  return `<div class="stack g-m">
    <div class="stack g-s">
      <h3 class="h3">${esc(title)}</h3>
      <p class="dim" style="max-width:64ch">${esc(lede)}</p>
    </div>
    <ol class="descent">
      ${SHEOL.map(c=>`<li>
        <span class="dnum num">${c.n}</span>
        <div class="stack g-xs">
          <b class="dname">${esc(L(c).n)}</b>
          <span class="dmeta">${esc(L(c).s)} · ${esc(L(c).r)}</span>
          <p class="dtext">${esc(L(c).t)}</p>
        </div>
      </li>`).join("")}
    </ol>
  </div>`;
}

function loreList(items, title, lede, kind){
  const he=lang==="he";
  PLATE_LISTS[kind] = items;
  const plates = kind && items.every(x=>x.k);
  const body = plates
    ? `<span class="hint"><span class="hintdot" aria-hidden="true">+</span>${he
         ? "לחצו על כל אחד כדי לקרוא את התיאור המלא"
         : "Tap any one of them to read the full description"}</span>
       <div class="pgrid${kind==="sheol"?" is-sheol":""}">
         ${items.map(x=>`
           <div class="dplate" role="button" tabindex="0" onclick="openPlate('${kind}','${x.k}')"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPlate('${kind}','${x.k}')}"
                aria-label="${esc(L(x).n)} - ${he?"לתיאור המלא":"read the full description"}">
             <span class="pshot">
               <img src="${plateSrc(kind,x.k)}" alt="${esc(L(x).n)}" loading="lazy" width="700" height="933">
               <span class="pmore" aria-hidden="true">+</span>
             </span>
             <span class="pname">${esc(L(x).n)}</span>

           </div>`).join("")}
       </div>`
    : `<div class="dgrid">
         ${items.map(x=>`<article class="dcard">
           <b>${esc(L(x).n)}</b>
           <p>${esc(L(x).t)}</p>
         </article>`).join("")}
       </div>`;
  return `<div class="stack g-m">
    <div class="stack g-s">
      <h3 class="h3">${esc(title)}</h3>
      <p class="dim" style="max-width:62ch">${esc(lede)}</p>
    </div>
    ${body}
  </div>`;
}

function openPlate(kind,k){
  const list=PLATE_LISTS[kind]; if(!list) return;
  const i=list.findIndex(x=>x.k===k); if(i<0) return;
  const x=list[i];
  const prev=list[(i-1+list.length)%list.length].k;
  const next=list[(i+1)%list.length].k;
  document.getElementById("bookPanel").innerHTML = `
    <button class="lb-close" onclick="closeBook()" aria-label="${lang==="he"?"סגירה":"Close"}">✕</button>

      <img class="loreplate" src="${plateSrc(kind,x.k)}" alt="${esc(L(x).n)}">
      <div class="stack g-s">
        ${L(x).s?`<span class="eyebrow">${esc(L(x).s)} · ${esc(L(x).r)}</span>`:""}

        <p>${esc(L(x).t)}</p>
        <span class="fnav">
          <button onclick="openPlate('${kind}','${prev}')">‹</button>
          <span class="dim num">${i+1} / ${list.length}</span>
          <button onclick="openPlate('${kind}','${next}')">›</button>
        </span>
      </div>
    </div>`;
  document.getElementById("bookLb").dataset.open="true";
  document.body.style.overflow="hidden";
}

function loreAngels(){
  const he=lang==="he";
  return `<div class="stack g-m">
    <div class="stack g-s">
      <h3 class="h3">${he?"מי מי בחאן":"Who is who at the Khan"}</h3>
      <p class="dim" style="max-width:62ch">${he

        <p>${esc(L(a).t)}</p>
      </article>`).join("")}
    </div>
  </div>`;
}

function loreLine(){
  const he=lang==="he";
  return `<div class="stack g-m">
    <div class="stack g-s">

      <p class="dim" style="max-width:64ch">${he

      <span class="hint"><span class="hintdot" aria-hidden="true">+</span>${he

    </div>
    ${LORE_ERAS.map(era=>`

        <ol class="gens">
          ${LINEAGE.filter(g=>g.e===era.k).map(g=>`<li role="button" tabindex="0"
              onclick="openGen(${g.i})"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGen(${g.i})}"
              aria-label="${esc(L(g).n)} - ${he?"לדיוקן המלא":"see the full portrait"}">
            <span class="gnum num">${g.i}</span>
            ${genHas(g.i)
              ? `<span class="gshot"><img src="${genSrc(g.i)}" alt="${esc(L(g).n)}" loading="lazy" width="700" height="933"></span>`
              : `<span class="gshot is-empty">${he?"בקרוב":"soon"}</span>`}
            <div class="gbody">
              <b>${esc(L(g).n)}${g.y?` <span class="gyear num">${g.y}</span>`:""}</b>
              <p>${esc(L(g).t)}</p>
            </div>
          </li>`).join("")}
        </ol>
      </div>`).join("")}
  </div>`;
}

/* One generation, opened full size. Prev/next walk the whole line of 33 rather
   than the era, so the reader can travel eight hundred years without closing it. */
function openGen(i){
  const g = LINEAGE.find(x=>x.i===i); if(!g) return;
  const he = lang==="he";
  const idx = LINEAGE.indexOf(g);
  const prev = LINEAGE[(idx-1+LINEAGE.length)%LINEAGE.length].i;
  const next = LINEAGE[(idx+1)%LINEAGE.length].i;
  const era = LORE_ERAS.find(e=>e.k===g.e);
  document.getElementById("bookPanel").innerHTML = `
    <button class="lb-close" onclick="closeBook()" aria-label="${he?"סגירה":"Close"}">✕</button>
    <div class="loreview">
      ${genHas(i)
        ? `<img class="loreplate" src="${genSrc(i)}" alt="${esc(L(g).n)}">`
        : ""}
      <div class="stack g-s">
        <span class="eyebrow">${he?`דור ${g.i}`:`Generation ${g.i}`}${era?" · "+esc(L(era).n):""}</span>
        <h3 class="h3">${esc(L(g).n)}${g.y?` <span class="gyear num">${g.y}</span>`:""}</h3>
        <p>${esc(L(g).t)}</p>
        ${genHas(i)?"":`<p class="dim">${he?"הדיוקן של הדור הזה עוד לא מוכן, ויעלה לכאן בקרוב.":"This generation's portrait is not ready yet, and will appear here soon."}</p>`}
        <span class="fnav">
          <button onclick="openGen(${prev})" aria-label="${he?"הקודם":"Previous"}">‹</button>
          <span class="dim num">${idx+1} / ${LINEAGE.length}</span>
          <button onclick="openGen(${next})" aria-label="${he?"הבא":"Next"}">›</button>
        </span>
      </div>
    </div>`;
  document.getElementById("bookLb").dataset.open="true";
  document.body.style.overflow="hidden";
}

/* ---------- ACCESSIBILITY ---------- */
/* Kept outside render(): these settings belong to the reader and their browser,
   not to the page being shown, so they survive every navigation. */
const A11Y_SIZES = {normal:"100%", large:"115%", xlarge:"132%"};
let a11y = {size:"normal", contrast:"normal", motion:"on", open:false};

function a11yLoad(){
  try{
    const saved = JSON.parse(localStorage.getItem("nbs_a11y")||"null");
    if(saved) a11y = Object.assign(a11y, saved, {open:false});
  }catch(e){}
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) a11y.motion="off";
  a11yApply();
}
function a11ySave(){ try{ localStorage.setItem("nbs_a11y", JSON.stringify({size:a11y.size,contrast:a11y.contrast,motion:a11y.motion})); }catch(e){} }
function a11yApply(){
  document.documentElement.style.fontSize = A11Y_SIZES[a11y.size] || "100%";
  document.body.dataset.contrast = a11y.contrast;
  document.body.dataset.motion   = a11y.motion;
  if(a11y.motion==="off"){ if(skyRAF) cancelAnimationFrame(skyRAF); if(starRAF) cancelAnimationFrame(starRAF); }
  else if(view==="home") startSky();
  a11yPanel();
  fitNav();                      /* bigger labels may no longer fit on one row */
}
function a11ySet(k,v){ a11y[k]=v; a11ySave(); a11yApply(); }
function toggleA11y(){ a11y.open=!a11y.open; a11yPanel(); }
function a11yReset(){ a11y={size:"normal",contrast:"normal",motion:"on",open:true}; a11ySave(); a11yApply(); }

function a11yPanel(){
  const el=document.getElementById("a11y"); if(!el) return;
  const he=lang==="he";
  el.dataset.open = a11y.open ? "true" : "false";
  const sizes=[["normal",he?"רגיל":"Normal"],["large",he?"גדול":"Large"],["xlarge",he?"ענק":"Largest"]];
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:.8rem">
      <h4 style="margin-inline-end:auto">${he?"נגישות":"Accessibility"}</h4>
      <button class="chip" onclick="toggleA11y()" aria-label="${he?"סגירה":"Close"}">✕</button>
    </div>
    <div class="grp">
      <span class="lbl">${he?"גודל הטקסט":"Text size"}</span>
      <div class="row">${sizes.map(([k,n])=>
        `<button class="opt" data-on="${a11y.size===k}" onclick="a11ySet('size','${k}')">${esc(n)}</button>`).join("")}</div>
    </div>
    <div class="grp">
      <button class="sw" data-on="${a11y.contrast==="high"}" onclick="a11ySet('contrast','${a11y.contrast==="high"?"normal":"high"}')">
        <span>${he?"ניגודיות גבוהה":"High contrast"}</span><i>${a11y.contrast==="high"?(he?"פועל":"On"):(he?"כבוי":"Off")}</i>
      </button>
      <button class="sw" data-on="${a11y.motion==="off"}" onclick="a11ySet('motion','${a11y.motion==="off"?"on":"off"}')">
        <span>${he?"עצירת התנועה ברקע":"Stop background motion"}</span><i>${a11y.motion==="off"?(he?"פועל":"On"):(he?"כבוי":"Off")}</i>
      </button>
    </div>
    <button class="btn btn-sm btn-quiet" onclick="a11yReset()">${he?"איפוס להגדרות ברירת המחדל":"Reset to defaults"}</button>`;

/* ---------- READER FORMS ---------- */
/* Three forms, one pipe: the readers' list on the quiz result screen, and a
   review and a personal letter on the reviews page. The site is static, so
   the posts go to a Google Apps Script - a second one, separate from the quiz
   counter, so neither can break the other. Until FORMS_API is filled in every
   form falls back to a prefilled email the reader sends from their own app. */

const FORM_ST  = {};        /* idle | sending | done | mail | err, per form */
const FORM_ERR = {};
const FORM_VAL = {};        /* typed text survives a re-render */
const fv    = k => FORM_VAL[k] || "";
function fset(k,v){ FORM_VAL[k]=v; }
function fclear(keys){ keys.forEach(k=>delete FORM_VAL[k]); }
const okMail = s => /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(s);

function formMailto(subject, lines){
  return `mailto:${FORMS_EMAIL}?cc=${encodeURIComponent(FORMS_EMAIL_CC)}`
       + `&subject=${encodeURIComponent(subject)}`
       + `&body=${encodeURIComponent(lines.filter(Boolean).join("\n"))}`;
}
async function formPost(kind, data){
  if(!FORMS_API) return "mail";
  const r = await fetch(FORMS_API, {method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},   /* text/plain avoids a CORS preflight Apps Script cannot answer */
    body: JSON.stringify(Object.assign({kind, lang, at:new Date().toISOString()}, data))});
  if(!r.ok) throw new Error("bad status");
  return "sent";
}
/* One path for all three: validate, send, then say what happened. */
async function formSubmit(form, data, subject, lines, fields){
  FORM_ERR[form]=""; FORM_ST[form]="sending"; render();
  try{
    const how = await formPost(form, data);
    if(how==="mail") location.href = formMailto(subject, lines);
    FORM_ST[form] = how==="mail" ? "mail" : "done";
    fclear(fields);
  }catch(e){
    FORM_ST[form]="err";
    FORM_ERR[form] = lang==="he"
      ? "משהו נתקע בדרך. אפשר לנסות שוב, או לכתוב ישירות ל־" + FORMS_EMAIL
      : "Something got stuck on the way. Try again, or write to " + FORMS_EMAIL;
  }
  render();
}

/* --- the readers' list, under a quiz result --- */
const LEAD_FIELDS = ["ld-name","ld-mail","ld-tel"];
function sendLead(){
  const he=lang==="he";
  if(fv("ld-hp")) return;                      /* a bot filled the hidden field */
  const name=fv("ld-name").trim(), mail=fv("ld-mail").trim(), tel=fv("ld-tel").trim();
  if(!mail && !tel){
    FORM_ERR.lead = he ? "צריך מייל או טלפון - אחד מהם מספיק." : "Leave an email or a phone number - one is enough.";
    render(); return;
  }
  if(mail && !okMail(mail)){
    FORM_ERR.lead = he ? "כתובת המייל לא נראית תקינה." : "That email address doesn't look right.";
    render(); return;
  }
  /* the placement keeps its own state, so read the result from whichever ran */
  const isLeg = qz.quiz==="legions";
  const out = isLeg ? lq.out : qz.out;
  const Q = (!isLeg && qz.quiz) ? (QUIZZES[qz.quiz]||null) : null;
  const res = isLeg
    ? (out ? Gx(lang==="he" ? lqRes(out.win).he.name : lqRes(out.win).en.name) : "")
    : ((Q && out) ? qzResultCopy(Q.results.find(x=>x.k===out.win)).name : "");
  const quizName = qz.quiz==="angels" ? (he?"חידון המלאכיות":"Archangel quiz")
                 : qz.quiz==="demons" ? (he?"חידון השדים":"Demon quiz")
                 : isLeg ? (he?"מבחן השיבוץ ללגיונות":"Legion placement") : "";
  formSubmit("lead",
    {name, email:mail, phone:tel, quiz:qz.quiz||"", result:out?out.win:"", resultName:res},
    he?"הרשמה לעדכונים מהאתר":"New sign-up from the site",
    [ (he?"שם: ":"Name: ")+(name||"-"),
      (he?"מייל: ":"Email: ")+(mail||"-"),
      (he?"טלפון: ":"Phone: ")+(tel||"-"),
      quizName?((he?"מהחידון: ":"From: ")+quizName+(res?" · "+res:"")):"" ],
    LEAD_FIELDS);
}

/* --- a review, and a letter to Naama --- */
const REV_FIELDS = ["rv-name","rv-book","rv-text","rv-mail"];
function sendReview(){
  const he=lang==="he";
  if(fv("rv-hp")) return;

const LET_FIELDS = ["lt-name","lt-mail","lt-text"];
function sendLetter(){
  const he=lang==="he";

/* --- small building blocks, so the three forms look like one family --- */

  return `<div class="field">

function fArea(id,label,ph,rows){
  return `<div class="field">
    <label for="${id}">${esc(label)}</label>

function fHoney(id){
  return `<input class="hp" id="${id}" tabindex="-1" autocomplete="off" aria-hidden="true" value="${esc(fv(id))}" oninput="fset('${id}',this.value)">`;

function fThanks(title,body,again,onAgain){

/* ---------- QUIZ ENGINE ---------- */
let qz = {stage:"menu", quiz:null, gender:"f", i:0, ans:[], out:null};
let qzTally = null;                      /* {angels:{k:n}, demons:{k:n}} */

/* {נקבה|זכר} inside a Hebrew string picks a side by the chosen gender */
function Gx(s){ return String(s).replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_,f,m)=> qz.gender==="f" ? f : m); }
const qtext = o => Gx(lang==="he" ? o.he : o.en);

function localTally(){
  try{ return JSON.parse(localStorage.getItem("nbs_quiz_tally")||"null"); }catch(e){ return null; }
}
function bumpLocal(quiz,k){
  try{
    const t=localTally()||{angels:{},demons:{}};
    t[quiz]=t[quiz]||{}; t[quiz][k]=(t[quiz][k]||0)+1;
    localStorage.setItem("nbs_quiz_tally", JSON.stringify(t));
    return t;
  }catch(e){ return null; }
}
async function loadTally(){
  if(!QUIZ_API){ qzTally = localTally(); return; }
  try{
    const r = await fetch(QUIZ_API, {method:"GET"});
    if(r.ok) qzTally = await r.json();
  }catch(e){ /* fall through to the local count */ }
  if(!qzTally) qzTally = localTally();      /* offline, or the counter is down */
}
async function reportResult(quiz, k){
  const local = bumpLocal(quiz,k);
  if(!QUIZ_API){ qzTally = local; render(); return; }
  try{
    const r = await fetch(QUIZ_API, {method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},   /* text/plain avoids a CORS preflight Apps Script cannot answer */
      body: JSON.stringify({quiz, result:k, gender:qz.gender, lang})});
    if(r.ok){ qzTally = await r.json(); render(); return; }
  }catch(e){ /* the quiz still works without the counter */ }
  qzTally = local; render();                /* show this device's own count instead */
}

/* Answers decide the result; the tally only breaks the tie toward whoever is rare.
   Each line is first divided by the most it could have scored, so a line that
   appears in more options does not win by arithmetic alone. */
/* The correction is a nudge, not an override: it is capped, so a clear answer
   always wins and the tally only decides results that were close anyway. */
const QZ_ALPHA = 0.5, QZ_MIN = 0.75, QZ_MAX = 1.45;
function qzJitter(k){                       /* stable per answer set - breaks exact ties evenly */
  const str = qz.quiz + "|" + qz.ans.join(",") + "|" + k;
  let h = 0;
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i))|0;
  return ((h>>>0)%1000)/1000 * 1e-3;
}
function qzScore(quiz){
  const Q=QUIZZES[quiz], keys=Q.results.map(r=>r.k);
  const raw={}, max={}; keys.forEach(k=>{raw[k]=0;max[k]=0});
  Q.qs.forEach((q,i)=>{
    const pick=q.o[qz.ans[i]];
    keys.forEach(k=>{
      if(pick) raw[k]+= (pick.w[k]||0);
      max[k]+= Math.max(...q.o.map(o=>o.w[k]||0));
    });
  });
  const norm={}; keys.forEach(k=> norm[k]= max[k] ? raw[k]/max[k] : 0);

  const tally=(qzTally&&qzTally[quiz])||{};
  const total=keys.reduce((s,k)=>s+(tally[k]||0),0);
  const target=1/keys.length;
  const adj={};
  keys.forEach(k=>{
    let f=1;
    if(total>=20){
      const share=Math.max((tally[k]||0)/total, .02);
      f=Math.min(QZ_MAX, Math.max(QZ_MIN, Math.pow(target/share, QZ_ALPHA)));
    }
    adj[k]= norm[k]*f + qzJitter(k);
  });
  const win=keys.slice().sort((a,b)=>adj[b]-adj[a])[0];
  return {win, norm, keys};
}

function setGender(g){ qz.gender=g; render(); }
function startQuiz(q){ qz.quiz=q; qz.i=0; qz.ans=[]; qz.out=null; qz.stage="run"; render(); goTop(); }
function answerQuiz(oi){
  qz.ans[qz.i]=oi;
  if(qz.i < QUIZZES[qz.quiz].qs.length-1){ qz.i++; render(); }
  else { qz.out=qzScore(qz.quiz); qz.stage="done"; render(); reportResult(qz.quiz, qz.out.win); rememberResult(qz.quiz, qz.out.win); }
  goTop();
}
function backQuiz(){ if(qz.i>0){ qz.i--; render(); goTop(); } else { qz.stage="menu"; render(); } }
function resetQuiz(){ qz.stage="menu"; qz.quiz=null; qz.out=null;
  lq={phase:"intro", line:null, i:0, ansA:[], ansB:[], fam:null, out:null};
  render(); goTop(); }
function goTop(){ const e=document.getElementById("qzTop"); if(e) e.scrollIntoView({block:"start",behavior:"instant"}); }

function qzResultImg(r){
  const key = (qz.gender==="m" && r.imgM) ? r.imgM : r.img;
  return key.startsWith("ang_") ? IMG[key] : loreSrc(key);
}
function qzResultCopy(r){
  const c = lang==="he" ? r.he[qz.gender] : r.en;
  return {name:Gx(c.name), kick:Gx(c.kick), body:Gx(c.body), traits:c.traits.map(Gx)};
}

/* ============ THE LEGION PLACEMENT (two stages) ============
   Twenty outcomes will not separate on twelve flat questions - the winner ends up
   decided by one answer. So this runs the way the Khan itself would: a general
   examination that assigns a family, then a specialist one inside that family
   only. Every answer does real work, and the reader sits an exam instead of
   filling a form. The four leadership bodies are not assignments in the books -
   they are made of the heads of other legions - so they are reachable only by a
   rare, consistent, deliberately-chosen path.                                   */
const LQ = LEGION_QUIZ;
const lqFam = k => LQ.fams.find(f=>f.k===k);
const lqRes = k => LQ.results.find(r=>r.k===k);
const lqTxt = o => Gx(lang==="he" ? o.he : o.en);
/* families and the quiz itself carry objects, not strings - name them explicitly */
const lqName = o => Gx(lang==="he" ? o.he.n : o.en.n);
const lqTitle = () => Gx(lang==="he" ? LQ.he.t : LQ.en.t);
const lqSrc = k => IMG["legions:"+k] || `assets/legions/${k}.webp`;

let lq = {phase:"intro", line:null, i:0, ansA:[], ansB:[], fam:null, out:null};

/* the reader's own last result per quiz - so the placement can start from the
   archangel line they already got, instead of asking them to remember it */
function myResults(){
  try{ return JSON.parse(localStorage.getItem("nbs_quiz_me")||"{}"); }catch(e){ return {}; }
}
function rememberResult(quiz,k){
  try{ const m=myResults(); m[quiz]=k; localStorage.setItem("nbs_quiz_me", JSON.stringify(m)); }catch(e){}
}

function startLegion(line){
  lq={phase:"a", line:line||null, i:0, ansA:[], ansB:[], fam:null, out:null};
  qz.quiz="legions"; qz.out=null; qz.stage="legion"; render(); goTop();
}
function lqIntro(){ lq.phase="intro"; qz.quiz="legions"; qz.out=null; qz.stage="legion"; render(); goTop(); }

function lqAnswer(oi){
  if(lq.phase==="a"){
    lq.ansA[lq.i]=oi;
    if(lq.i < LQ.qsA.length-1){ lq.i++; }
    else { lq.fam = lqFamWin(); lq.phase="gate"; lq.i=0; }
  } else {
    lq.ansB[lq.i]=oi;
    const n = lqQsB().length;
    if(lq.i < n-1){ lq.i++; }
    else { lq.out = lqScore(); lq.phase="done"; reportResult("legions", lq.out.win); rememberResult("legions", lq.out.win); }
  }
  render(); goTop();
}
function lqBack(){
  if(lq.phase==="b" && lq.i===0){ lq.phase="gate"; render(); goTop(); return; }
  if(lq.phase==="gate"){ lq.phase="a"; lq.i=LQ.qsA.length-1; render(); goTop(); return; }
  if(lq.i>0){ lq.i--; render(); goTop(); return; }
  lqIntro();
}
function lqGo(){ lq.phase="b"; lq.i=0; lq.ansB=[]; render(); goTop(); }

function lqFamWin(){
  const sc={}; LQ.fams.forEach(f=>sc[f.k]=0);
  LQ.qsA.forEach((q,i)=>{
    const o=q.o[lq.ansA[i]]; if(!o) return;
    for(const k in (o.w||{})) sc[k]=(sc[k]||0)+o.w[k];
  });
  /* the archangel line the reader already has tilts, it does not decide */
  const bonus = lq.line && LQ.lines[lq.line];
  if(bonus) LQ.fams.forEach(f=>{ f.legions.forEach(l=>{ if(bonus[l]) sc[f.k]+=bonus[l]*0.4; }); });
  let best=LQ.fams[0].k, bv=-1;
  LQ.fams.forEach(f=>{ if(sc[f.k]>bv){ bv=sc[f.k]; best=f.k; } });
  lq.famScore=sc; lq.famTop=bv;
  return best;
}
/* the specialist paper: the family's own questions, plus the leadership question,
   plus - only when the guards actually won - the one question that decides where */
function lqQsB(){
  const base = LQ.qsB[lq.fam].slice();
  base.push(LQ.eliteB);
  if(lq.fam==="harev" && lq.ansB.length>=LQ.qsB.harev.length){
    const g=lqGuardLead(); if(g) base.push(LQ.guardQ);
  }
  return base;
}
/* are the four regional watches leading, before the region question is asked? */
function lqGuardLead(){
  const sc=lqLegionScores(false);
  const guards=["north","south","east","west"];
  const gTop=Math.max(...guards.map(k=>sc[k]||0));
  const others=Math.max(...["hayalim","kele"].map(k=>sc[k]||0));
  return gTop>=others;
}
function lqLegionScores(withGuardQ){
  const fam=lqFam(lq.fam), sc={}; fam.legions.forEach(k=>sc[k]=0);
  const qs=LQ.qsB[lq.fam];
  qs.forEach((q,i)=>{
    const o=q.o[lq.ansB[i]]; if(!o) return;
    for(const k in (o.w||{})) if(k in sc) sc[k]+=o.w[k];
  });
  if(withGuardQ){
    const idx=qs.length+1;                        /* after the leadership question */
    const o=LQ.guardQ.o[lq.ansB[idx]];
    if(o) for(const k in o.w) if(k in sc) sc[k]+=o.w[k];
  }
  return sc;
}
function lqEliteCount(){
  let n=0;
  LQ.qsA.forEach((q,i)=>{ const o=q.o[lq.ansA[i]]; if(o&&o.e) n++; });
  const qs=LQ.qsB[lq.fam];
  const o=LQ.eliteB.o[lq.ansB[qs.length]];
  if(o&&o.e) n+=2;                                 /* the second one weighs double */
  return n;
}
function lqScore(){
  const sc=lqLegionScores(true);
  const fam=lqFam(lq.fam);
  const keys=fam.legions.slice();
  /* the guards share their weights, so without the region question they tie -
     resolve to the one the region question chose, or the first if it never ran */
  let order=keys.slice().sort((a,b)=>(sc[b]||0)-(sc[a]||0));
  let win=order[0];

  /* the rare path: a consistent family AND the leadership answers, twice */
  const famTotal=Object.values(lq.famScore||{}).reduce((s,v)=>s+v,0)||1;
  const share=(lq.famTop||0)/famTotal;
  const rare = lqEliteCount()>=3 && share>=0.5;
  if(rare) win=fam.elite;

  const max=Math.max(...keys.map(k=>sc[k]||0))||1;
  const norm={}; keys.forEach(k=> norm[k]=(sc[k]||0)/max);
  return {win, keys:order, norm, rare, fam:lq.fam};
}

/* ============ SHARING THE RESULT AS A PICTURE ============
   WhatsApp shows a preview image only for a URL whose own page carries it, and
   every result here lives behind the same address - so a link can never show
   Gabi. What CAN carry the picture is the share sheet itself: navigator.share
   accepts real files, and on a phone - which is where WhatsApp actually is -
   that puts the plate straight into the message. The card is drawn here on a
   canvas so it arrives titled and branded rather than as a bare crop, and it is
   built the moment the result appears, because iOS refuses a share that was not
   started by the tap itself. Desktop, where files are not shareable, falls back
   to the plain wa.me link exactly as before. */
const SHARE_W=1080, SHARE_H=1350;
let shareCard = {sig:null, file:null, url:null, building:false};

function shareSig(){
  const l=lang+"|"+qz.gender;
  if(qz.quiz==="legions" && lq.out) return "legions|"+lq.out.win+"|"+l;
  if(qz.out && qz.quiz && QUIZZES[qz.quiz]) return qz.quiz+"|"+qz.out.win+"|"+l;
  return null;
}
function shareSubject(){
  if(qz.quiz==="legions" && lq.out){
    const r=lqRes(lq.out.win);
    return {src:lqSrc(r.k), name:Gx(lang==="he"?r.he.name:r.en.name),
            kick:Gx(lang==="he"?r.he.kick:r.en.kick),
            tag:lang==="he"?"מבחן השיבוץ ללגיונות":"The legion placement"};
  }
  if(!qz.out || !qz.quiz || !QUIZZES[qz.quiz]) return null;
  const r=QUIZZES[qz.quiz].results.find(x=>x.k===qz.out.win); if(!r) return null;
  const c=qzResultCopy(r);
  return {src:qzResultImg(r), name:c.name, kick:c.kick,
          tag: lang==="he" ? (qz.quiz==="angels"?"חידון המלאכיות":"חידון השדים")
                           : (qz.quiz==="angels"?"The archangel quiz":"The demon quiz")};
}
function loadImg(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
async function buildShareCard(){
  const sig=shareSig(); if(!sig || shareCard.sig===sig || shareCard.building) return;
  const subj=shareSubject(); if(!subj) return;
  shareCard.building=true;
  try{
    const img=await loadImg(subj.src);
    const c=document.createElement("canvas"); c.width=SHARE_W; c.height=SHARE_H;
    const x=c.getContext("2d");
    x.fillStyle="#100E0C"; x.fillRect(0,0,SHARE_W,SHARE_H);

    /* the plate, contained inside the upper area, never cropped */
    const box={x:70,y:70,w:SHARE_W-140,h:SHARE_H-400};
    const sc=Math.min(box.w/img.width, box.h/img.height);
    const w=img.width*sc, h=img.height*sc;
    const ix=box.x+(box.w-w)/2, iy=box.y+(box.h-h)/2;
    x.drawImage(img, ix, iy, w, h);
    x.strokeStyle="rgba(198,164,92,.55)"; x.lineWidth=2;
    x.strokeRect(ix+1, iy+1, w-2, h-2);

    const rtl = lang==="he";
    x.textAlign = rtl ? "right" : "left";
    x.direction  = rtl ? "rtl" : "ltr";
    const tx = rtl ? SHARE_W-70 : 70;
    let ty = box.y+box.h+95;

    x.fillStyle="#C6A45C";
    x.font=`600 40px ${rtl?'"Frank Ruhl Libre",':''}"Cormorant Garamond",Georgia,serif`;
    x.fillText(subj.tag, tx, ty); ty+=86;

    x.fillStyle="#EFE9DE";
    x.font=`700 78px ${rtl?'"Frank Ruhl Libre",':''}"Cormorant Garamond",Georgia,serif`;
    x.fillText(subj.name, tx, ty); ty+=62;

    x.fillStyle="#A8A190";
    x.font=`400 34px "Assistant",system-ui,sans-serif`;
    x.fillText(subj.kick, tx, ty);

    x.textAlign = rtl ? "left" : "right";
    x.fillStyle="#C6A45C"; x.font=`600 34px "Assistant",system-ui,sans-serif`;
    x.fillText("nbshira.com", rtl?70:SHARE_W-70, SHARE_H-58);

    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
    if(!blob) throw 0;
    if(shareCard.url) URL.revokeObjectURL(shareCard.url);
    shareCard.file=new File([blob], "nbshira.jpg", {type:"image/jpeg"});
    shareCard.url=URL.createObjectURL(blob);
    shareCard.sig=sig;
    const b=document.getElementById("waBtn"); if(b) b.dataset.card="1";
  }catch(e){ /* no card - the link still works */ }
  shareCard.building=false;
}
async function shareResult(el){
  const wa=el.dataset.wa;
  const f=shareCard.file;
  if(f && navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], text:el.dataset.share}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  window.open(wa,"_blank","noopener");
}

/* Copying is the quiet second option next to WhatsApp - for anyone who wants
   to paste the result somewhere else. The button says so itself, briefly. */
function qzCopy(el){
  const back = el.textContent;
  const said = () => { el.textContent = lang==="he" ? "הועתק" : "Copied";
                       setTimeout(()=>{ el.textContent = back; }, 1800); };
  try{ navigator.clipboard.writeText(el.dataset.share).then(said, said); }
  catch(e){ said(); }
}

/* the three quizzes report into one tally; the placement keeps its results in
   LEGION_QUIZ rather than QUIZZES, so the counter asks for names through here */
function qzRows(q){
  if(q==="legions") return LQ.results.map(r=>({k:r.k, name:Gx(lang==="he"?r.he.name:r.en.name)}));
  return QUIZZES[q].results.map(r=>({k:r.k, name:qzResultCopy(r).name}));
}
const QZ_ALL = ["angels","demons","legions"];

function qzCounter(only){
  const he=lang==="he";
  const t=qzTally; if(!t) return "";
  const quizzes = only ? [only] : QZ_ALL;
  const shared = !!QUIZ_API;          /* a live tally from everyone, or just this browser */
  const blocks = quizzes.map(q=>{
    const rows=qzRows(q), tal=t[q]||{};
    const total=rows.reduce((s,r)=>s+(tal[r.k]||0),0);
    if(!total) return "";

    /* say plainly whose results these are - a small sample reads as "only me" otherwise */
    const head = he
      ? (shared ? (total===1 ? "אדם אחד סיים את החידון הזה עד עכשיו" : total+" אנשים סיימו את החידון הזה")
                : (total===1 ? "תוצאה אחת במכשיר הזה" : total+" תוצאות במכשיר הזה"))
      : (shared ? (total===1 ? "One person has taken this one so far" : total+" people have taken this one")
                : (total===1 ? "1 result on this device" : total+" results on this device"));

    const early = shared && total<8
      ? (he ? "עדיין מוקדם. ככל שיסיימו עוד, ההתפלגות תתייצב."
            : "Early days. The split will settle as more people finish.")
      : "";

    const eyebrow = q==="angels" ? (he?"מי עבר כאן מלמעלה":"Who came through from above")
                  : q==="demons" ? (he?"ומי מלמטה":"And from below")
                  : (he?"ואיך נפלו השיבוצים":"And how the placements fell");
    return `<div class="stack g-xs">
      <span class="eyebrow">${esc(eyebrow)}</span>
      <b class="qtotal">${esc(head)}</b>
      <div class="qtal">
        ${rows.map(r=>{
          const n=tal[r.k]||0, p=total?Math.round(n/total*100):0;
          return `<div class="qtrow">
            <span>${esc(r.name)}</span>
            <i><b style="inline-size:${p}%"></b></i>
            <span class="qtn num">${n}</span>
          </div>`;
        }).join("")}
      </div>
      ${early?`<span class="dim" style="font-size:.78rem">${esc(early)}</span>`:""}
    </div>`;}).filter(Boolean).join("");
  if(!blocks) return "";

  return `<div class="qcounter${quizzes.length===1?" is-one":""}">${blocks}</div>`;
}

/* The running total sits at the top of the quiz page, not buried under the
   breakdown - it is the number people actually want, and seeing that a few
   hundred readers already went through is itself the invitation. It counts
   quizzes answered rather than heads, because plenty of readers do all three. */
function qzGrand(){
  const he=lang==="he", t=qzTally; if(!t) return "";
  const shared=!!QUIZ_API;
  const all = QZ_ALL.reduce((s,q)=>{
    const tal=t[q]||{};
    return s + qzRows(q).reduce((n,r)=>n+(tal[r.k]||0),0);
  },0);
  if(!all) return "";
  const txt = he
    ? (shared ? `עד עכשיו נענו כאן ${all} חידונים` : `${all} חידונים במכשיר הזה`)
    : (shared ? `${all} quizzes answered here so far` : `${all} quizzes on this device`);
  return `<p class="qgrand">${esc(txt)}</p>`;
}

/* ---------- SKY CANVAS ---------- */
let skyRAF=null;
/* A quiet starfield behind the whole page. Positions are seeded, so the sky is
   the same on every visit; only the twinkle moves. */
let starRAF=null;
function startStars(){
  const cv=document.getElementById("stars"); if(!cv) return;
  if(a11y.motion==="off") return;
  const ctx=cv.getContext("2d"); let w,h,stars=[];
  let seed=20240;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  function size(){
    const dpr=Math.min(devicePixelRatio||1,2);
    w=innerWidth; h=innerHeight;
    cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    seed=20240;
    const n=Math.round(w*h/5200);
    stars=Array.from({length:n},()=>({
      x:rnd()*w, y:rnd()*h, r:rnd()*1.05+.22,
      a:rnd()*.5+.14, p:rnd()*Math.PI*2, s:rnd()*.5+.25
    }));
  }
  function paint(ts){
    ctx.clearRect(0,0,w,h);
    for(const st of stars){
      const tw = ts==null ? 1 : (.62+.38*Math.sin(ts/2200*st.s+st.p));
      ctx.globalAlpha=st.a*tw;
      ctx.fillStyle = st.r>1 ? "#E4C889" : "#DCE4F2";
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(ts){ paint(ts); starRAF=requestAnimationFrame(loop); }
  size();
  if(still) paint(null); else { cancelAnimationFrame(starRAF); starRAF=requestAnimationFrame(loop); }
  addEventListener("resize",()=>{ size(); if(still) paint(null); },{passive:true});
}

function startSky(){
  const cv=document.getElementById("sky"); if(!cv) return;
  if(a11y.motion==="off") return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx=cv.getContext("2d"); let w,h,parts=[];
  function size(){
    const r=cv.getBoundingClientRect(); const dpr=Math.min(devicePixelRatio||1,2);
    w=cv.width=r.width*dpr; h=cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    w=r.width; h=r.height;
    parts=Array.from({length:Math.round(w*h/9000)},()=>({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5+.25,
      s:Math.random()*.14+.03, a:Math.random()*.5+.12, p:Math.random()*Math.PI*2
    }));
  }
  size(); addEventListener("resize",()=>{ size(); skyCache=null; },{passive:true});
  const css=getComputedStyle(document.documentElement);
  function frame(ts){
    const gold=css.getPropertyValue("--gold-soft").trim()||"#E4C889";
    ctx.clearRect(0,0,w,h);
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,css.getPropertyValue("--sky-top").trim());
    g.addColorStop(.44,css.getPropertyValue("--sky-mid").trim());
    g.addColorStop(.74,css.getPropertyValue("--sky-low").trim());
    g.addColorStop(.93,css.getPropertyValue("--sky-horizon").trim());
    g.addColorStop(1,css.getPropertyValue("--sky-low").trim());
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    parts.forEach(p=>{
      p.y-=p.s; p.x+=Math.sin((ts/2600)+p.p)*.12;
      if(p.y<-4){p.y=h+4;p.x=Math.random()*w;}
      ctx.globalAlpha=p.a*(.55+.45*Math.sin(ts/1400+p.p));
      ctx.fillStyle=gold; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.drawImage(buildSkyline(w,h,css), 0, 0, w, h);
    skyRAF=requestAnimationFrame(frame);
  }
  cancelAnimationFrame(skyRAF); skyRAF=requestAnimationFrame(frame);
}

/* A Levantine roofline, drawn the way you actually see one at dusk: a hazy far
   ridge, a nearer row of blocks in front of it, and on top of those the clutter
   that makes an Israeli roof an Israeli roof - solar tanks, aerials, parapets,
   a stray dome and a minaret. Deterministic, so it is the same city every load.

   The whole thing is baked once into an offscreen canvas and blitted each
   frame; only the sky gradient and the drifting motes are redrawn. */
let skyCache=null, skyCacheKey="";

function mulberry(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* One row of buildings. Widths and heights vary, roofs are never perfectly
   level, and every so often a landmark interrupts the blocks. */
function skylineRow(ctx,w,base,scale,seed,opts){
  const rnd=mulberry(seed);
  const {fill,alpha,clutter,windows,glowColor,glowAlpha}=opts;
  ctx.save();
  ctx.globalAlpha=alpha;
  let x=-20*scale;
  const tops=[];
  while(x < w+20*scale){
    const bw = (26 + rnd()*54) * scale;
    let bh = (34 + rnd()*72) * scale;
    const roll = rnd();
    const kind = roll>.955 ? "minaret" : roll>.90 ? "dome" : "flat";
    if(kind==="minaret") bh *= 1.5;
    const y = base - bh;

    ctx.beginPath();
    ctx.moveTo(x, base);
    if(kind==="dome"){
      const r=bw*.42, cx=x+bw/2;
      ctx.lineTo(x, y+r*.5);
      ctx.arc(cx, y+r*.5, r, Math.PI, 0);
      ctx.lineTo(x+bw, base);
    } else if(kind==="minaret"){
      const cx=x+bw/2, tw=bw*.16, shoulder=base-bh*.42;
      ctx.lineTo(x, shoulder);
      ctx.lineTo(cx-tw, shoulder);
      ctx.lineTo(cx-tw, y+6*scale);
      ctx.lineTo(cx-tw*1.7, y+6*scale);            /* the balcony ring */
      ctx.lineTo(cx-tw*1.7, y+2*scale);
      ctx.lineTo(cx-tw, y+2*scale);
      ctx.lineTo(cx, y-9*scale);                   /* the cap */
      ctx.lineTo(cx+tw, y+2*scale);
      ctx.lineTo(cx+tw*1.7, y+2*scale);
      ctx.lineTo(cx+tw*1.7, y+6*scale);
      ctx.lineTo(cx+tw, y+6*scale);
      ctx.lineTo(cx+tw, shoulder);
      ctx.lineTo(x+bw, shoulder);
      ctx.lineTo(x+bw, base);
    } else {
      /* a roofline that wanders a little, and a parapet on some of them */
      const step=Math.max(3*scale,bw/4);
      ctx.lineTo(x, y + (rnd()-.5)*2*scale);
      for(let sx=x+step; sx<x+bw; sx+=step) ctx.lineTo(sx, y + (rnd()-.5)*2.2*scale);
      ctx.lineTo(x+bw, y + (rnd()-.5)*2*scale);
      if(rnd()>.55){                                /* parapet wall */
        ctx.lineTo(x+bw, y-2.6*scale);
        ctx.lineTo(x+bw*.86, y-2.6*scale);
        ctx.lineTo(x+bw*.86, y);
      }
      ctx.lineTo(x+bw, base);
    }
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();

    if(clutter && kind==="flat") skylineClutter(ctx,x,y,bw,scale,rnd,fill);
    if(windows && kind!=="minaret") tops.push([x,y,bw,bh]);
    x += bw + rnd()*5*scale;
  }

  /* dusk caught along the top edge, so the shapes are not flat cut-outs */
  if(glowColor){
    ctx.globalAlpha=glowAlpha;
    ctx.strokeStyle=glowColor; ctx.lineWidth=1;
    ctx.stroke();
  }
  ctx.restore();
  return tops;
}

/* What sits on an Israeli roof: solar water tanks, aerials, a satellite dish. */
function skylineClutter(ctx,x,y,bw,scale,rnd,fill){
  ctx.fillStyle=fill; ctx.strokeStyle=fill;
  ctx.lineWidth=Math.max(.7,1.1*scale);
  const n=Math.floor(rnd()*3);
  for(let i=0;i<n;i++){
    const cx = x + 4*scale + rnd()*(bw-8*scale);
    const pick = rnd();
    if(pick<.42){                                   /* dud shemesh: tank + panel */
      const tw=7*scale, th=3.4*scale;
      ctx.fillRect(cx-tw/2, y-th-1.4*scale, tw, th);
      ctx.beginPath();
      ctx.moveTo(cx-tw*.8, y);
      ctx.lineTo(cx+tw*.5, y-3.2*scale);
      ctx.lineTo(cx+tw*.8, y-2.4*scale);
      ctx.lineTo(cx-tw*.5, y+.4*scale);
      ctx.closePath(); ctx.fill();
    } else if(pick<.72){                            /* aerial */
      const ah=(5+rnd()*8)*scale;
      ctx.beginPath();
      ctx.moveTo(cx,y); ctx.lineTo(cx,y-ah);
      ctx.moveTo(cx-2.2*scale,y-ah*.55); ctx.lineTo(cx+2.2*scale,y-ah*.55);
      ctx.moveTo(cx-1.6*scale,y-ah*.8);  ctx.lineTo(cx+1.6*scale,y-ah*.8);
      ctx.stroke();
    } else if(pick<.88){                            /* satellite dish */
      const r=2.6*scale;
      ctx.beginPath(); ctx.arc(cx,y-r,r,Math.PI*.15,Math.PI*1.15); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx,y); ctx.lineTo(cx,y-r); ctx.stroke();
    } else {                                        /* a box, a stairwell head */
      ctx.fillRect(cx-3*scale, y-4*scale, 6*scale, 4*scale);
    }
  }
}

function buildSkyline(w,h,css){
  const key = Math.round(w)+"x"+Math.round(h)+"|"+css.getPropertyValue("--city").trim();
  if(skyCache && skyCacheKey===key) return skyCache;
  const dpr=Math.min(devicePixelRatio||1,2);
  const cv=document.createElement("canvas");
  cv.width=Math.max(1,Math.round(w*dpr)); cv.height=Math.max(1,Math.round(h*dpr));
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);

  const city   = css.getPropertyValue("--city").trim()      || "#05070F";
  const gold   = css.getPropertyValue("--gold").trim()      || "#C9A356";
  const horizon= css.getPropertyValue("--sky-horizon").trim()|| "#7E4029";
  const scale  = Math.max(.75, Math.min(1.6, w/1100));
  const base   = h + 2;

  /* the far ridge: lower, softer, half dissolved in the haze */
  skylineRow(c, w, base - 10*scale, scale*.72, 9137,
    {fill:city, alpha:.45, clutter:false, windows:false,
     glowColor:horizon, glowAlpha:.30});

  /* haze between the two rows - what makes distance read as distance */
  const haze=c.createLinearGradient(0, base-105*scale, 0, base);
  haze.addColorStop(0,"rgba(0,0,0,0)");
  haze.addColorStop(1, horizon);
  c.save(); c.globalAlpha=.30; c.fillStyle=haze;
  c.fillRect(0, base-105*scale, w, 105*scale); c.restore();

  /* the near row, with everything on its roofs */
  const tops = skylineRow(c, w, base, scale, 4471,
    {fill:city, alpha:1, clutter:true, windows:true,
     glowColor:gold, glowAlpha:.42});

  /* a few lit windows - sparse, warm, never in rows */
  const rnd=mulberry(2213);
  c.save();
  tops.forEach(([bx,by,bw,bh])=>{
    const n=Math.floor(rnd()*4);
    for(let i=0;i<n;i++){
      const wx = bx + 4*scale + rnd()*(bw-8*scale);
      const wy = by + 7*scale + rnd()*Math.max(1,(bh-12*scale));
      c.globalAlpha = .12 + rnd()*.3;
      c.fillStyle = rnd()>.35 ? "#E9C27A" : "#B9D2E8";
      c.fillRect(wx, wy, 1.5*scale, 2.1*scale);
    }
  });
  c.restore();

  skyCache=cv; skyCacheKey=key;
  return cv;
}

/* ---------- RENDER ---------- */
function render(){
  const d=t();
  document.documentElement.setAttribute("dir",d.dir);
  document.documentElement.setAttribute("lang",lang);
  document.getElementById("brandName").textContent=d.brand;
  document.getElementById("brandSub").textContent=d.brandSub;
  document.getElementById("langBtn").textContent=d.lang;

  document.getElementById("nav").innerHTML = VIEWS.map(v=>
    `<button onclick="go('${v}')" ${v===view?'aria-current="page"':""}>${esc(d.nav[v])}</button>`).join("");

  const map={home:vHome,author:vAuthor,worlds:vWorlds,books:vBooks,lore:vLore,quiz:vQuiz,field:vField,reviews:vReviews,shop:vShop,events:vEvents,speaking:vSpeaking,community:vCommunity,rights:vRights,privacy:vPrivacy,terms:vTerms};
  const app=document.getElementById("app");
  app.innerHTML=`<div class="view">${(map[view]||vHome)()}</div>` + footEl();
  applySeo(view);
  if(view==="home" && a11y.motion!=="off") startSky(); else if(skyRAF) cancelAnimationFrame(skyRAF);
  renderCart(); syncCount(); fitNav();
  if(view==="quiz") buildShareCard();
}
