<title>זירת הפנטזיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Suez+One&display=swap" rel="stylesheet">
<style>
:root{--t0:#1c7ed6;--t1:#e03131;--t0i:#fff;--t1i:#fff;--bg:#0c0718;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--txt:#f4f6fb;--muted:#a3acc2;--gold:#ffc83d;--orange:#b57bff;--court:clamp(160px,26vh,270px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Rubik,system-ui,sans-serif;color:var(--txt);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.f0{fill:var(--t0)}.f1{fill:var(--t1)}

/* ---------- app shell ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:
 radial-gradient(ellipse 55% 55% at 80% -15%,color-mix(in srgb,var(--t0) 38%,transparent),transparent 70%),
 radial-gradient(ellipse 55% 55% at 20% -15%,color-mix(in srgb,var(--t1) 38%,transparent),transparent 70%),
 radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 9%,#fff9,transparent),radial-gradient(1.5px 1.5px at 44% 26%,#fffa,transparent),radial-gradient(1px 1px at 88% 31%,#fff7,transparent),radial-gradient(1px 1px at 28% 40%,#fff6,transparent),
 linear-gradient(#1c1040,#0c0718 70%)}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px 4px;flex:none}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:36px;height:36px;flex:none}
.logo h1{margin:0;font-family:'Suez One';font-weight:400;font-size:clamp(20px,2.3vw,32px);line-height:1;background:linear-gradient(180deg,#fff 30%,#ffc98a);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.bday{font-weight:800;font-size:clamp(11px,1vw,14px);padding:5px 12px;border-radius:999px;background:linear-gradient(90deg,#ff3d77,#ffb020);color:#2a0a00;white-space:nowrap}
.tools{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.ib{height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.ib:hover{background:rgba(255,255,255,.14)}
.ib.on{background:rgba(255,122,26,.25);border-color:var(--orange)}
.conn{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.conn.on{background:rgba(47,210,122,.18);color:#7dffb4}
.stage{flex:1;min-height:0;overflow:auto;padding:4px 16px 10px;display:flex;justify-content:center}
.view{width:min(1320px,100%);display:none;flex-direction:column;gap:12px}
.view.on{display:flex}

/* ---------- setup ---------- */
.hero{text-align:center}
.hero .k{color:var(--muted);font-weight:700;letter-spacing:1px}
.hero .t{font-family:'Suez One';font-size:clamp(34px,5vw,64px);line-height:1.05;background:linear-gradient(180deg,#fff,#ffb35c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,122,26,.35))}
.hero .s{font-size:clamp(15px,1.6vw,20px);font-weight:700}
.teams-setup{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.vs{font-family:'Suez One';font-size:clamp(28px,3.5vw,48px);color:var(--gold);text-shadow:0 0 20px rgba(255,200,61,.5)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;border-top:6px solid var(--c);display:flex;flex-direction:column;gap:10px}
.tcard .h{font-weight:800;color:var(--muted);font-size:14px}
.tname{width:100%;font-size:24px;font-weight:800;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none}
.tname:focus{border-color:var(--c)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.25);background:var(--s);position:relative;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--s)}
.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden;cursor:pointer}
.sw.custom input{position:absolute;inset:-4px;opacity:0;width:140%;height:140%;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.fld{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.fld input{background:rgba(0,0,0,.25);border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700;width:130px}
.big{font-family:'Suez One';font-size:clamp(20px,2vw,28px);padding:12px 32px;border-radius:999px;border:0;color:#2a0f00;background:linear-gradient(180deg,#ffb35c,#ff7a1a);box-shadow:0 8px 30px rgba(255,122,26,.45),inset 0 -4px 0 rgba(0,0,0,.18)}
.big:hover{filter:brightness(1.08)}
.ghost{font-weight:800;font-size:15px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#fff}
.phone-tip{font-size:14px;color:var(--muted);text-align:center;line-height:1.6}
.phone-tip b{color:#fff}

/* ---------- board ---------- */
.turnbar{display:flex;justify-content:center;min-height:42px}
.tchip{display:inline-flex;align-items:center;gap:8px;padding:7px 20px;border-radius:999px;font-weight:800;font-size:clamp(16px,1.6vw,22px);background:var(--tc);color:var(--tci);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px color-mix(in srgb,var(--tc) 60%,transparent)}50%{box-shadow:0 0 44px color-mix(in srgb,var(--tc) 95%,transparent)}}
.board{display:grid;grid-template-columns:repeat(7,1fr) 1.2fr 1.05fr;gap:clamp(5px,.7vw,10px)}
.bh{border-radius:14px;padding:6px 4px;text-align:center;font-weight:800;font-size:clamp(11px,1.1vw,16px);line-height:1.15;background:linear-gradient(180deg,#24305e,#18203f);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px}
.bh .ic{font-size:clamp(18px,2vw,28px)}
.bh.m{background:linear-gradient(180deg,#5b3a00,#3a2400);border-color:rgba(255,200,61,.5);color:var(--gold)}
.cell{border:0;border-radius:14px;min-height:clamp(58px,9.5vh,110px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;background:linear-gradient(180deg,#2b6cff,#1840b8);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.3);transition:transform .15s;position:relative;padding:4px}
.cell[data-l="1"]{background:linear-gradient(180deg,#8b4dff,#5a23c8)}
.cell[data-l="2"]{background:linear-gradient(180deg,#ff5a5a,#c81e3c)}
.cell.ms{background:linear-gradient(180deg,#ffc83d,#e08a00);color:#2a1600}
.cell.tk{background:linear-gradient(180deg,#3ee08a,#12925a);color:#04210f}
.bh.t{background:linear-gradient(180deg,#0f4d33,#08321f);border-color:rgba(47,210,122,.5);color:#7dffb4}
button.cell:hover{transform:translateY(-3px) scale(1.03)}
.cell .p{font-family:'Suez One';font-size:clamp(22px,2.6vw,40px);line-height:1}
.cell .l{font-size:clamp(11px,1vw,14px);font-weight:700;opacity:.85}
.cell.ms .p{font-size:clamp(14px,1.5vw,22px);font-family:'Suez One'}
.cell .ty{position:absolute;top:4px;inset-inline-start:6px;font-size:clamp(12px,1.1vw,16px)}
.cell.locked{filter:grayscale(.85) brightness(.55)}
.cell .lk{position:absolute;top:4px;inset-inline-end:6px;font-size:clamp(14px,1.3vw,20px)}
.sbl{display:flex;gap:3px;justify-content:center;margin:1px 0}.sbl i{font-style:normal;font-size:10px;font-weight:800;padding:0 4px;border-radius:5px;background:rgba(47,210,122,.25);color:#9dffc4}.sbl i.no{background:rgba(255,255,255,.07)}
.cell.used{background:rgba(255,255,255,.04)!important;box-shadow:none;color:rgba(255,255,255,.45);border:2px solid color-mix(in srgb,var(--uc) 70%,transparent)}
.cell.used .p{font-size:clamp(15px,1.4vw,22px);font-family:Rubik;font-weight:900;color:var(--uc)}
.cell.used .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- question ---------- */
#v-question{align-items:center;justify-content:center}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 14px;border-radius:999px;font-weight:800;background:var(--card);border:1px solid var(--line);font-size:clamp(13px,1.25vw,18px)}
.chip.val{background:linear-gradient(90deg,#ffb35c,#ff7a1a);color:#2a0f00;border:0}
.chip.fire{background:#ff3d00;border:0}
.chip.hint{background:#ffe066;color:#3a2a00;border:0}
.qcard{width:min(1150px,100%);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:28px;padding:clamp(16px,2.6vw,38px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:popin .45s}
.qwho{font-weight:800;font-size:clamp(15px,1.5vw,22px);margin-bottom:10px;display:inline-block;padding:5px 16px;border-radius:999px;background:color-mix(in srgb,var(--tc,#ff7a1a) 30%,transparent);border:2px solid var(--tc,#ff7a1a)}
.qtext{font-family:'Suez One';font-size:clamp(24px,3.4vw,52px);line-height:1.25}
.hintbox{margin-top:16px;display:inline-block;padding:10px 18px;border-radius:16px;background:#ffe066;color:#3a2a00;font-weight:800;font-size:clamp(16px,1.8vw,26px);animation:popin .5s}
.hintbox::before{content:'💡 ';}
.opt{display:inline-block;margin:3px;padding:5px 14px;border-radius:10px;background:rgba(0,0,0,.12)}
.quote{font-family:'Suez One';font-size:clamp(22px,2.8vw,42px);line-height:1.35}
.quote::before{content:'❝';display:block;font-size:1.6em;color:var(--gold);line-height:.8}
.wa{display:flex;gap:18px;align-items:flex-start;margin-top:6px;text-align:start}
.meter{flex:none;width:clamp(90px,10vw,140px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#3a2a00,#1a1300);border:4px solid var(--gold);box-shadow:0 0 30px rgba(255,200,61,.4)}
.meter b{font-family:'Suez One';font-size:clamp(34px,4vw,56px);color:var(--gold);line-height:1}
.meter small{font-weight:800;color:var(--gold)}
.clues{flex:1;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.clues li{padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:700;font-size:clamp(13px,1.3vw,19px);display:flex;gap:10px;align-items:center}
.clues li .n{font-family:'Suez One';color:var(--gold);min-width:1.6em}
.clues li.new{background:rgba(255,200,61,.24);animation:popin .5s;outline:2px solid var(--gold)}
.clues li.hid{opacity:.28}
.locks{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.lock{padding:6px 16px;border-radius:999px;font-weight:800;background:var(--lc);color:var(--lci)}
.lock.off{opacity:.35;text-decoration:line-through}
.rfg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.rfc{position:relative;padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid var(--line);font-weight:900;font-size:clamp(15px,1.7vw,24px);display:flex;flex-direction:column;align-items:center;gap:4px}
.rfo{font-size:.62em;font-weight:600;color:#cdd3e6;line-height:1.3;text-align:center}
.rft{display:none;font-size:.7em}
.rfd{display:flex;gap:4px;min-height:12px}.rfd i{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.rfg.rev .rfc{animation:rflip .5s both;animation-delay:var(--dl)}
.rfg.rev .rfc.real{animation-name:rreal}.rfg.rev .rfc .rft{display:block}
.rfg.rev .rfc.fake{animation-name:rfake}
@keyframes rreal{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:none;opacity:.55;border-color:#2fd27a;background:rgba(47,210,122,.12)}}
@keyframes rfake{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1.08);background:#c92a2a;border-color:#ff6b6b;box-shadow:0 0 30px #ff6b6b}}
.rfg.rev .rfc .rft{opacity:0;animation:rshow .2s forwards;animation-delay:calc(var(--dl) + .25s)}
@keyframes rshow{to{opacity:1}}
.pair{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px);margin-top:12px}
.tm{width:clamp(170px,25vw,330px);aspect-ratio:1.5;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Suez One';font-size:clamp(20px,2.4vw,36px);padding:12px;background:var(--tmc,#333);color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.4);text-shadow:0 2px 6px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.3)}
.tm.spin{animation:spinf .12s linear infinite}
.ltbox{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;font-weight:800;font-size:clamp(16px,1.7vw,24px)}
.ltt{font-family:'Suez One';font-size:clamp(34px,4vw,60px);color:#fff;padding:2px 18px;border-radius:16px;background:var(--tc);box-shadow:0 0 30px var(--tc)}
.tm.lt{width:clamp(150px,18vw,240px);aspect-ratio:1;font-size:clamp(90px,12vw,170px);--tmc:linear-gradient(180deg,#ff8a00,#e52e00);background:linear-gradient(180deg,#ff9a2a,#d93d00);line-height:1}
@keyframes spinf{50%{transform:translateY(-6px) scale(.97)}}
.plus{font-family:'Suez One';font-size:clamp(30px,4vw,60px);color:var(--gold)}
.pp{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,26px);margin-top:18px}
.ppt{padding:12px 22px;border-radius:16px;font-weight:900;font-size:clamp(18px,2vw,28px);background:color-mix(in srgb,var(--tc) 25%,transparent);border:3px solid var(--tc);opacity:.5;transition:.3s}
.ppt.on{opacity:1;background:var(--tc);color:var(--tci);transform:scale(1.1);box-shadow:0 0 30px var(--tc)}
.ppb{display:flex;flex-direction:column;align-items:center;min-width:110px}
.ppball{font-size:40px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.ppball.r{transform:translateX(40px) rotate(-20deg)}.ppball.l{transform:translateX(-40px) rotate(20deg)}
.ppn{font-family:'Suez One';font-size:36px;color:var(--gold);line-height:1}
.ppb small{color:var(--muted);font-weight:700}
.ppw{margin-top:14px;font-weight:900;color:#ffe066;font-size:clamp(16px,1.8vw,24px)}
.hl{display:flex;gap:16px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.hlbox{min-width:170px;padding:12px 20px;border-radius:18px;border:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,transparent)}
.hlbox small{display:block;font-weight:800;color:#dfe4f3;font-size:clamp(13px,1.2vw,17px)}
.hlbox b{font-family:'Suez One';font-size:clamp(30px,4vw,56px);line-height:1.2}
.hlbox.rev{--tc:#ffc83d;animation:popin .5s}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:none;opacity:1}}

/* ---------- host bar ---------- */
.hostbar{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 12px;background:rgba(5,8,18,.8);border-top:1px solid var(--line)}
.hb-l{font-weight:800;color:var(--muted)}
.hb-tip{color:var(--muted);font-weight:700}
.cb{font-family:Rubik;font-weight:800;font-size:15px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:#26305a;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.cb:disabled{opacity:.35;cursor:default}
.cb.ok{background:#1f9d55;border-color:#2fd27a}
.cb.no{background:#c92a2a;border-color:#ff6b6b}
.cb.hint{background:#f2b705;color:#2a1a00;border-color:#ffe066}
.cb.fire{background:linear-gradient(180deg,#ff8a00,#e52e00);border:0}
.cb.go{background:linear-gradient(180deg,#ffb35c,#ff7a1a);color:#2a0f00;border:0}
.cb.sm{font-size:13px;padding:7px 11px;background:rgba(255,255,255,.08)}
.cb.tsel.on{outline:3px solid #fff;background:#3b4a8a}
.cb.sent{animation:sent .5s}
@keyframes sent{50%{transform:scale(.93);filter:brightness(1.4)}}
.trow{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.05);border-inline-start:6px solid var(--tc)}
.trow .tn{font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hlin{width:160px;font-size:20px;font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff}
.cl{font-weight:800}

/* ---------- court ---------- */
.court{flex:none;height:var(--court);position:relative;display:flex;align-items:stretch;overflow:hidden;border-top:2px solid rgba(255,255,255,.12)}
.floor{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 35%),repeating-linear-gradient(90deg,#4d4463 0 98px,#2e2742 98px 101px),repeating-linear-gradient(0deg,#4d4463 0 30px,#2e2742 30px 33px);background-blend-mode:multiply;box-shadow:inset 0 14px 24px rgba(0,0,0,.35)}
.floor::before{content:'';position:absolute;left:50%;top:50%;width:min(28vw,280px);height:78%;border:3px dashed rgba(255,214,120,.55);border-radius:50%;transform:translate(-50%,-50%)}
.floor::after{content:'';position:absolute;left:50%;top:50%;width:min(20vw,200px);height:52%;border:3px solid rgba(185,164,255,.6);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 24px rgba(185,164,255,.5)}
.paint{position:absolute;top:0;bottom:0;width:15%;opacity:.55}
.paint.p0{right:0;background:var(--t0);clip-path:polygon(0 0,100% 0,100% 100%,18% 100%)}
.paint.p1{left:0;background:var(--t1);clip-path:polygon(0 0,100% 0,82% 100%,0 100%)}
.half{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.half[data-t="0"]{--tc:var(--t0);--tci:var(--t0i)}.half[data-t="1"]{--tc:var(--t1);--tci:var(--t1i)}
.half::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 75% at 50% 100%,color-mix(in srgb,var(--tc) 50%,transparent),transparent 70%);opacity:0;transition:.4s}
.half.active::before{opacity:1}

.arms-up{display:none}.up .arms-up{display:inline}.up .arms-down{display:none}
.half.active .player{animation:bob 1.2s ease-in-out infinite;animation-delay:var(--d)}
.half.active .ball{animation:drib .5s ease-in infinite alternate}
@keyframes drib{to{transform:translateY(60px)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.half.jump .player,.half.celebrate .player{animation:jump .95s cubic-bezier(.3,.7,.4,1) both;animation-delay:var(--d)}

@keyframes jump{0%{transform:none}12%{transform:scaleY(.9)}42%{transform:translateY(-30%)}72%{transform:scaleY(.94)}86%{transform:translateY(-6%)}100%{transform:none}}
.center{flex:none;width:clamp(170px,19vw,280px);display:flex;align-items:center;justify-content:center;z-index:2;padding-bottom:4%}

/* ---------- scene ---------- */
.scene{position:fixed;inset:0;z-index:50;display:none;background:#070b18;overflow:hidden}
.scene.on{display:block}
.scene svg{position:absolute;inset:0;width:100%;height:100%}

@keyframes shake{20%{transform:translate(-14px,7px)}40%{transform:translate(12px,-9px)}60%{transform:translate(-9px,5px)}80%{transform:translate(6px,-3px)}}
.scap{position:absolute;top:4%;left:0;right:0;text-align:center;pointer-events:none}

.scap .c2.show{animation:fadeup .5s .2s forwards}

@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sans{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:rgba(7,11,24,.9);border:3px solid var(--gold);border-radius:20px;padding:12px 28px;font-size:clamp(18px,2.4vw,36px);font-weight:900;text-align:center;opacity:0;max-width:86vw}

.sback{position:absolute;bottom:18px;left:18px;font-size:18px!important;padding:12px 20px!important}
.fan{transition:transform .4s}

.farms{opacity:0;transition:opacity .2s}
.cheer .farms{opacity:1}

/* ================= online 2-player (Firebase Realtime Database) =================
   Set window.FANTASY_FIREBASE_CONFIG = {apiKey, authDomain, databaseURL, projectId, appId} before this script.
   The host's browser runs the game; the guest's browser mirrors it and sends picks and answers.
   For local testing without Firebase add ?net=local to the URL (two tabs of the same site). */
const FB_CFG=(typeof window!=="undefined"&&window.FANTASY_FIREBASE_CONFIG)||null;
const NETLOCAL=typeof location!=="undefined"&&/[?&]net=local/.test(location.search);

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function localDB(){const bc=new BroadcastChannel("fantasy-net");let data={};const L=[];
 const get=p=>p.split("/").filter(Boolean).reduce((o,k)=>o==null?undefined:o[k],data);
 const setAt=(p,v)=>{const ks=p.split("/").filter(Boolean);let o=data;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=="object"||!o[ks[i]])o[ks[i]]={};o=o[ks[i]]}const k=ks[ks.length-1];if(v===null||v===undefined)delete o[k];else o[k]=JSON.parse(JSON.stringify(v))};
 const snap=(k,v)=>({key:k,val:()=>v===undefined?null:JSON.parse(JSON.stringify(v))});
 const fire=()=>L.slice().forEach(l=>{const v=get(l.p);if(l.kind==="value"){const s=JSON.stringify(v===undefined?null:v);if(s!==l.last){l.last=s;l.cb(snap(null,v))}}else if(v&&typeof v==="object")Object.keys(v).forEach(k=>{if(!l.seen.has(k)){l.seen.add(k);l.cb(snap(k,v[k]))}})});
 bc.onmessage=e=>{const m=e.data;if(m.op==="set"){setAt(m.p,m.v);fire()}else if(m.op==="hello")bc.postMessage({op:"dump",v:data});else if(m.op==="dump"&&!Object.keys(data).length){data=m.v||{};fire()}};
 bc.postMessage({op:"hello"});
 const api={ref:p=>({set(v){setAt(p,v);bc.postMessage({op:"set",p,v:v===undefined?null:v});setTimeout(fire);return Promise.resolve()},
  update(v){Object.keys(v).forEach(k=>api.ref(p+"/"+k).set(v[k]));return Promise.resolve()},remove(){return this.set(null)},
  push(v){return api.ref(p+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)).set(v)},
  once(){const v=get(p);return Promise.resolve(snap(null,v))},
  orderByChild(){return this},limitToLast(){return this},
  on(kind,cb){L.push({p,kind,cb,last:undefined,seen:new Set()});setTimeout(fire)},
  off(){for(let i=L.length-1;i>=0;i--)if(L[i].p===p)L.splice(i,1)},
  onDisconnect(){return{remove(){},set(){},update(){}}}})};
 return api}

  if(m&&(FB_CFG||NETLOCAL))netDB().then(db=>db.ref("players").push(rec)).catch(()=>{});
  if(m)px("Lead",{content_name:"zira",newsletter:nl?1:0});
  cb()};
 $("#gGo").onclick=go;$("#gMail").onkeydown=e=>{if(e.key==="Enter")go()}}

/* keyboard-aware layout (mobile): keep the question visible above the on-screen keyboard */
(function(){const vv=window.visualViewport,coarse=matchMedia("(pointer:coarse)").matches;
 function fit(){if(vv){document.documentElement.style.setProperty("--vvh",vv.height+"px");if(vv.offsetTop)window.scrollTo(0,0)}}
 function show(){const q=$("#qbody");if(q&&q.scrollIntoView)try{q.scrollIntoView({block:"start"})}catch(e){}}
 if(vv){vv.addEventListener("resize",()=>{fit();if(document.body.classList.contains("kb"))show()});vv.addEventListener("scroll",fit);fit()}
 if(!coarse)return;
 document.addEventListener("focusin",e=>{if(e.target&&e.target.id==="ansIn"){document.body.classList.add("kb");setTimeout(show,250)}});
 document.addEventListener("focusout",e=>{if(e.target&&e.target.id==="ansIn")setTimeout(()=>{if(document.activeElement!==$("#ansIn"))document.body.classList.remove("kb")},150)});
})();
